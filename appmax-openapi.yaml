                $ref: '#/components/schemas/PagarmeMessageEnvelope'
        '500':
          description: Erro interno ao criar o recebedor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagarmeMessageEnvelope'
              examples:
                default:
