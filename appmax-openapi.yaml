  /v1/p/recipients/{recipient_hash}/balance:
    get:
      operationId: getRecipientBalancePagarme
      tags: [PagarMe]
      summary: Consultar saldo do recebedor (contrato PagarMe)
      description: |
        Retorna o saldo de um recebedor no formato da PagarMe v5
        (`GET /core/v5/recipients/{recipient_id}/balance`). Todos os valores
        vêm em **centavos**.

        | Campo | O que é |
        | --- | --- |
        | `available_amount` | Saldo disponível: já liberado e sacável agora. |
        | `waiting_funds_amount` | Saldo a liberar: já creditado, com data de liberação futura. |
        | `transferred_amount` | Total já transferido para a conta bancária do recebedor. |
        | `currency` | Moeda dos saldos (ISO 4217). `BRL` quando o recebedor ainda não tem saldo. |

        **Como o `transferred_amount` é calculado:** é a soma do valor
        **líquido** (descontada a taxa de saque) dos saques já pagos ou com
        liquidação concluída, inclusive os de antecipação. É o valor que bate
        com o extrato bancário do recebedor. Saques pendentes, aprovados, em
        processamento ou recusados não entram na soma.

        ::: warning Limitação
        Saques com liquidação **parcial** ainda não entram no
        `transferred_amount`.
        :::

        O bloco `recipient` traz o resumo do recebedor (`id`, `name`,
        `email`, `document`, `type`, `status`, `created_at` e `updated_at`).

        Um recebedor que ainda não recebeu nenhum valor retorna os saldos
        zerados. Um recebedor inexistente ou cadastrado por outro marketplace
        retorna `404`.
      parameters:
        - $ref: '#/components/parameters/PagarmeRecipientHash'
      responses:
        '200':
          description: Saldo do recebedor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PagarmeRecipientBalance'
              examples:
                default:
                  value:
                    data:
                      currency: BRL
                      available_amount: 152030
                      waiting_funds_amount: 489900
                      transferred_amount: 1250000
                      recipient:
                        id: 0a0c3269-b5fa-543b-b9ad-1cf27d0944c1
                        name: Maria Souza
                        email: maria.souza@exemplo.com
                        document: '35873882029'
                        type: individual
                        status: active
                        created_at: '2026-10-07T14:32:10Z'
                        updated_at: '2026-10-07T15:02:44Z'
                semSaldo:
                  summary: Recebedor que ainda não recebeu valores
                  value:
                    data:
                      currency: BRL
                      available_amount: 0
                      waiting_funds_amount: 0
                      transferred_amount: 0
                      recipient:
                        id: 0a0c3269-b5fa-543b-b9ad-1cf27d0944c1
                        name: Maria Souza
                        email: maria.souza@exemplo.com
                        document: '35873882029'
                        type: individual
                        status: registration
                        created_at: '2026-10-07T14:32:10Z'
                        updated_at: '2026-10-07T14:32:10Z'
        '403':
          $ref: '#/components/responses/PagarmeForbidden'
        '404':
          $ref: '#/components/responses/PagarmeRecipientNotFound'
        '500':
          description: Erro interno.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagarmeMessageEnvelope'
              examples:
                default:
                  value:
                    data:
                      message: Recipient balance retrieval error

  /v1/p/recipients/{recipient_hash}/transfer-settings:
    patch:
      operationId: updateRecipientTransferSettingsPagarme
      tags: [PagarMe]
      summary: Configurar saque automático (contrato PagarMe)
      description: |
        Liga ou desliga o **saque automático** do recebedor usando o contrato
        da PagarMe v5 (`PATCH /core/v5/recipients/{recipient_id}/transfer-settings`).

        A Appmax aceita **só a configuração que executa hoje**: saque
        **diário**, em dia útil, às 08:00, de **todo o saldo disponível**,
        para a conta bancária padrão do recebedor. Qualquer outra
        configuração retorna `422`, em vez de ser aceita sem efeito.

        | Campo | Aceito | Fora disso |
        | --- | --- | --- |
        | `transfer_enabled` | `true` ou `false` (obrigatório) | `422` |
        | `transfer_interval` | `daily`, em qualquer capitalização (`Daily`, `DAILY`) | `weekly` e `monthly` retornam `422` |
        | `transfer_day` | `0` | `422` |

        **Ligar:**

        - exige que o recebedor já esteja aprovado (`status: active`) e tenha
          conta bancária padrão; sem isso, a rota retorna `422`;
        - reenviar a configuração com o saque já ligado não cria um segundo
          agendamento.

        **Desligar:** cancela o saque automático. Não tem pré-condição, e
        desligar um saque que já está desligado não tem efeito.

        ::: warning O que considerar
        - "Dia útil" é de segunda a sexta: o saque também roda em feriado
          bancário.
        - Se a empresa do recebedor estiver com o credenciamento bloqueado, o
          saque automático não roda, e o `status` do recebedor continua
          `active`.
        - Se a conta padrão for trocada em
          [Alterar domicílio bancário](/api-reference/pagarme/alterar-domicilio-bancario),
          os próximos saques vão para a conta nova.
        :::

        A resposta é o recebedor completo, com `transfer_settings` refletindo
        a configuração que ficou valendo.
      parameters:
        - $ref: '#/components/parameters/PagarmeRecipientHash'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PagarmeTransferSettingsInput'
            examples:
              ligar:
                summary: Ligar o saque automático
                value:
                  transfer_enabled: true
                  transfer_interval: Daily
                  transfer_day: 0
              desligar:
                summary: Desligar o saque automático
                value:
                  transfer_enabled: false
                  transfer_interval: Daily
                  transfer_day: 0
      responses:
        '200':
          description: Configuração aplicada. O corpo traz o recebedor completo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PagarmeRecipient'
              examples:
                ligado:
                  summary: Trecho da resposta com o saque ligado
                  value:
                    data:
                      id: 0a0c3269-b5fa-543b-b9ad-1cf27d0944c1
                      status: active
                      transfer_settings:
                        transfer_enabled: true
                        transfer_interval: Daily
                        transfer_day: 0
        '403':
          $ref: '#/components/responses/PagarmeForbidden'
        '404':
          $ref: '#/components/responses/PagarmeRecipientNotFound'
        '422':
          description: |
            Configuração fora da aceita, recebedor ainda não aprovado ou sem
            conta bancária padrão. Nada é alterado. A mensagem informa o valor
            aceito.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PagarmeFieldErrors'
                  - $ref: '#/components/schemas/PagarmeMessageEnvelope'
        '500':
          description: Erro interno.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagarmeMessageEnvelope'

  /v1/p/recipients/{recipient_hash}/automatic-anticipation-settings:
    patch:
      operationId: updateRecipientAutomaticAnticipationSettingsPagarme
      tags: [PagarMe]
      summary: Configurar antecipação automática (contrato PagarMe)
      description: |
        Liga ou desliga a **antecipação automática** do recebedor usando o
        contrato da PagarMe v5
        (`PATCH /core/v5/recipients/{recipient_id}/automatic-anticipation-settings`).

        A Appmax aceita **só a configuração que executa hoje**: antecipação de
        **todo o saldo a liberar**, em dia útil, às 08:00, para a conta
        bancária padrão do recebedor. Qualquer outra configuração retorna
        `422`.

        | Campo | Aceito | Fora disso |
        | --- | --- | --- |
        | `enabled` | `true` ou `false` (obrigatório) | `422` |
        | `type` | `full` | `422`; `1025` (antecipação de vendas inteiras) não é suportado |
        | `volume_percentage` | `100` (número ou texto) | `422` |
        | `delay` | ausente, `null` ou igual à janela de liberação atual do recebedor | `422`: a janela não é configurável por aqui |
        | `days` | ausente ou `[]` (todo dia útil) | `422`: dias específicos do mês não são suportados |

        **Ligar:**

        - exige que o recebedor já esteja aprovado (`status: active`) e tenha
          conta bancária padrão; sem isso, a rota retorna `422`;
        - exige que o fluxo de recebíveis da empresa do recebedor suporte
          antecipação; caso contrário, `422`;
        - reenviar a configuração com a antecipação já ligada não cria um
          segundo agendamento.

        **Desligar:** cancela a antecipação automática. Não tem pré-condição.

        A janela de liberação (`delay`) não muda por esta rota, nem para este
        recebedor nem para os outros recebedores do marketplace.

        ::: warning O que considerar
        - "Dia útil" é de segunda a sexta: a antecipação também roda em
          feriado bancário.
        - Se a empresa do recebedor estiver com o credenciamento bloqueado, a
          antecipação automática não roda, e o `status` do recebedor continua
          `active`.
        :::

        A resposta é o recebedor completo, com
        `automatic_anticipation_settings` refletindo a configuração que ficou
        valendo. `delay` traz a janela de liberação atual.
      parameters:
        - $ref: '#/components/parameters/PagarmeRecipientHash'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PagarmeAnticipationSettingsInput'
            examples:
              ligar:
                summary: Ligar a antecipação automática
                value:
                  enabled: true
                  type: full
                  volume_percentage: '100'
                  days: []
              desligar:
                summary: Desligar a antecipação automática
                value:
                  enabled: false
                  type: full
                  volume_percentage: '100'
      responses:
        '200':
          description: Configuração aplicada. O corpo traz o recebedor completo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PagarmeRecipient'
              examples:
                ligado:
                  summary: Trecho da resposta com a antecipação ligada
                  value:
                    data:
                      id: 0a0c3269-b5fa-543b-b9ad-1cf27d0944c1
                      status: active
                      automatic_anticipation_settings:
                        enabled: true
                        type: full
                        volume_percentage: 100
                        delay: 30
                        days: []
        '403':
          $ref: '#/components/responses/PagarmeForbidden'
        '404':
          $ref: '#/components/responses/PagarmeRecipientNotFound'
        '422':
          description: |
            Configuração fora da aceita, recebedor ainda não aprovado, sem
            conta bancária padrão ou fora do fluxo de recebíveis que suporta
            antecipação. Nada é alterado. A mensagem informa o valor aceito.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PagarmeFieldErrors'
                  - $ref: '#/components/schemas/PagarmeMessageEnvelope'
        '500':
          description: Erro interno.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagarmeMessageEnvelope'

  /v1/recipient/{recipient_hash}/orders:
    get:
      operationId: listRecipientOrders
      tags: [Split]
      summary: Listar pedidos do recebedor
      description: |
        Lista, de forma paginada, os pedidos do merchant autenticado em que o
        recebedor participou do split, do mais recente para o mais antigo.
        Cada página traz até **100 pedidos**.

        Para cada pedido são retornados o valor total (`total`), o valor
        líquido (`liquid_total`) e quanto foi destinado ao recebedor
        (`recipient_amount`). Se o recebedor tiver mais de um split no mesmo
        pedido, o pedido aparece uma única vez e `recipient_amount` traz a soma
        dos splits.

        ::: info Valores em centavos
        Todos os valores da resposta (`total`, `liquid_total` e
        `recipient_amount`) são inteiros **em centavos**.
        :::
      parameters:
        - $ref: '#/components/parameters/RecipientHash'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Página a ser retornada.
          example: 1
      responses:
        '200':
          description: Pedidos retornados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRecipientOrdersResponse'
              examples:
                default:
                  value:
                    data:
                      - order_id: 501
                        total: 30000
                        liquid_total: 28550
                        recipient_amount: 10000
                      - order_id: 500
                        total: 15000
                        liquid_total: 14230
                        recipient_amount: 4035
                    meta:
                      page: 1
                      pages: 1
                      total: 2
                      limit: 100
                empty:
                  summary: Recebedor sem pedidos
                  value:
                    data: []
                    meta:
                      page: 1
                      pages: 0
                      total: 0
                      limit: 100
        '403':
          description: Token ausente ou inválido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        description: Token de autenticação ausente
                        example: Missing Authentication Token
        '404':
          description: Recebedor não encontrado ou não cadastrado pelo merchant autenticado.
          content:
            application/json:
              examples:
                default:
                  value:
                    error: Recipient not found
        '422':
          description: Parâmetro `page` inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
        '500':
          description: Erro interno.
          content:
            application/json:
              examples:
                default:
                  value:
                    error: Internal Server Error

  /v1/orders/{orderId}/split-order:
    post:
      operationId: createOrderSplit
      tags: [Split]
      summary: Criar split de pedido
      description: |
        Divide o valor líquido de um pedido entre um ou mais recebedores. Os
        valores são informados em **centavos** e cada linha referencia um
        `recipient_hash` previamente aprovado (`Onboarding completed`).

        ::: tip Valores e taxas
        O split é limitado ao `partner_total` — valor do pedido menos as taxas
        da Appmax. A taxa é descontada automaticamente do marketplace; **não
        envie taxa no payload**. Se a soma ultrapassar o `partner_total`, a
        divisão é proporcional e o último recebedor recebe apenas o residual,
        **sem retorno de erro**.
        :::
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
          description: ID do pedido na Appmax.
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSplitOrderRequest'
            examples:
              default:
                value:
                  split:
                    - amount: 1000
                      recipient_hash: d9bd0dae-3274-5e5a-939f-f50d867eb652
                      refund_charge_percentage: 0
                    - amount: 500
                      recipient_hash: d9bd0dae-3274-5e5a-939f-f50d867eb653
                      refund_charge_percentage: 0
      responses:
        '201':
          description: Split criado com sucesso.
          content:
            application/json:
              examples:
                default:
                  value:
                    message: Split order created successfully
        '422':
          description: Erro de validação dos itens do split.

  /v1/recipient/{recipient_hash}/balances:
    get:
      operationId: getRecipientBalances
      tags: [Split]
      summary: Consultar saldos do recebedor
      description: |
        Retorna os saldos financeiros do recebedor. Pode haver dois tipos:
        - `available` — saldo disponível para saque imediato.
        - `to_release` — saldo ainda em compensação (pode ser antecipado).
      parameters:
        - $ref: '#/components/parameters/RecipientHash'
      responses:
        '200':
          description: Saldos retornados.
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      - type: available
                        value: '150.00'
                      - type: to_release
                        value: '250.00'
        '404':
          description: Saldos não provisionados para esse recebedor.
        '500':
          description: Erro interno.

  /v1/recipient/{recipient_hash}/withdraw-request/anticipation/simulate:
    get:
      operationId: simulateAnticipation
      tags: [Split]
      summary: Simular antecipação de saque
      description: |
        Simula a antecipação de um saque e retorna valor bruto, valor líquido,
        taxa aplicada e percentual da taxa.

        ::: info
        **Nenhuma solicitação de saque é criada** por este endpoint. Ele é
        puramente informativo, para cálculo antes da confirmação real.
        :::
      parameters:
        - $ref: '#/components/parameters/RecipientHash'
        - name: value
          in: query
          required: true
          schema:
            type: string
          description: Valor do saque a simular em **centavos**.
          example: '10000'
      responses:
        '200':
          description: Simulação concluída.
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      value: 10000
                      net_value: 4700
                      withdraw_tax: 300
                      tax_percentage: 300
        '404':
          description: Recebedor não encontrado.
        '422':
          description: Conta bancária inválida.
        '423':
          description: Saque já em andamento.
        '500':
          description: Erro interno.

  /v1/recipient/{recipient_hash}/withdraw-request/anticipation:
    post:
      operationId: requestAnticipation
      tags: [Split]
      summary: Solicitar antecipação de saque
      description: |
        Cria uma solicitação real de antecipação usando saldo do tipo
        `to_release`. Ao contrário da simulação, este endpoint efetivamente
        movimenta o saldo.
      parameters:
        - $ref: '#/components/parameters/RecipientHash'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawRequestBody'
            examples:
              default:
                value:
                  value: 1000
      responses:
        '201':
          description: Antecipação criada com status `2 = pending`.
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      withdraw_request_id: 1
                      status: 2
                      value: 10000
                      net_value: 4700
                      withdraw_tax: 5000
        '403':
          description: '`Withdraw not allowed` (pode indicar `withdrawal_blocked`).'
        '404':
          description: Recebedor não encontrado.
        '409':
          description: Saque em andamento para o mesmo recebedor.
        '422':
          description: Validação de input ou regra de negócio (saldo insuficiente, limite, conta inválida).
        '500':
          description: Erro interno.

  /v1/recipient/{recipient_hash}/withdraw-request/available:
    post:
      operationId: requestAvailableWithdraw
      tags: [Split]
      summary: Solicitar saque com saldo disponível
      description: |
        Cria uma solicitação de saque usando o saldo **available**. Sem taxa
        de antecipação — o saldo já está liberado.

        ::: tip
        Se o recebedor tem `to_release` mas não `available`, este endpoint
        retorna `Insufficient balance`. Nesse caso, use
        [antecipação](/api-reference/split/antecipacao).
        :::
      parameters:
        - $ref: '#/components/parameters/RecipientHash'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawRequestBody'
            examples:
              default:
                value:
                  value: 1000
      responses:
        '201':
          description: Saque criado com status `2 = pending`.
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      withdraw_request_id: 1
                      status: 2
                      value: 0
                      net_value: 0
                      withdraw_tax: 0
        '403':
          description: Saque não permitido.
        '404':
          description: Recebedor não encontrado.
        '409':
          description: Saque em andamento.
        '422':
          description: Validação ou regra de negócio (`Insufficient balance`, `Invalid bank account`).
        '500':
          description: Erro interno.

  /v1/withdraw-request/{withdrawRequestId}:
    get:
      operationId: getWithdrawRequest
      tags: [Split]
      summary: Consultar solicitação de saque
      description: |
        Retorna os detalhes de uma solicitação de saque específica pelo seu
        identificador (`withdrawRequestId`), incluindo status atual, valores
        e a conta bancária vinculada.

        Cobre tanto solicitações criadas via
        [saldo disponível](/api-reference/split/saque-disponivel) quanto via
        [antecipação](/api-reference/split/antecipacao).
      parameters:
        - name: withdrawRequestId
          in: path
          required: true
          schema:
            type: integer
          description: ID da solicitação de saque.
          example: 1234
      responses:
        '200':
          description: Solicitação encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWithdrawRequestResponse'
              examples:
                default:
                  value:
                    data:
                      withdraw_request_id: 69
                      status: pending
                      net_value: 984
                      gross_value: 1000
                      withdraw_tax: 0
                      currency: BRL
                      created_at: '2025-12-30 11:08:04'
                      source_type: recipient
                      source_id: 4471b2d1-5e30-5f4d-a64b-c18d72c82a79
                      bank_account:
                        id: 9
                        bank: '66'
                        agency: '512'
                        account: '9260373'
                        name: null
                        type: national_pj
                        profile: CC
                        register_number: null
                        pix_key: test@test.com
                        bank_account_type: null
        '403':
          description: Não autorizado.
          content:
            application/json:
              examples:
                default:
                  value:
                    message: Unauthorized
        '404':
          description: Solicitação de saque não encontrada.
          content:
            application/json:
              examples:
                default:
                  value:
                    error: Withdraw request not found
        '500':
          description: Erro interno.
          content:
            application/json:
              examples:
                default:
                  value:
                    error: Internal Server Error

  /v1/subscriptions:
    get:
      operationId: listSubscriptions
      tags: [Subscriptions]
      summary: Listar assinaturas
      description: |
        Lista as assinaturas da loja, com paginação e filtros por e-mail, status e
        intervalo de próxima cobrança. Retorna 10 itens por página.

        Informe **pelo menos um** entre `email`, `next_charge_from` e
        `next_charge_to`. Os filtros são combináveis: `email` sozinho devolve as
        assinaturas daquele cliente, o intervalo sozinho devolve as da loja inteira
        que cobram no período, e juntos devolvem as daquele cliente no período.
        As duas pontas do intervalo são opcionais entre si: só `next_charge_to`
        lista o que vai cobrar de agora até aquela data.

        ::: warning Formato de data na listagem
        Nesta rota `next_charge_at` e `charges[].charged_at` vêm no formato
        `dd/mm/aaaa`. No detalhe da assinatura, `next_charge_at` vem como
        `aaaa-mm-dd hh:mm:ss`. Já os filtros `next_charge_from` e `next_charge_to`
        são informados como `aaaa-mm-dd`.
        :::
      parameters:
        - name: email
          in: query
          required: false
          schema:
            type: string
            format: email
          description: |
            E-mail do cliente. Obrigatório quando nem `next_charge_from` nem
            `next_charge_to` forem informados.
          example: cliente@exemplo.com
        - name: next_charge_from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: |
            Data inicial da próxima cobrança, no formato `aaaa-mm-dd` e no fuso de
            Brasília. Considera o dia inteiro. Pode ser usada sozinha, para listar
            tudo que cobra a partir daquele dia. Quando omitida e `next_charge_to`
            for informada, o início passa a ser o momento atual — ou seja, a
            listagem traz o que ainda vai cobrar daqui até a data final.
          example: '2026-09-18'
        - name: next_charge_to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: |
            Data final da próxima cobrança, no formato `aaaa-mm-dd` e no fuso de
            Brasília. Considera o dia inteiro, então informar a mesma data em
            `next_charge_from` e `next_charge_to` lista as cobranças daquele dia.
            Deve ser maior ou igual a `next_charge_from`. Sozinha, lista o que vai
            cobrar do momento atual até essa data.
          example: '2026-09-18'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ACTIVE, PAUSED, CANCELLED, OVERDUE]
          description: |
            Filtra pelo status da assinatura. Aceita `ACTIVE`, `PAUSED`, `CANCELLED`
            e `OVERDUE`. Sem filtro, a listagem devolve todos os status, incluindo
            `SUSPENDED` e `FINISHED` — veja `status` no item da listagem.

            Ao usar o intervalo de próxima cobrança sem informar `status`, a listagem
            traz apenas o que de fato será cobrado no período: assinaturas `ACTIVE`
            não pausadas e `OVERDUE`. Informando `status`, ele prevalece e o intervalo
            apenas recorta aquele status.
          example: ACTIVE
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Página da listagem.
          example: 1
      responses:
        '200':
          description: Lista de assinaturas retornada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSubscriptionsResponse'
              examples:
                default:
                  value:
                    data:
                      subscriptions:
                        - subscription_id: 10
                          status: ACTIVE
                          products:
                            - name: Camiseta Preta
                              price: 199.9
                              quantity: 1
                              shopify_product_id: null
                              variant_id: null
                              product_id: 55
                              image_url: null
                              compare_at_price: null
                          value: 199.9
                          freight_value: 19.9
                          current_cycle: 3
                          customer:
                            name: Maria Silva
                            email: cliente@exemplo.com
                            document: '12345678909'
                            phone: '11999999999'
                            address:
                              country: BR
                              street: Rua São Bento
                              number: '111'
                              complement: Bloco 7
                              district: Centro
                              city: São Paulo
                              state: SP
                              postcode: '01010000'
                          payment:
                            payment_info:
                              brand: visa
                              final: '1234'
                              expiration: null
                          charges:
                            - cycle: 1
                              order_id: 12346
                              shopify_order_id: null
                              charged_at: 15/07/2026
                              value: 199.9
                              status: paid
                          next_charge_at: 15/08/2026
                      pagination:
                        total: 1
                        per_page: 10
                        current_page: 1
                        last_page: 1
        '422':
          description: Parâmetros inválidos (por exemplo, `email` ausente ou inválido).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
              examples:
                default:
                  value:
                    errors:
                      message:
                        email:
                          - The email field is required.
        '500':
          description: Erro ao listar as assinaturas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
              examples:
                default:
                  value:
                    errors:
                      message: Erro ao listar as assinaturas.
    post:
      operationId: createSubscription
      tags: [Subscriptions]
      summary: Criar assinatura
      description: |
        Cria uma assinatura a partir de um pedido existente. O pedido informado
        em `order_id` é transformado em uma cobrança recorrente.

        ::: warning Pré-requisitos do pedido
        - Deve existir e pertencer à mesma loja das credenciais.
        - Forma de pagamento deve ser **cartão de crédito** ou **PIX**.
        - Status deve ser **aprovado** ou **integrado** (ou seja, já liberado pelo antifraude).
        :::

        Um mesmo pedido pode originar mais de uma assinatura.

        ::: tip Pedidos originados de um checkout Shopify
        Quando o pedido tem carrinho Shopify vinculado, `products` é **obrigatório** e
        cada item precisa de `shopify_product_id` **e** `shopify_variant_id` (o preço é
        lido da variante na Shopify, não do payload).

        - Com `interval` informado, a cadência enviada vale para todos os itens.
        - Sem `interval`, a cadência vem do plano de assinatura da variante e todos os
          itens precisam ter a mesma frequência.
        :::
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionRequest'
            examples:
              default:
                value:
                  order_id: 12345
                  interval: month
                  interval_count: 1
                  max_cycles: 12
                  products:
                    - product_id: 55
                      quantity: 1
                  freight_value: 19.9
                  discount: 10.0
      responses:
        '201':
          description: Assinatura criada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSubscriptionResponse'
              examples:
                default:
                  value:
                    data:
                      id: 10
                      uuid: 6f1c0f1e-6a1c-4a2b-9f0e-3d5c7a9b1234
                      status: active
                      subscription_status_id: 1
                      interval: month
                      interval_count: 1
                      interval_name: Mensal
                      charge_day: 15
                      fail_max_tries: 3
                      fail_interval_hours: 24
                      max_cycles: 12
                      completed_cycles: 0
                      current_cycle: 1
                      next_charge_at: '2026-08-15 00:00:00'
                      created_at: '2026-07-15 10:00:00'
                      freight_value: 19.9
                      products:
                        - name: Camiseta Preta
                          price: 199.9
                          quantity: 1
                          product_id: 55
                          shopify_product_id: null
                          variant_id: null
                          sku: SKU-1
                          image_url: null
                          compare_at_price: null
                      customer:
                        name: Maria Silva
                        email: cliente@exemplo.com
                        document: '12345678909'
                        phone: '11999999999'
                        address:
                          country: BR
                          street: Rua São Bento
                          number: '111'
                          complement: Bloco 7
                          district: Centro
                          city: São Paulo
                          state: SP
                          postcode: '01010000'
                      payment:
                        payment_info:
                          brand: visa
                          final: '1234'
                          expiration: 12/2029
                      charges:
                        - cycle: 0
                          order_id: 12345
                          shopify_order_id: null
                          charged_at: 15/07/2026
                          value: 209.8
                          status: paid
                      panel_url: https://assinaturas.appmax.com.br/painel/6f1c0f1e-6a1c-4a2b-9f0e-3d5c7a9b1234
        '400':
          description: |
            Pedido inválido para virar assinatura (forma de pagamento, status,
            token reutilizável ausente ou produtos inválidos).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
              examples:
                paymentType:
                  value:
                    errors:
                      message: Apenas pedidos de cartão de crédito ou PIX podem virar assinatura.
                status:
                  value:
                    errors:
                      message: Pedido precisa estar aprovado ou integrado.
                shopifyProducts:
                  value:
                    errors:
                      message: Para pedidos Shopify é obrigatório informar os produtos da assinatura.
        '404':
          description: Pedido não encontrado (ou de outra loja).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
              examples:
                default:
                  value:
                    errors:
                      message: Pedido não encontrado.
        '409':
          description: Conflito na seleção de produtos (o mesmo produto informado duas vezes).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
              examples:
                default:
                  value:
                    errors:
                      message: Produto duplicado na seleção.
        '422':
          description: |
            Erro de validação dos campos ou regra de negócio (produto inválido,
            variante inexistente na Shopify, frequências divergentes ou desconto
            que deixa o valor abaixo do mínimo).
          content:
            application/json:
              schema:
