                  value:
                    data:
                      message: Recipient retrieval error

    put:
      operationId: updateRecipientPagarme
      tags: [PagarMe]
      summary: Editar recebedor (contrato PagarMe)
      description: |
        Edita dados cadastrais de um recebedor usando o contrato da PagarMe v5
        (`PUT /core/v5/recipients/{recipient_id}`).

        Você pode reenviar o objeto inteiro: **só os campos editáveis são
        gravados**, e os demais são ignorados sem erro. Cada campo editável
        enviado **sobrescreve** o valor atual. A regra da PagarMe de só
        preencher campos vazios não se aplica.

        | Dado | Pessoa física (`individual`) | Pessoa jurídica (`corporation`) |
        | --- | --- | --- |
        | Nome do titular | `register_information.name` | `register_information.managing_partners[0].name` |
        | Data de nascimento do titular | `register_information.birthdate` | `register_information.managing_partners[0].birthdate` |
        | Telefone | `register_information.phone_numbers[0]` (`ddd` e `number` juntos) | igual |
        | Endereço | `register_information.address.*` | `register_information.main_address.*` |

        Os campos de endereço editáveis são `street`, `street_number`,
        `complementary`, `neighborhood`, `city`, `state` e `zip_code`.

        ::: warning `type` é obrigatório
        Sempre que enviar `register_information`, inclua o `type` do
        recebedor (`individual` ou `corporation`). É ele que define quais
        caminhos acima são lidos, então precisa ser o tipo com que o recebedor
        foi cadastrado.
        :::

        Regras:

        - um campo enviado não pode ser vazio;
        - `birthdate` em `dd/mm/aaaa` ou `aaaa-mm-dd`, e o titular precisa ser
          maior de idade;
        - nome só com letras, acentos e espaços (entre 3 e 255 caracteres);
        - o telefone não pode pertencer a outro usuário da Appmax.

        Não são editáveis por aqui: e-mail, documento, nome da empresa,
        renda/faturamento e conta bancária. Para trocar a conta, use
        [Alterar domicílio bancário](/api-reference/pagarme/alterar-domicilio-bancario).

        A resposta de sucesso é um objeto vazio, como na PagarMe. Para ver os
        dados atualizados, use
        [Consultar recebedor](/api-reference/pagarme/consultar-recebedor).
      parameters:
        - $ref: '#/components/parameters/PagarmeRecipientHash'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PagarmeUpdateRecipientRequest'
            examples:
              individual:
                summary: Pessoa física — telefone e endereço
                value:
                  register_information:
                    type: individual
                    phone_numbers:
                      - ddd: '21'
                        number: '988887777'
                    address:
                      street: Rua das Laranjeiras
                      street_number: '45'
                      complementary: Apto 302
                      neighborhood: Laranjeiras
                      city: Rio de Janeiro
                      state: RJ
                      zip_code: '22240003'
              corporation:
                summary: Pessoa jurídica — representante legal
                value:
                  register_information:
                    type: corporation
                    managing_partners:
                      - name: Carlos Eduardo Lima
                        birthdate: 09/12/1980
      responses:
        '200':
          description: Recebedor atualizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Objeto vazio.
              examples:
                default:
                  value:
                    data: {}
        '403':
          $ref: '#/components/responses/PagarmeForbidden'
        '404':
          $ref: '#/components/responses/PagarmeRecipientNotFound'
        '422':
          description: |
            Erro de validação. Formato inválido volta como mapa
            `campo → [mensagens]` na raiz do corpo; regra de negócio volta em
            `data.message`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PagarmeFieldErrors'
                  - $ref: '#/components/schemas/PagarmeMessageEnvelope'
              examples:
                tipoAusente:
                  summary: register_information sem type
                  value:
                    register_information.type:
                      - O campo register information.type é obrigatório quando register information está presente.
                menorDeIdade:
                  summary: Titular menor de idade
                  value:
                    register_information.birthdate:
                      - O parceiro deve ser maior de idade.
                telefoneEmUso:
                  summary: Telefone de outro usuário
                  value:
                    data:
                      message: The phone number already exists.
        '500':
          description: Erro interno.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagarmeMessageEnvelope'
              examples:
                default:
                  value:
                    data:
                      message: Recipient update error

  /v1/p/recipients/{recipient_hash}/default-bank-account:
    patch:
      operationId: updateRecipientDefaultBankAccountPagarme
      tags: [PagarMe]
      summary: Alterar domicílio bancário (contrato PagarMe)
      description: |
        Troca a conta bancária padrão do recebedor usando o contrato da
        PagarMe v5 (`PATCH /core/v5/recipients/{recipient_id}/default-bank-account`).

        A conta atual é **atualizada no lugar**: o `id` da conta continua o
        mesmo e os dados anteriores não ficam disponíveis pela API.

        **O titular precisa ser o próprio recebedor.** `holder_document` tem
        que ser o documento do recebedor e `holder_type` tem que ser
        `individual` para recebedor pessoa física e `company` para pessoa
        jurídica. Só `bank`, agência, conta e `type` são gravados;
        `holder_name` e `metadata` são aceitos e ignorados.

        A troca é recusada com `422` quando:

        - o recebedor ainda não tem conta bancária (esta rota não cria a
          primeira conta);
        - há solicitação de saque pendente na conta atual;
        - a conta foi criada pela Max;
        - o recebedor também é merchant na Appmax.

        ::: warning Saques em andamento
        O bloqueio vale só para saques **pendentes**. Saques já aprovados ou em
        processamento passam a usar os dados da conta nova.
        :::

        A resposta é o recebedor completo, no mesmo formato de
        [Consultar recebedor](/api-reference/pagarme/consultar-recebedor). Se a
        conta foi trocada mas a resposta não pôde ser montada, o corpo traz só
        o `id`. A troca já foi feita nesse caso; confira com a consulta antes
        de repetir.
      parameters:
        - $ref: '#/components/parameters/PagarmeRecipientHash'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bank_account]
              properties:
                bank_account:
                  $ref: '#/components/schemas/PagarmeBankAccountInput'
            examples:
              default:
                value:
