                    data:
                      message: Recipient creation error
        '503':
          description: Serviço de validação cadastral indisponível. Tente novamente mais tarde.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagarmeMessageEnvelope'

    get:
      operationId: listRecipientsPagarme
      tags: [PagarMe]
      summary: Listar recebedores (contrato PagarMe)
      description: |
        Lista os recebedores do marketplace autenticado no formato da PagarMe
        v5 (`GET /core/v5/recipients`), do mais recente para o mais antigo.
        Só os recebedores cadastrados pelo próprio marketplace são retornados.

        Ao contrário das demais rotas `/v1/p/`, o corpo **não** usa o envelope
        `data` como objeto: segue o formato de listagem da PagarMe, com a lista
        em `data` e o total em `paging.total`.

        Cada item é um resumo do recebedor — sem `register_information`,
        `automatic_anticipation_settings` e `payment_mode`. Para o objeto
        completo, use
        [Consultar recebedor](/api-reference/pagarme/consultar-recebedor).

        ::: warning Diferenças em relação à PagarMe
        - Não há filtros: só `page` e `size`.
        - `size` tem teto de **100**. Acima disso a rota retorna `422`, em vez
          de reduzir o valor.
        :::
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Página a ser retornada.
          example: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Quantidade de recebedores por página.
          example: 10
      responses:
        '200':
          description: Recebedores retornados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagarmeListRecipientsResponse'
              examples:
                default:
                  value:
                    data:
                      - id: 0a0c3269-b5fa-543b-b9ad-1cf27d0944c1
                        name: Maria Souza
                        email: maria.souza@exemplo.com
                        document: '35873882029'
                        type: individual
                        status: active
                        created_at: '2026-10-07T14:32:10Z'
                        updated_at: '2026-10-07T15:02:44Z'
                        transfer_settings:
                          transfer_enabled: false
                          transfer_interval: null
                          transfer_day: 0
                        default_bank_account:
                          id: '8812'
                          holder_name: Maria Souza
                          holder_type: individual
                          holder_document: '35873882029'
                          bank: '001'
                          branch_number: '12345'
                          account_number: '123456'
                          account_check_digit: '7'
                          type: checking
                          status: active
                          created_at: '2026-10-07T14:32:10Z'
                          updated_at: '2026-10-07T14:32:10Z'
                    paging:
                      total: 1
                empty:
                  summary: Nenhum recebedor
                  value:
                    data: []
                    paging:
                      total: 0
        '403':
          $ref: '#/components/responses/PagarmeForbidden'
        '422':
          description: |
            `page` ou `size` inválidos. Mapa `campo → [mensagens]` na raiz do
            corpo, sem o envelope `data`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagarmeFieldErrors'
              examples:
                sizeAcimaDoTeto:
                  summary: size acima de 100
                  value:
                    size:
                      - O campo size não deverá conter um valor superior a 100.
        '500':
          description: Erro interno.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagarmeMessageEnvelope'
              examples:
