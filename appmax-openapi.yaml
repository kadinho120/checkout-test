        '422':
          description: |
            Erro de validação. Há dois formatos:

            - **formato inválido** (campo ausente, tipo errado, regra da tabela
              acima): mapa `campo → [mensagens]` na raiz do corpo, **sem** o
              envelope `data`;
            - **regra de negócio** (CPF já cadastrado): `data.message` com a
              descrição.
