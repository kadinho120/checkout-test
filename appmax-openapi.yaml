  /v1/orders/total-liquid/{order_id}:
    get:
      operationId: getOrderTotalLiquid
      tags: [Orders]
      summary: Total líquido do pedido
      description: |
        Retorna o detalhamento do valor líquido de um pedido (`order_id`),
        incluindo taxas, comissões e o total líquido a receber pelo produtor.

        **Autenticação:** header `secret` (API Gateway).
      security:
        - secretHeader: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: integer
          description: ID do pedido na Appmax.
          example: 3531
      responses:
        '200':
          description: Detalhamento do valor líquido retornado com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      site:
                        type: string
                        description: Nome do site/loja vinculado ao pedido.
                        example: Teste applink
                      currency:
                        type: string
                        description: Moeda dos valores retornados.
                        example: BRL
                      producer:
                        type: object
                        description: Detalhamento dos valores do produtor.
                        properties:
                          name:
                            type: string
                            description: Nome do produtor.
                            example: Produtor teste
                          total_liquid:
                            type: number
                            description: Valor líquido a receber pelo produtor.
                            example: 148.87
                          total_order:
                            type: number
                            description: Valor total do pedido.
                            example: 159.9
                          interest:
                            type: number
                            nullable: true
                            description: Juros aplicados ao pedido, quando houver.
                          installment_fee:
                            type: number
                            nullable: true
                            description: Taxa de parcelamento, quando houver.
                          processing_fee:
                            type: array
                            description: Taxas de processamento aplicadas ao pedido.
                            items:
                              type: object
                              properties:
                                key:
                                  type: string
                                  description: Descrição da taxa.
                                  example: Taxa de processamento (6.9%)
                                value:
                                  type: string
                                  description: Valor da taxa.
                                  example: '11.03'
                                internal_name:
                                  type: string
                                  description: Identificador interno da taxa.
                                  example: creditcard-processing-rate
                          cashback:
                            type: number
                            description: Valor de cashback do pedido.
                            example: 0
                          coproducer_commission:
                            type: number
                            nullable: true
                            description: Comissão do coprodutor, quando houver.
                          affiliate_commission:
                            type: number
                            nullable: true
                            description: Comissão do afiliado, quando houver.
                          debts:
                            type: object
                            description: Débitos e saldos utilizados no pedido.
                            properties:
                              cashBalance:
                                type: array
                                description: Saldos em caixa utilizados.
                                items:
                                  type: object
                              cashBalanceTotal:
                                type: number
                                description: Total de saldo em caixa utilizado.
                                example: 0
                              splitsTotal:
                                type: number
                                description: Total destinado a splits.
                                example: 0
                      total:
                        type: number
                        description: Total líquido do pedido.
                        example: 148.87
                      split_orders:
                        type: object
                        nullable: true
                        description: Dados de split do pedido, quando houver.
              examples:
                default:
                  value:
                    data:
                      site: Teste applink
                      currency: BRL
                      producer:
                        name: Produtor teste
                        total_liquid: 148.87
                        total_order: 159.9
                        interest: null
                        installment_fee: null
                        processing_fee:
                          - key: Taxa de processamento (6.9%)
                            value: '11.03'
                            internal_name: creditcard-processing-rate
                        cashback: 0
                        coproducer_commission: null
                        affiliate_commission: null
                        debts:
                          cashBalance: []
                          cashBalanceTotal: 0
                          splitsTotal: 0
                      total: 148.87
                      split_orders: null
        '404':
          description: Retornado quando o `order_id` não existe ou não pertence ao site autenticado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      error:
                        type: string
                        example: Order not found
              examples:
                default:
                  value:
                    data:
                      error: Order not found
        '500':
          description: Retornado quando ocorre uma falha inesperada ao calcular o valor líquido do pedido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      error:
                        type: string
                        example: Internal Server Error
              examples:
                default:
                  value:
                    data:
                      error: Internal Server Error

  /v1/balances:
    get:
      operationId: getBalances
      tags: [Split]
      summary: Consultar saldos
      description: |
        Retorna os saldos financeiros da empresa autenticada, separados por tipo.

        **Autenticação:** header `secret` (API Gateway).

        | type | descrição |
        |------|-----------|
        | `available` | Saldo disponível para saque |
        | `to_release` | Saldo a liberar |
      security:
        - secretHeader: []
      responses:
        '200':
          description: Saldos retornados com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: Lista de saldos da empresa, um item por tipo.
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          description: 'Tipo do saldo: `available` (disponível para saque) ou `to_release` (a liberar).'
                          example: available
                        value:
                          type: string
                          description: Valor do saldo.
                          example: '6220.80'
              examples:
                default:
                  value:
                    data:
                      - type: available
                        value: '6220.80'
                      - type: to_release
                        value: '24729.89'
        '404':
          description: Retornado quando não é possível identificar a empresa (`company_id`) na sessão da requisição.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      error:
                        type: string
                        example: Company ID not found in session
              examples:
                default:
                  value:
                    data:
                      error: Company ID not found in session
        '500':
          description: Retornado quando ocorre uma falha inesperada ao consultar os saldos.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      error:
                        type: string
                        example: Internal Server Error
              examples:
                default:
                  value:
                    data:
                      error: Internal Server Error

  /v1/customers:
    post:
      operationId: createOrUpdateCustomer
      tags: [Customers]
      summary: Criar ou atualizar cliente
      description: |
        Cria ou atualiza um cliente identificado pela combinação
        `first_name + last_name + email + phone + ip`.

        ::: warning
        Para criar um cliente, você precisa ter feito a coleta de IP utilizando
        o script [Appmax JS](/guides/appmax-js).
        :::

        ::: tip
        Se enviar apenas os campos obrigatórios, o cliente será registrado como
        "carrinho abandonado" e pode ser atualizado depois pela mesma rota.
        :::
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrUpdateCustomerRequest'
            examples:
              default:
                value:
                  first_name: Junior
                  last_name: Almeida
                  email: junior.almeida@email.com
                  phone: '51983655100'
                  document_number: '25226493029'
                  address:
                    postcode: '91520270'
                    street: Rua Francisco Carneiro da Rocha
                    number: '582'
                    complement: Casa
                    district: Moinhos de Ventos
                    city: Porto Alegre
                    state: RS
                  ip: 127.0.0.1
                  products:
                    - sku: '9000010'
                      name: Livro de receitas
                      quantity: 1
                      unit_value: 12300
                      type: digital
                  tracking:
                    utm_source: google
                    utm_campaign: teste
      responses:
        '201':
          description: Cliente criado com sucesso. Guarde o `customer_id` para criar o pedido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCustomerResponse'
              examples:
                default:
                  value:
                    data:
                      customer:
                        id: 1
        '422':
          description: Erro de validação dos campos do payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'

  /v1/orders/shipping-tracking-code:
    post:
      operationId: setTrackingCode
      tags: [Orders]
      summary: Cadastrar código de rastreio
      description: |
        Cadastra um código de rastreio em um pedido criado na Appmax.

        ::: warning
        Para que os saques do merchant sejam aprovados, é necessário atualizar
