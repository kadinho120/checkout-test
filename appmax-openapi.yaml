  /v1/payments/credit-card:
    post:
      operationId: payCreditCard
      tags: [Payments]
      summary: Pagamento com cartão de crédito
      description: |
        Cria um pagamento por cartão de crédito vinculado a um pedido existente.
        Permite parcelamento e personalização do soft descriptor.

        ::: warning
        Antes de criar um pagamento, você precisa ter:
        - `order_id` — ID do pedido ([criar pedido](/api-reference/orders/criar-pedido))
        - `customer_id` — ID do cliente ([criar cliente](/api-reference/customers/criar-atualizar))
        :::

        ::: info
        Consulte [Cálculo de parcelas](/api-reference/payments/parcelas) para
        obter os valores corretos com as taxas configuradas antes de enviar um
        pagamento parcelado.
        :::
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditCardPaymentRequest'
            examples:
              default:
                value:
                  order_id: 12345
                  customer_id: 407
                  payment_data:
                    credit_card:
                      token: 422146c7523a46119d6073ea56193913
                      holder_document_number: '19100000000'
                      holder_name: Teste teste
                      installments: 1
                      soft_descriptor: MYSTORE
      responses:
        '201':
          description: Pagamento criado com sucesso.
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      order:
                        id: 12345
                        status: autorizado
                      payment:
                        method: creditcard
                        installments: 1
                        paid_at: '2025-03-15 14:30:00'
                      upsell_hash: '4000114202503117156088040208561001715608804'
        '400':
          description: 'Erro ao processar (ex.: pedido já pago).'
        '404':
          description: Pedido não encontrado.

  /v1/payments/pix:
    post:
      operationId: payPix
      tags: [Payments]
      summary: Pagamento via Pix
      description: |
        Gera as instruções de pagamento via Pix para um pedido existente:
        QR Code (imagem base64) e código EMV (copia-e-cola).

        ::: tip Exiba um cronômetro de expiração
        Na página de sucesso, mostre o QR Code, o copia-e-cola e um cronômetro
        com o tempo restante até `pix_expiration_date`. Calcule a contagem
        regressiva **dinamicamente a partir desse campo** — não fixe um tempo
        de expiração no seu código, pois esse valor pode variar.
        :::

        ::: info Vencimento personalizado
        Por padrão, o vencimento do Pix vem da configuração da loja. Para
        definir um vencimento por transação, envie
        `payment_data.pix.expiration_date` no formato `Y-m-d H:i:s`, no fuso
        de Brasília (`America/Sao_Paulo`) e com data futura.

        O campo é **opcional**: se não for enviado, o vencimento continua
        vindo da configuração da loja, sem nenhuma mudança de comportamento.
        :::

        ::: info Testando no sandbox
        No sandbox o Pix é **aprovado automaticamente** cerca de 5 segundos
        depois de gerado. O cenário depende do `document_number`:

        | `document_number` | Resultado no sandbox |
        | --- | --- |
        | Qualquer CPF ou CNPJ válido (ex.: `19100000000`) | Aprovado em ~5 s e depois integrado |
        | CPF `40827365144` ou CNPJ `40827365000109` | Fica **pendente** (o pagamento não é confirmado) |

        Os dois cenários estão prontos no **Corpo da Requisição**, nas abas
        **Sandbox: aprovado** e **Sandbox: pendente**. Webhooks recebidos em
        cada um: [Testar no sandbox](/guides/webhooks#testar-sandbox).
        :::
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PixPaymentRequest'
            examples:
              'Sandbox: aprovado':
                summary: 'Sandbox: aprovado automaticamente'
                value:
                  order_id: 113
                  payment_data:
                    pix:
                      document_number: '19100000000'
                      expiration_date: '2026-09-10 15:00:00'
              'Sandbox: pendente':
                summary: 'Sandbox: pedido fica pendente'
                value:
                  order_id: 113
                  payment_data:
                    pix:
                      document_number: '40827365000109'
      responses:
        '200':
          description: |
            Instruções Pix retornadas. Os campos `pix_qrcode` (PNG em base64,
            sem prefixo `data:`), `pix_emv` (BR Code copia-e-cola) e
            `pix_expiration_date` (data/hora de expiração do Pix, formato
            `Y-m-d H:i:s`) vivem em `data.payment`. Exiba o QR Code e o
            copia-e-cola ao cliente.
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      payment:
                        cashback: 0
                        pay_reference: 115063889f2f0f1e51428104d1b542f8299
                        pix_qrcode: iVBORw0KGgoAAAANSUhEUgAAAGQAAABkCAIAAAD...
                        pix_emv: '00020101021226850014br.gov.bcb.pix2563qrcodepix.bb.com.br/pix/v2/fab6ead0-131f-46b6-aa19-d17be75b00535204000...'
                        pix_expiration_date: '2026-05-21 05:34:30'
        '404':
          description: Pedido não encontrado ou já pago.

  /v1/payments/boleto:
    post:
      operationId: payBoleto
      tags: [Payments]
      summary: Pagamento via boleto
      description: |
        Cria um boleto bancário vinculado a um pedido existente. Retorna o link
        do PDF e a linha digitável.

        O boleto é uma opção de pagamento **offline**: o cliente paga em um
        banco, lotérica ou pelo internet banking, fora do seu checkout.

        ::: tip Exiba o boleto na página de sucesso
        Mostre a opção de baixar o PDF (`pdf_url`) e de copiar a linha
        digitável (`digitable_line`) na página de sucesso, para que o cliente
        possa efetuar o pagamento pelo canal de sua preferência.
        :::

        ::: warning Não abra o PDF em iframe
        O download do boleto (`pdf_url`) deve **redirecionar o cliente para
        outra página**, e não ser aberto embutido em um iframe na sua página
        de checkout/sucesso.
        :::

        ::: info Testando no sandbox
        No sandbox o boleto é **aprovado automaticamente** cerca de 5 segundos
        depois de gerado. O cenário depende do `document_number`:

        | `document_number` | Resultado no sandbox |
        | --- | --- |
        | Qualquer CPF ou CNPJ válido (ex.: `19100000000`) | Aprovado em ~5 s e depois integrado |
        | CPF `40827365144` ou CNPJ `40827365000109` | Fica **pendente** (o pagamento não é confirmado) |

        Os dois cenários estão prontos no **Corpo da Requisição**, nas abas
        **Sandbox: aprovado** e **Sandbox: pendente**. Webhooks recebidos em
        cada um: [Testar no sandbox](/guides/webhooks#testar-sandbox).
        :::
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoletoPaymentRequest'
            examples:
              'Sandbox: aprovado':
                summary: 'Sandbox: aprovado automaticamente'
                value:
                  order_id: 113
                  payment_data:
                    boleto:
                      document_number: '19100000000'
              'Sandbox: pendente':
                summary: 'Sandbox: pedido fica pendente'
                value:
                  order_id: 113
                  payment_data:
                    boleto:
                      document_number: '40827365144'
      responses:
        '201':
          description: Boleto gerado com sucesso.
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      order:
                        id: 113
                        status: pendente
                      boleto:
                        pdf_url: 'https://boleto.appmax.com.br/pdf/abc123...'
                        digitable_line: '23793.38128 60000.000003 00000.000400 1 84340000012300'
                        due_date: '2025-03-22'
        '404':
          description: Pedido não encontrado ou já pago.

  /v1/payments/apple-pay:
    post:
      operationId: payApplePay
      tags: [Payments]
      summary: Pagamento com Apple Pay
      description: |
        O Apple Pay é uma solução de pagamento digital da Apple que permite realizar compras com cartão de crédito de forma rápida, segura e
        conveniente em dispositivos compatíveis (iPhone, iPad, Apple Watch e Mac).

        Utilizando tokenização e autenticação biométrica (Face ID ou Touch ID),
        o Apple Pay elimina a digitação manual dos dados do cartão a cada compra,
        reduzindo o tempo de checkout e aumentando a conversão. Além disso,
        transações via Apple Pay não possuem risco de chargeback por fraude.

        ::: warning Compatibilidade
        O Apple Pay só é exibido no navegador Safari (macOS ou iOS) e em
        dispositivos Apple com suporte ao método. Em outros navegadores, o botão
        não aparece.
        :::

        ## Antes de começar: escolha o seu modelo de integração

        Esta é a decisão que mais gera dúvidas. Existem dois modelos de integração
        com Apple Pay pela Appmax, e a diferença está em quem registra o domínio
        junto à Apple e em quem controla o `merchantIdentifier`.

        ::: warning Em todos os modelos, você hospeda o arquivo `.well-known`
        Independentemente do modelo abaixo, é sempre responsabilidade do lojista
        (ou do integrador, em nome da loja) publicar o arquivo
        `.well-known/apple-developer-merchantid-domain-association` na raiz de
        cada domínio onde o Apple Pay será usado — inclusive no modelo integrado.
        Veja o passo a passo completo, com o conteúdo do arquivo e as receitas de
        `Content-Type` por servidor, em
        [Configuração de domínios para Apple Pay](/api-reference/payments/apple-pay-dominio).
        :::

        | Aspecto | Modelo integrado (loja integrada / integrador via AppStore) | Fluxo direto |
        | --- | --- | --- |
        | Quem cadastra o domínio na Apple | A Appmax, por API, sob a conta/merchant Apple da Appmax | O próprio lojista, na conta Apple dele |
        | Quem hospeda o `.well-known` | O lojista/integrador, em todos os casos | O lojista hospeda o arquivo na raiz do domínio |
        | `merchantIdentifier` | Gerido pela Appmax, compartilhado entre vários domínios do integrador | Do próprio lojista |
        | Indicado para | Plataformas/integradores que operam várias lojas (ex.: e-commerce SaaS) | Lojista único que gerencia a própria conta Apple |

        ::: info Como saber qual é o seu caso?
        Se você é uma plataforma/integrador e instala o app da Appmax em nome de
        várias lojas (fluxo de AppStore, com `client_id`/`external_id` por loja),
        você está no **modelo integrado**. Se você é um lojista configurando o
        Apple Pay diretamente na sua própria conta Apple, você está no
        **fluxo direto**. Nos dois casos, você precisa publicar o arquivo
        `.well-known` (veja o aviso acima).
        :::

        Os passos abaixo indicam, quando relevante, o que muda entre os dois modelos.

        ## Glossário

        | Termo | Descrição |
        | --- | --- |
        | Apple Pay | Solução de pagamento da Apple para compras seguras via Apple Wallet, com autenticação biométrica e criptografia ponta a ponta. |
        | Apple Token (Apple Pay Token) | Objeto JSON criptografado retornado pela PaymentSheet após o usuário confirmar o pagamento, contendo `paymentData`, `paymentMethod` e `transactionIdentifier`. É o cartão tokenizado e serve para efetivar o pagamento na API Appmax. Gerado por transação. |
        | PaymentSheet | Interface nativa do Apple Pay que exibe valor, métodos disponíveis e solicita autenticação (Face ID, Touch ID ou senha). |
        | Merchant Session | Sessão JSON assinada pela Apple, válida para um domínio e `merchantIdentifier`. Valida o site antes de exibir a PaymentSheet. Obtida em tempo real a cada transação. |
        | `.well-known/apple-developer-merchantid-domain-association` | Arquivo estático de validação de domínio da Apple, vinculado ao `merchantIdentifier` (não à transação). Responsabilidade do lojista em **todos** os modelos de integração — veja [Configuração de domínios para Apple Pay](/api-reference/payments/apple-pay-dominio). |
        | `external_id` | UUID que identifica o par (app instalado + loja). Gerado na instalação e usado nas chamadas da CDN. Veja [Instalação do Aplicativo](/guides/instalacao). |

        ## Pré-requisitos

        - **Navegador compatível** — Safari (macOS ou iOS).
        - **Carteira Apple configurada** — ao menos um cartão Visa ou Mastercard no Apple Wallet.
        - **Instalação do app** feita com o parâmetro `domain_name` (passo 1).
        - **Arquivo `.well-known` publicado** e domínio validado junto à Apple (passo 2).
        - **Appmax JS incluído e inicializado** com os callbacks (passo 3).

        Componentes do fluxo:

        - **Script JS:** `https://scripts.appmax.com.br/appmax.min.js` (produção) — em sandbox use `https://scripts.sandboxappmax.com.br/appmax.min.js`.
        - **Domínio validado** junto à Apple.
        - **Requisição de pagamento** para a API Appmax com `appleToken`, `order_id` e `customer_id` válidos.

        ## 1. Autorizar a instalação do aplicativo

        Registre o aplicativo na Appmax informando o domínio:

        ```bash
        curl --location 'https://api.appmax.com.br/app/authorize' \
          --header 'Content-Type: application/json' \
          --header 'Authorization: Bearer SEU_TOKEN' \
          --data '{
            "app_id": "APP_ID",
            "external_key": "EXTERNAL_KEY",
            "url_callback": "URL_CALLBACK",
            "domain_name": "subdominio.dominio.com.br"
          }'
        ```

        ::: info
        O parâmetro `domain_name` deve conter subdomínio + domínio (ex.:
        `minhaloja.minhaintegracao.com.br`). Também é possível enviar vários
        domínios com `domain_names` (array). Mais detalhes em
        [Instalação do Aplicativo](/guides/instalacao).
        :::

        ## 2. Publicar o `.well-known` e validar o domínio

        ### 2.1 Publicar o arquivo `.well-known` (obrigatório em todos os modelos)

        Em **todos** os modelos de integração, cada domínio onde o botão Apple Pay
        será exibido precisa servir, na raiz do site, o arquivo de validação:

        ```
        https://subdominio.dominio.com.br/.well-known/apple-developer-merchantid-domain-association
        ```

        O arquivo, o passo a passo de publicação e o comando para verificar se ele
        está acessível estão em
        [Configuração de domínios para Apple Pay](/api-reference/payments/apple-pay-dominio).

        ::: info
        O conteúdo do `.well-known` **não** é o Apple Token. O Apple Token é o
        cartão tokenizado, gerado por transação. O `.well-known` é um arquivo
        estático de validação de domínio, vinculado ao `merchantIdentifier` — o
        mesmo arquivo é usado em todos os domínios da sua implementação.
        :::

        ### 2.2 Cadastrar o domínio junto à Apple

        ::: warning
        Este passo muda conforme o modelo de integração.
        :::

        **Modelo integrado (loja integrada / integrador):** você não precisa
        cadastrar o domínio pelo painel da Apple. O registro é feito por API,
        pela Appmax, sob o `merchantIdentifier` da Appmax. Basta que o domínio
        tenha sido informado na instalação (passo 1) e que o arquivo `.well-known`
        (passo 2.1) já esteja publicado — a Apple confere o arquivo ao validar o
        domínio.

        Se o domínio do lojista mudar: o novo domínio é tratado como um domínio
        novo e precisa ser registrado novamente. Não é necessário criar um novo
        merchant.

        **Fluxo direto:** o cadastro do domínio é feito por você, diretamente no
        painel de desenvolvedor da Apple, na sua própria conta. A Apple valida o
        arquivo `.well-known` publicado no passo 2.1 no momento do cadastro.

        ## 3. Configuração e inicialização do script no front-end

        ::: tip
        Esta seção resume o essencial. Para o passo a passo completo — seletores
        do botão, ordem de carregamento em SPA, contrato de DOM e troubleshooting
        — veja [Implementando o botão Apple Pay com o Appmax JS](/api-reference/payments/apple-pay-appmax-js).
        :::

        ::: warning
        O `externalId` esperado aqui é o mesmo `external_id` que você retornou com
        HTTP 200 na etapa de [Instalação do Aplicativo](/guides/instalacao).
        :::

        O `appmax.min.js` faz três coisas:

        - Estiliza o botão com o design oficial da Apple (opcional).
        - Inicializa o botão para abrir a PaymentSheet com os dados do carrinho.
        - Dispara os callbacks de sucesso, erro, atualização e autorização.

        ### 3.1 Inicializar com onSuccess, onError, externalId, onUpdate e onAuthorize

        ```html
        <script>
          // Callback de autorização: recebe o Apple Token e efetiva o pagamento
          const onAuthorize = async (appleToken) => {
            await processPayment(appleToken);
          };
          // Callback de erro
          const onError = (err) => {
            console.error('Erro no Apple Pay:', err);
          };
          // Callback do IP do cliente (a coleta é obrigatória e exige um
          // form[data-appmax-customer] no DOM antes do init)
          const onIp = ({ ip }) => {
            customer.value.ip = ip;
          };
          // Callback de update: deve retornar os dados atuais do checkout
          const onUpdate = () => getCheckoutData();
          onMounted(() => {
            const script = document.createElement('script');
            // Produção: https://scripts.appmax.com.br/appmax.min.js
            // Sandbox:  https://scripts.sandboxappmax.com.br/appmax.min.js
            script.src = 'https://scripts.appmax.com.br/appmax.min.js';
            script.onload = () => {
              if (window.AppmaxScripts) {
                window.AppmaxScripts.init({ externalId, onIp, onError, onUpdate, onAuthorize });
              } else {
                console.error('AppmaxScripts não carregado.');
              }
            };
            document.head.appendChild(script);
          });
        </script>
        ```

        ::: warning
        Atenção aos nomes dos callbacks: o que recebe o Apple Token é o
        `onAuthorize` (não `onAutorize`). A forma posicional
        `init(onSuccess, onError, externalId, onUpdate, onAuthorize)` continua
        funcionando, mas exige essa ordem exata — o objeto de opções não tem esse
        risco.

        A referência normativa do `init` (as duas formas, todos os callbacks e o
        contrato do `onError`) está em
        [Appmax JS](/guides/appmax-js#como-usar). Esta página cobre só o que é
        específico do Apple Pay.
        :::

        **Convenção de nomes:** `externalId` é o parâmetro do `init()` no
        JavaScript; `external_id` é o campo da API e da instalação. É o mesmo
        valor, escrito na convenção de cada lado.

        ### 3.2 Mantendo o onUpdate atualizado (JS puro)

        O `onUpdate` deve retornar os dados atuais do checkout para alimentar a
        PaymentSheet (valor, frete, desconto, parcelas, itens):

        ```js
        function getCheckoutData() {
          const products = Array.from(document.querySelectorAll('.product-item')).map(item => ({
            name:     item.querySelector('.product-name').textContent,
            price:    parseFloat(item.querySelector('.product-price').value),
            quantity: parseInt(item.querySelector('.product-quantity').value, 10)
          }));
          const freight    = parseFloat(document.getElementById('freight').value  || 0);
          const discount   = parseFloat(document.getElementById('discount').value || 0);
          const totalItems = products.reduce((sum, p) => sum + p.price * p.quantity, 0);
          return {
            total:        totalItems + freight - discount,
            freight:      freight,
            discount:     discount,
            installments: parseInt(document.getElementById('installments').value, 10) || 1,
            products:     products
          };
        }
        ```

        ::: info
        Sobre o `orderId` no `onUpdate`: o campo aqui serve à montagem da
        PaymentSheet. O `order_id` obrigatório é o do request de pagamento
        (`POST /v1/payments/apple-pay`) — ele não precisa necessariamente ser
        setado no `onUpdate`, mas precisa ser o `order_id` de uma Order já
        existente na Appmax (veja o passo 4).
        :::

        ## 4. Processar o pagamento

        O pagamento Apple Pay exige três elementos: `customer_id`, `order_id` e o
        `appleToken`. A ordem é: criar customer → criar order → efetivar o pagamento.

        ```js
        async function processPayment(appleToken) {
          // 1. Criar customer — POST /v1/customers  (veja /api-reference/customers/criar-atualizar)
          // 2. Criar order    — POST /v1/orders     (veja /api-reference/orders/criar-pedido)
          // 3. Efetivar pagamento — POST /v1/payments/apple-pay
          const paymentPayload = {
            order_id,        // Order já existente na Appmax
            customer_id,
            payment_data: {
              apple_pay: {
                installments: 3,                         // 1 a 12
                holder_document_number: "22233344450",   // obrigatório
                soft_descriptor: "EXEMPLOLOJA",          // opcional, máx. 13 caracteres
                // Do appleToken.paymentData:
                payment_data: {
                  version: "EC_v1",
                  data: "exemplo",
                  signature: "signature",
                  header: {
                    ephemeralPublicKey: "MFk...==",
                    transactionId: "trx....wvu"
                  }
                },
                // Do appleToken.paymentMethod:
                payment_method: {
                  displayName: "Visa •••• 3714",
                  network: "Visa",
                  type: "credit"
                },
                // Do appleToken.transactionIdentifier:
                transaction_identifier: "trx....wvu"
              }
            }
          };
          const resp = await fetch('https://api.appmax.com.br/v1/payments/apple-pay', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer SEU_TOKEN` },
            body: JSON.stringify(paymentPayload)
          });
          if (!resp.ok) throw new Error('Falha no pagamento');
          return resp.json();
        }
        ```

        Mapeamento do Apple Token para o payload:

        | Campo do `appleToken` | Vai em |
        | --- | --- |
        | `paymentData` | `payment_data.apple_pay.payment_data` |
        | `paymentMethod` | `payment_data.apple_pay.payment_method` |
        | `transactionIdentifier` | `payment_data.apple_pay.transaction_identifier` |

        ::: info
        Campos obrigatórios: `order_id`, `installments` (1–12) e
        `holder_document_number`. `soft_descriptor` é opcional (máx. 13 caracteres).
        :::

        ::: warning O teto de parcelas do Apple Pay é 12 — no cartão pode ser maior
        Aqui o limite é **fixo em 12**. No endpoint de
        [cartão de crédito](/api-reference/payments/cartao-credito) o teto é o
        configurado para a loja, que por padrão também é 12, mas **pode ser maior**
        quando ela tem parcelamento estendido habilitado.

        Na prática: uma loja com parcelamento estendido aceita 18x no cartão e
        **recusa** 18x no Apple Pay. Se você oferece as duas formas de pagamento na
        mesma tela, limite as opções de parcela do Apple Pay a 12 — ou o comprador
        escolhe um valor que vai ser recusado só na hora de pagar.
        :::

        ## Validação em tempo real (Merchant Session)

        A validação do domínio junto à Apple não é única — a Apple revalida o
        domínio/merchant a cada transação, no momento em que a PaymentSheet é
        aberta (a Merchant Session é obtida em tempo real). É um processo rápido e
        transparente para o usuário; o Appmax JS cuida disso automaticamente. Veja
        [`POST /v1/apple-pay/merchant-session`](/api-reference/payments/apple-pay-merchant-session).

        ## Testes e Sandbox

        ::: warning
        Não é possível testar o Apple Pay em `localhost`. O Apple Pay exige um
        domínio público, com HTTPS válido e devidamente registrado/configurado. A
        Apple não valida domínios não públicos.
        :::

        ::: warning Não existe merchant session de sandbox
        A validação de domínio/merchant é sempre feita contra a infraestrutura de
        **produção** da Apple, mesmo em ambiente de sandbox — não existe uma
        segunda instância só para teste. Trate sandbox e produção como
        assimétricos nesse ponto específico: o script de sandbox aponta para o
        mesmo endpoint de validação que o de produção.
        :::

        Cartões de teste da Apple: a referência oficial é
        [developer.apple.com/apple-pay/sandbox-testing](https://developer.apple.com/apple-pay/sandbox-testing)
        — que exige uma Sandbox Apple Account própria.

        ::: warning Modelo integrado
        Como o pagamento roda sob a conta Apple da Appmax, não é possível usar
        cartões de teste da Apple da sua própria conta (não conseguimos provisionar
        credenciais de teste de terceiros na nossa conta Apple, por segurança).
        Nesse caso, a forma prática de testar é usar um cartão real e
        cancelar/estornar as ordens pelo admin.
        :::

        ## Ambientes

        |  | Sandbox | Produção |
        | --- | --- | --- |
        | Script JS | `https://scripts.sandboxappmax.com.br/appmax.min.js` | `https://scripts.appmax.com.br/appmax.min.js` |
        | API | `https://api.sandboxappmax.com.br` | `https://api.appmax.com.br` |

        ## Perguntas frequentes (FAQ)

        **O `appleToken` é usado para quê?**

        É o cartão tokenizado pela Apple. Ele precisa ser enviado ao
        `POST /v1/payments/apple-pay` (nos campos `payment_data`, `payment_method`,
        `transaction_identifier`). Sem ele, o pagamento não é processado. É de uso
        único por transação.

        **Preciso hospedar o arquivo `.well-known` em cada domínio?**

        Sim, em **todos** os modelos de integração — isso não muda entre o modelo
        integrado e o fluxo direto. O que muda entre os modelos é apenas quem
        cadastra o domínio junto à Apple (a Appmax, por API, no modelo integrado;
        você mesmo, pelo painel da Apple, no fluxo direto). Veja
        [Configuração de domínios para Apple Pay](/api-reference/payments/apple-pay-dominio).

        **O `order_id` do `onUpdate` precisa ser de uma Order real da Appmax?**

        O `order_id` obrigatório é o do request de pagamento e precisa ser de uma
        Order existente (criada via `POST /v1/orders`). Ele não precisa vir do
        `onUpdate`, mas precisa estar no payload do pagamento.

        **Se o domínio do lojista mudar, preciso de um novo merchant?**

        Não. O novo domínio é registrado novamente na instalação existente.

        **Existe um token/arquivo por lojista, ou um geral?**

        O Apple Token é sempre por transação. O conteúdo do arquivo de validação de
        domínio é o mesmo para todos os domínios vinculados ao `merchantIdentifier`
        gerido pela Appmax — não é gerado por lojista. Ainda assim, cada domínio
        precisa hospedar sua própria cópia desse mesmo arquivo (veja
        [Configuração de domínios para Apple Pay](/api-reference/payments/apple-pay-dominio)). O que
        é por lojista são as credenciais (`client_id`/`client_secret`) e o
        `external_id`.

        **A validação do domínio demora?**

        O registro do domínio é rápido (chamada síncrona). A validação da Merchant
        Session ocorre em tempo real, a cada transação — também rápida.

        **Consigo testar pelo sandbox da Appmax?**

        É preciso um domínio público registrado e configurado. No modelo integrado,
        o caminho prático é cartão real + estorno (veja Testes e Sandbox).

        ## Conclusão — checklist

        1. Autorizar a instalação com `domain_name`.
        2. Publicar o arquivo `.well-known` em cada domínio (obrigatório em todos os modelos) e cadastrar o domínio junto à Apple — Appmax por API (modelo integrado) ou você mesmo (fluxo direto). Veja [Configuração de domínios para Apple Pay](/api-reference/payments/apple-pay-dominio).
        3. Incluir e inicializar o Appmax JS com `onSuccess`, `onError`, `externalId`, `onUpdate`, `onAuthorize`.
        4. Criar customer → criar order → processar o `appleToken` via `POST /v1/payments/apple-pay`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplePayPaymentRequest'
            examples:
              default:
                value:
                  order_id: 123
                  customer_id: 456
                  payment_data:
                    apple_pay:
                      installments: 3
                      holder_document_number: '22233344450'
                      soft_descriptor: EXEMPLOLOJA
                      payment_data:
                        data: exemplo
                        signature: signature
                        header:
                          publicKeyHash: 'Z...'
                          ephemeralPublicKey: 'MFk...=='
                          transactionId: trx....wvu
                        version: EC_v1
                      payment_method:
                        displayName: Visa 3714
                        network: Visa
                        type: credit
                      transaction_identifier: trx....wvu
      responses:
        '201':
          description: Pagamento Apple Pay aprovado.

  /v1/payments/google-pay:
    post:
      operationId: payGooglePay
      tags: [Payments]
      summary: Pagamento com Google Pay
      description: |
        O Google Pay é a carteira digital do Google. Com ele, o comprador paga com
        um cartão já salvo em sua conta Google — em Android ou em qualquer
        navegador suportado — sem informar número, validade ou CVV: seleciona o
        cartão na folha de pagamento do Google e confirma. O cartão trafega
        cifrado do Google diretamente para a adquirente; nem a loja nem a Appmax
        têm acesso ao número, o que elimina do checkout o formulário de cartão e
        a exposição a dados sensíveis.

        Na **App Store da Appmax**, o Google Pay é um meio de pagamento
        disponível a qualquer aplicativo instalado por um lojista. Ele utiliza as
        mesmas [credenciais do merchant](/guides/autenticacao), o mesmo fluxo de
        [cliente](/api-reference/customers/criar-atualizar) e
        [pedido](/api-reference/orders/criar-pedido) e o mesmo
        [estorno](/api-reference/refunds/criar-estorno) já empregados para
        cartão de crédito,
        Pix e
        Boleto. A única diferença está na
        origem dos dados do cartão, que passam a vir do Google em vez de um
        formulário da loja.

        **Esta página** cobre o endpoint: o que a loja precisa ter antes de
          começar, como autorizar a instalação, como montar o payload a partir
          do que o Google devolve e o que fazer com cada resposta.
        
        **[Implementando o botão Google Pay com o Appmax JS](/api-reference/payments/google-pay-appmax-js)**
          cobre o navegador: onde ancorar o botão, como inicializar o script e
          como os callbacks `onUpdate` e `onAuthorize` se comportam.

        Para quem já integrou o [Apple Pay](/api-reference/payments/apple-pay),
        o caminho é o mesmo e mais curto: o `init()` do Appmax JS é o mesmo, e
        não há domínio a cadastrar nem arquivo `.well-known` a publicar.

        ::: warning Compatibilidade
        O botão do Google Pay é exibido em Chrome, Firefox, Safari, Edge, Opera
        e UC Browser, em páginas servidas por HTTPS, tanto em desktop quanto em
        dispositivos móveis. O comprador precisa estar autenticado em uma conta
        Google com ao menos um cartão Visa, Mastercard ou Elo salvo.

        | Contexto | O que o comprador vê |
        | --- | --- |
        | Android, Windows ou Linux em navegador suportado | botão do Google Pay |
        | iOS ou macOS com Apple Pay disponível | botão do Apple Pay — a seleção é feita automaticamente pelo script |
        | Navegador sem suporte à Google Pay API | nenhum botão; o bloco permanece oculto |

        Em **sandbox**, o Google exibe sua própria lista de cartões de teste
        assim que a folha abre, em qualquer navegador suportado. Isso permite
        validar botão, folha e callbacks sem um dispositivo físico — veja
        "Testes e Sandbox".
        :::

        ## Como funciona

        A integração é realizada por meio do [Appmax JS](/guides/appmax-js), o
        mesmo script empregado na tokenização de cartão e no
        [Apple Pay](/api-reference/payments/apple-pay-appmax-js). A loja ancora
        um botão e implementa dois callbacks; o script executa as demais etapas.

        A folha do Google abre **dentro de um iframe da Appmax**, e não na
        página da loja. O Google valida a origem de onde a folha é aberta contra
        o domínio aprovado em seu console; ao abrir no iframe da Appmax, um
        único domínio aprovado atende a todos os integradores. Por isso não é
        necessário criar perfil no Google Pay & Wallet Console, cadastrar
        domínio nem configurar credenciais do Google ou da adquirente.

        ::: info Diferença em relação ao Apple Pay
        Não há equivalente ao arquivo `.well-known` nem ao parâmetro
        `domain_name` da instalação. Se o aplicativo já está instalado para
        cartão, Pix ou Apple Pay, nenhuma nova autorização é necessária.
        :::

        | O que fica com você | O que fica com a Appmax |
        | --- | --- |
        | Ancorar o botão e chamar o `init()` com `externalId`, `onUpdate` e `onAuthorize` | Montar a folha do Google e abrir o iframe — domínio aprovado e configuração da folha |
        | Devolver o total do carrinho no `onUpdate` | Exibir o botão oficial do Google e tratar o clique |
        | Enviar o `paymentMethodData` do `onAuthorize` ao seu backend e chamar `POST /v1/payments/google-pay` | Validar o token, identificar o tipo de cartão e autorizar na adquirente |

        ## Glossário

        | Termo | Descrição |
        | --- | --- |
        | Google Pay | Carteira digital do Google. O comprador paga com um cartão salvo em sua conta Google, sem digitá-lo. |
        | Folha (payment sheet) | Interface do Google na qual o comprador seleciona o cartão salvo e confirma o pagamento. Aberta em um iframe da Appmax. |
        | `paymentMethodData` | Objeto devolvido pelo Google após a confirmação e recebido no `onAuthorize`. É enviado à Appmax integralmente, em `payment_data.google_pay.payment_data`. Gerado por transação. |
        | Token | String em `tokenizationData.token`, dentro do `paymentMethodData`, com o cartão cifrado para a adquirente. Repassado sem alteração. |
        | `onUpdate` | Callback implementado pela loja: retorna o total do carrinho antes da abertura da folha. |
        | `onAuthorize` | Callback implementado pela loja: recebe o `paymentMethodData` após a confirmação do comprador. |
        | `external_id` | UUID que identifica o par (app instalado + loja). Gerado na instalação e usado pelo `init()` do Appmax JS. Veja [Instalação do aplicativo](/guides/instalacao). |
        | `pay_reference` | Identificador da cobrança, retornado no `201`. Utilizado na conciliação e no [estorno](/api-reference/refunds/criar-estorno). |

        ## Pré-requisitos

        Do lado do comprador, para o botão aparecer:

        - **Conta Google** com ao menos um cartão Visa, Mastercard ou Elo salvo.
        - **Navegador suportado** — Chrome, Firefox, Safari, Edge, Opera ou UC Browser.
        - **Página servida por HTTPS.**

        Do lado da integração:

        - **Instalação do app** autorizada, com o `external_id` disponível (passo 1).
        - **Appmax JS incluído e inicializado** com `onUpdate` e `onAuthorize` (passo 2).
        - **Token Bearer do merchant**, obtido em `POST /oauth2/token` com as credenciais do merchant — não as do aplicativo. Veja [Autenticação](/guides/autenticacao).

        Componentes do fluxo:

        - **Script JS:** `https://scripts.appmax.com.br/appmax.min.js` (produção) — em sandbox use `https://scripts.sandboxappmax.com.br/appmax.min.js`. Veja [Ambientes](/guides/ambientes).
        - **Requisição de pagamento** para a API Appmax com o `paymentMethodData`, `order_id` e `customer_id` válidos.

        ## 1. Autorizar a instalação do aplicativo

        O fluxo é o mesmo de qualquer outro meio de pagamento da API: o lojista
        autoriza a instalação (`POST /app/authorize` → redirecionamento →
        `POST /app/client/generate`), a Appmax aciona a URL de validação do
        aplicativo e, ao final, são entregues as
        [credenciais do merchant](/guides/autenticacao) e o `external_id`
        daquela instalação. Veja [Instalação do aplicativo](/guides/instalacao)
        para o fluxo completo, com diagrama de sequência de todas as chamadas.

        ```bash
        curl --location 'https://api.appmax.com.br/app/authorize' \
          --header 'Content-Type: application/json' \
          --header 'Authorization: Bearer SEU_TOKEN' \
          --data '{
            "app_id": "APP_ID",
            "external_key": "EXTERNAL_KEY",
            "url_callback": "URL_CALLBACK"
          }'
        ```

        ::: info
        Diferente do Apple Pay, o Google Pay não utiliza o parâmetro
        `domain_name`. O passo a passo completo da instalação está em
        [Instalação do aplicativo](/guides/instalacao) e
        [Valide sua URL de validação](/guides/validar-url). O `external_id` é
        detalhado em [`external-id`](/guides/external-id).
        :::

        ## 2. Incluir e inicializar o Appmax JS

        ::: tip
        Para o passo a passo completo — seletores
        do botão, ordem de carregamento em SPA, contrato do `onUpdate`, o
        comportamento do `onAuthorize` e troubleshooting — veja
        [Implementando o botão Google Pay com o Appmax JS](/api-reference/payments/google-pay-appmax-js).
        :::

        ::: warning
        O `externalId` esperado aqui é o mesmo `external_id` que você retornou
        com HTTP 200 na etapa de
        [Instalação do aplicativo](/guides/instalacao#health-check).
        :::

        O `appmax.min.js` faz três coisas:

        - Monta a folha do Google e a abre em um iframe da Appmax — você não configura domínio nem credenciais do Google.
        - Renderiza o botão oficial do Google na âncora `[data-appmax-google-pay]` e trata o clique.
        - Dispara os callbacks de atualização (`onUpdate`), autorização (`onAuthorize`) e erro (`onError`).

        ### 2.1 Inicializar com externalId, onIp, onError, onUpdate e onAuthorize

        ```html
        <!-- Gatilho da coleta de IP: obrigatório, e precisa existir antes do init -->
        <form data-appmax-customer hidden></form>

        <div data-appmax-checkout data-appmax-merchant-name="Nome da loja">
          <div data-appmax-google-pay-wrapper>
            <button data-appmax-google-pay style="height: 48px; width: 100%"></button>
          </div>
        </div>

        <script>
          // Produção: https://scripts.appmax.com.br/appmax.min.js
          // Sandbox:  https://scripts.sandboxappmax.com.br/appmax.min.js
          const onUpdate = () => ({ total: 150.90 }); // em reais, como número
          const onAuthorize = async (paymentMethodData) => {
            await processGooglePayPayment(paymentMethodData); // veja o passo 3
          };
          const checkoutData = {
            customer: {}
          };

          const onIp = ({ ip }) => {
            checkoutData.customer.ip = ip;
          };
          const onError = ({ code, message, stage }) => console.error('Erro no Google Pay:', code, stage, message);

          window.AppmaxScripts.init({ externalId, onIp, onError, onUpdate, onAuthorize });
        </script>
        ```

        ::: warning Valores do `onUpdate` são informados em reais

         O `onUpdate` é um contrato do **Appmax JS**, e não da API. Por isso, o campo `total` deve ser informado em **reais**, enquanto os valores enviados para a API são informados em **centavos**.

        Por exemplo, para uma cobrança de **R$ 150,90**:

        - No `onUpdate`: `total: 150.90`
        - Em `POST /v1/orders`: `15090`, pois a API utiliza valores monetários inteiros em centavos.

        Essa diferença é importante porque utilizar o formato da API no `onUpdate` não gera um erro, mas altera o valor exibido ao comprador. Por exemplo, `total: 15090` será interpretado como **R$ 15.090,00**.

        Além disso, o corpo da requisição `POST /v1/payments/google-pay` não possui um campo para informar o valor da cobrança: o pagamento utiliza **o valor total do pedido**. Dessa forma, um `total` incorreto no `onUpdate` pode fazer com que o comprador veja um valor na folha de pagamento diferente do valor efetivamente cobrado.

        Para mais detalhes, consulte [O que o `onUpdate` deve retornar](/api-reference/payments/google-pay-appmax-js#o-que-o-onupdate-deve-retornar) e [Valores monetários](/api-reference/introduction#valores-monetarios).
        :::


        ::: info
        No Google Pay, a folha já está fechada quando o `onAuthorize` é
        invocado e o valor retornado não é utilizado — a aprovação ou recusa é
        tratada na sua tela, a partir da resposta do passo 3. Isso difere do
        Apple Pay; veja
        [Como o `onAuthorize` se comporta](/api-reference/payments/google-pay-appmax-js#como-o-onauthorize-se-comporta).
        :::

        ## 3. Processar o pagamento

        O `onAuthorize` recebe o `paymentMethodData`, que deve ser enviado ao
        backend da loja. O backend executa a sequência padrão da API: cliente,
        pedido e pagamento.

        1. [`POST /v1/customers`](/api-reference/customers/criar-atualizar) — cria ou atualiza o cliente; armazene `data.customer.id`.
        2. [`POST /v1/orders`](/api-reference/orders/criar-pedido) — cria o pedido; armazene `data.order.id`.
        3. `POST /v1/payments/google-pay` — efetua o pagamento, com o `customer_id` e o `order_id` dos passos anteriores.

        O objeto recebido no `onAuthorize` tem esta forma:

        ```json
        {
          "type": "CARD",
          "description": "Visa •••• 1234",
          "info": {
            "cardNetwork": "VISA",
            "cardDetails": "1234",
            "assuranceDetails": {
              "accountVerified": true,
              "cardHolderAuthenticated": true
            }
          },
          "tokenizationData": {
            "type": "PAYMENT_GATEWAY",
            "token": "{\"signature\":\"MEUCIQ...\",\"protocolVersion\":\"ECv2\",\"signedMessage\":\"{...}\"}"
          }
        }
        ```

        É esse objeto, **integral e sem modificação**, que vai em
        `payment_data.google_pay.payment_data`.

        ::: warning O `gatewayMerchantId` é configurado internamente pela Appmax

        Não envie, substitua ou tente definir esse identificador no payload.
        Encaminhe o `paymentMethodData` recebido no `onAuthorize` integralmente
        e sem alterações, em `payment_data`. O payload público é o do exemplo
        abaixo — nenhum campo além desses é necessário.

        :::

        ```js
        async function processGooglePayPayment(paymentMethodData) {
          // 1. Criar customer — POST /v1/customers  (veja /api-reference/customers/criar-atualizar)
          // 2. Criar order    — POST /v1/orders     (veja /api-reference/orders/criar-pedido)
          // 3. Efetivar pagamento — POST /v1/payments/google-pay
          const paymentPayload = {
            order_id,        // Order já existente na Appmax
            customer_id,
            payment_data: {
              google_pay: {
                installments: 2,                         // 1 a 12
                holder_document_number: "51425014038",   // obrigatório
                soft_descriptor: "MINHALOJA",            // opcional, máx. 13 caracteres
                payment_data: paymentMethodData          // o objeto do onAuthorize, inteiro
              }
            }
          };
          const resp = await fetch('https://api.appmax.com.br/v1/payments/google-pay', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer SEU_TOKEN` },
            body: JSON.stringify(paymentPayload)
          });
          if (!resp.ok) throw new Error('Falha no pagamento');
          const { data } = await resp.json();
          // Guarde data.payment.pay_reference no seu banco. Ao front-end,
          // devolva só o status — nunca o pay_reference, o documento ou o token.
          return { status: 'aprovado' };
        }
        ```

        ::: danger Atenção

        - **Não aplique `JSON.parse` ao `token`.** O `token` é uma string e deve ser enviado exatamente como recebido. O parse é realizado pela Appmax.
        - **Não remova campos do objeto.** Envie o objeto completo, incluindo `info`. Esses dados são utilizados pela Appmax para validar a transação e compor o comprovante, incluindo a bandeira e os últimos dígitos do cartão. O número completo do cartão não trafega.

        :::

        ::: warning Integração via backend

        A requisição deve ser realizada **exclusivamente pelo backend**. Credenciais e dados sensíveis, como o [token Bearer](/guides/autenticacao), nunca devem ser expostos ao navegador.

        O front-end deve receber apenas o resultado necessário para a interface: status da operação (aprovado ou recusado) e, opcionalmente, uma mensagem. Dados como credenciais, `pay_reference`, `holder_document_number` e respostas completas da API devem permanecer no backend.

        :::


        ::: info
        - Campos obrigatórios: `order_id`, `customer_id`, `installments` (1–12),
        `holder_document_number` e `payment_data`.
        
        - `soft_descriptor` é opcional
        (máx. 13 caracteres).
        :::

        A resposta `201` traz o pagamento em `data.payment`:

        ```json
        {
          "data": {
            "payment": {
              "pay_reference": "test_localhost_1_2b5c0",
              "upsell_hash": "92447142021040-1704397469-0391056001704397469",
              "cashback": null
            }
          }
        }
        ```

        - `pay_reference` identifica a cobrança e deve ser armazenado para
        conciliação e estorno.
        - `upsell_hash` é utilizado no upsell. 
        - O
        status do pedido é informado por webhooks e pela
        [consulta do pedido](/api-reference/orders/consultar-pedido), como em
        qualquer pagamento com cartão.

        Erros retornam `{ "errors": { "message": "..." } }`, exceto o `403`,
        que usa o envelope antigo. Os códigos e mensagens estão em
        **Respostas**, abaixo. Recusas da adquirente chegam como
        `Pagamento não autorizado: <motivo>`, com o status correspondente ao
        motivo — exiba o motivo ao comprador e permita nova tentativa.

        ## Testes e Sandbox

        ::: tip Em sandbox não é necessário cartão real
        Assim que a folha abre, o Google exibe sua própria lista de cartões de
        teste, em qualquer navegador suportado — inclusive desktop. Não é
        preciso provisionar cartão no Google Wallet para começar.
        :::

        Em sandbox, o Google retorna dados de cartão simulados e nenhuma
        cobrança é efetuada. É possível exercitar o fluxo completo — botão,
        folha, token e chamada de pagamento — sem envolver o cartão do
        comprador.

        ::: warning
        O ambiente é definido pela Appmax, conforme a URL do script incluído.
        Utilize script, API e credenciais de **sandbox** em conjunto
        ([Ambientes](/guides/ambientes)); a combinação de ambientes distintos
        resulta em `401`.
        :::

        O que dá para validar em sandbox:

        - O botão e a folha do Google, com os cartões de teste.
        - Os callbacks `onUpdate`, `onAuthorize` e `onError`.
        - O contrato da chamada de pagamento e o tratamento dos erros.
        - A criação de customer e order.

        Antes da publicação em produção, homologue com um pagamento real em um
        dispositivo com cartão salvo no Google Wallet.

        ## Ambientes

        |  | Sandbox | Produção |
        | --- | --- | --- |
        | Script JS | `https://scripts.sandboxappmax.com.br/appmax.min.js` | `https://scripts.appmax.com.br/appmax.min.js` |
        | API | `https://api.sandboxappmax.com.br` | `https://api.appmax.com.br` |
        | Autenticação | `https://auth.sandboxappmax.com.br` | `https://auth.appmax.com.br` |
        | Cartão na folha | lista de teste do Google | cartão do comprador |
        | Cobrança | não há | real |

        Script e `external_id` devem pertencer ao **mesmo** ambiente — veja
        [Ambientes](/guides/ambientes).

        ## Perguntas frequentes (FAQ)

        **A folha não abre e nada aparece no console.**

        Se o checkout da loja é executado dentro de um iframe, esse iframe
        precisa de `allow="payment"`. Sem isso o navegador bloqueia a folha
        silenciosamente.

        **O comprador fechou a folha. É necessário exibir erro?**

        Não. O Google retorna `CANCELED`, que corresponde a desistência — basta
        permitir um novo clique. O mesmo código é retornado quando o Google
        recusa o estabelecimento ou a conta e exibe o erro dentro da folha; do
        ponto de vista da página da loja, os dois casos são indistinguíveis.

        **Foi retornado `400` com `Invalid Google Pay token`. O problema está no cartão?**

        Não. Na quase totalidade dos casos o `paymentMethodData` foi alterado
        antes do envio — um `JSON.parse` no `token` ou campos removidos.
        Repasse o objeto exatamente como recebido no `onAuthorize`. Se o erro
        persistir, acione o suporte da Appmax.

        **É necessário hospedar algum arquivo ou cadastrar domínio?**

        Não. Não há equivalente ao
        [`.well-known` do Apple Pay](/api-reference/payments/apple-pay-dominio),
        e não é necessário perfil no Google Pay & Wallet Console. A folha abre
        em um iframe da Appmax, cujo domínio já está aprovado.

        **É possível parcelar?**

        Sim. Informe `installments` de 1 a 12 no corpo do pagamento. Juros e
        valores por parcela seguem o retornado por
        [Parcelas](/api-reference/payments/parcelas) para a loja. O
        `installments` do `onUpdate` não é utilizado pelo Google Pay.

        **Como é feito o estorno?**

        Pelo mesmo endpoint dos demais meios:
        [Criar estorno](/api-reference/refunds/criar-estorno), com o
        `pay_reference` retornado no `201`. A transação é de cartão de crédito
        para todos os efeitos.

        **O comprovante mostra os quatro últimos dígitos de qual cartão?**

        Dos que o Google devolve em `info.cardDetails`. Como o número do cartão
        não trafega nesta integração, é a única fonte — por isso o campo não
        deve ser removido do objeto.

        **Posso oferecer Apple Pay e Google Pay na mesma página?**

        Sim. Ancore os seletores das duas carteiras e use o mesmo `init()`. O
        script exibe o Apple Pay onde ele está disponível e o Google Pay nos
        demais navegadores suportados; o `onAuthorize` recebe o token da
        carteira utilizada — veja
        [Implementando o botão Apple Pay com o Appmax JS](/api-reference/payments/apple-pay-appmax-js).

        ## Conclusão — checklist

        1. Autorizar a instalação do aplicativo e armazenar o `external_id` — [Instalação do aplicativo](/guides/instalacao).
        2. Incluir o Appmax JS do ambiente correto ([Ambientes](/guides/ambientes)) e ancorar o botão com `data-appmax-google-pay`, dentro de um `data-appmax-checkout` com `data-appmax-merchant-name` — veja [Implementando o botão Google Pay](/api-reference/payments/google-pay-appmax-js).
        3. Invocar `window.AppmaxScripts.init()` com `externalId`, `onIp`, `onError`, `onUpdate` e `onAuthorize`.
        4. Retornar o carrinho no `onUpdate` em reais, com valores numéricos — não em centavos, diferente dos endpoints da API.
        5. No `onAuthorize`, enviar o `paymentMethodData` ao backend, integral e sem parse do `token`.
        6. Criar [cliente](/api-reference/customers/criar-atualizar) → criar [pedido](/api-reference/orders/criar-pedido) → processar em `POST /v1/payments/google-pay`, sempre pelo backend, com o token do merchant ([Autenticação](/guides/autenticacao)).
        7. Tratar a folha fechada como desistência, sem mensagem de erro.
        8. Se o checkout é executado em iframe, garantir `allow="payment"` nele.
        9. Validar em sandbox e homologar com um pagamento real antes da publicação em produção.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GooglePayPaymentRequest'
            examples:
              default:
                value:
                  order_id: 3
                  customer_id: 7
                  payment_data:
                    google_pay:
                      installments: 2
                      holder_document_number: '51425014038'
                      soft_descriptor: MINHALOJA
                      payment_data:
                        type: CARD
                        description: 'Visa •••• 1234'
                        info:
                          cardNetwork: VISA
                          cardDetails: '1234'
                          assuranceDetails:
                            accountVerified: true
                            cardHolderAuthenticated: true
                        tokenizationData:
                          type: PAYMENT_GATEWAY
                          token: '{"signature":"MEUCIQ...","protocolVersion":"ECv2","signedMessage":"{...}"}'
      responses:
        '201':
          description: 'Pagamento Google Pay aprovado. `data.payment.pay_reference` identifica a cobrança.'
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      payment:
                        pay_reference: test_localhost_1_2b5c0
                        upsell_hash: '92447142021040-1704397469-0391056001704397469'
                        cashback: null
        '400':
          description: 'Requisição recusada. `errors.message` indica o motivo: `Invalid Google Pay token` (o `paymentMethodData` foi alterado antes do envio — reenvie-o exatamente como recebido no `onAuthorize`), `Document number invalid`, `Order Already Paid`, `Order is Cancelled` ou `Order is Refunded`.'
        '401':
          description: Token ausente, expirado ou emitido com credenciais do aplicativo em vez do merchant.
        '403':
          description: 'Documento em lista restritiva. Envelope distinto dos demais erros: `{ success: false, error, data: { errorCode, message }, status: 403 }`.'
        '404':
          description: 'Pedido não encontrado (`Order not found`). Verifique o `order_id` e se ele pertence ao merchant do token.'
        '422':
          description: 'Validação de campos — `errors.message` é um objeto `{ "campo": ["motivo"] }` — ou cartão não aceito pela Appmax (`Google Pay token was not authenticated...`). Neste segundo caso, trate como recusa e ofereça outro meio de pagamento.'
        '500':
          description: 'Falha inesperada (`Error to process Google Pay payment`). Repita a chamada; se persistir, acione o suporte informando o `order_id`.'

  /v1/payments/tokenize:
    post:
      operationId: tokenizeCard
      tags: [Payments]
      summary: Tokenização de cartão de crédito
      description: |
        Substitui os dados reais do cartão (número, CVV, validade) por um token
        único e seguro, permitindo realizar transações sem expor as informações
        originais.

        ::: danger Tokenização server-side exige PCI-DSS
        Quando você tokeniza pelo seu backend, o seu servidor toca o número de
        cartão e o CVV em claro. Isso **só é permitido** se sua arquitetura
        está em escopo PCI-DSS. Se você não tem certeza, use o caminho via CDN
        — o script Appmax JS isola os dados sensíveis do seu servidor.
        :::

        Existem dois caminhos de autenticação distintos para este endpoint:
        via CDN (header `external-id`) ou via backend (header `Authorization:
        Bearer`). Veja [`external-id`](/guides/external-id) para o contexto.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenizeRequest'
            examples:
              default:
                value:
                  payment_data:
                    credit_card:
                      number: '4444222222222222'
                      cvv: '123'
                      expiration_month: '12'
                      expiration_year: '28'
                      holder_name: John Doe
      responses:
        '201':
          description: Token gerado com sucesso.
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      token: 422146c7523a46119d6073ea56193913
        '401':
          description: Nem `external-id` nem `Authorization` foram enviados.
        '404':
          description: '`external-id` enviado mas não corresponde a nenhuma instalação ativa.'
        '422':
          description: Body inválido (campos faltando ou em formato incorreto).

  /v1/payments/installments:
    post:
      operationId: calculateInstallments
      tags: [Payments]
      summary: Cálculo de parcelas
      description: |
        Retorna o valor total com os juros aplicados em cada modalidade de
        parcelamento. A integração deve realizar a divisão para obter o valor
        de cada parcela.

        ::: info
        A quantidade e os valores das parcelas podem ser personalizados de 1 a
        12 parcelas. Os valores são configuráveis individualmente para cada
        merchant.
        :::

        **Modalidades**
        - **PP** (Simples por parcela): a taxa de juros é aplicada diretamente sobre o valor de cada parcela.
        - **AM** (Financiamento): a taxa de juros é calculada mensalmente sobre o saldo devedor total.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallmentsRequest'
            examples:
              default:
                value:
                  installments: 10
                  total_value: 10000
                  settings: true
      responses:
        '200':
          description: Cálculo realizado com sucesso.
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      installments:
                        '1': { total: 10000 }
                        '2': { total: 10200 }
                        '3': { total: 10404 }
                        '10': { total: 11600 }
                      settings:
                        modality: PP
                        max_installments: 12
                        min_installment_value: 500

  /v1/orders/refund-request:
    post:
      operationId: createRefund
      tags: [Refunds]
      summary: Criar um estorno
      description: |
        Cria uma solicitação de estorno (total ou parcial) para um pedido.

        Para **boleto**, é necessário informar os dados bancários do cliente na
        Appmax para que o valor seja ressarcido.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
            examples:
              total:
                summary: Estorno total
                value:
                  order_id: 1
                  type: total
              partial:
                summary: Estorno parcial
                value:
                  order_id: 1
                  type: partial
                  value: 5000
      responses:
        '201':
          description: Estorno aceito.
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      message: Refund request accepted
        '400':
          description: Erro de validação ou regra de negócio.
        '404':
          description: Pedido não encontrado.
        '500':
          description: Erro interno ao processar o estorno.

  /v1/apple-pay/merchant-session:
    post:
      operationId: appleMerchantSession
      tags: [Payments]
      summary: Apple Pay merchant session
      description: |
        Obtém a Merchant Session assinada pela Apple para iniciar o fluxo Apple
        Pay no navegador. O retorno é repassado a
        `session.completeMerchantValidation(...)` da `ApplePaySession`.

        ::: warning Header `external-id` é obrigatório
        Diferente do que uma versão anterior desta página chegou a afirmar,
        este endpoint **exige** o header `external-id` — além do campo
        `external_id` no body. Envie os dois com o mesmo valor. Sem o header,
        a requisição falha com parâmetro ausente.
        :::
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantSessionRequest'
            examples:
              default:
                value:
                  store_url: checkout.minhaloja.com.br
                  external_id: 37bb0791-ee0b-457d-860c-186e32978bcd
      responses:
        '200':
          description: Merchant Session retornada (opaque para o integrador).
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      epochTimestamp: 1715623200000
                      expiresAt: 1715626800000
                      merchantSessionIdentifier: 'SSH...'
                      nonce: abc12345
                      merchantIdentifier: merchant.com.exemplo
                      domainName: checkout.minhaloja.com.br
                      displayName: Appmax
                      signature: '...'
        '400':
          description: Domínio enviado não está validado para Apple Pay nesta instalação.
        '422':
          description: '`store_url` ou `external_id` ausente.'
        '500':
          description: Apple recusou a sessão.

      # NOTA — resposta embrulhada em "data": o corpo real vem como
      # { "data": { ...campos... } }, não os campos na raiz. Documentado
      # explicitamente acima porque o formato "sem data" já circulou nesta
      # página e causa erro de parsing em quem reimplementa o cliente.
      # displayName "Appmax": no modelo integrado, a merchant session roda sob
      # o merchant Apple da Appmax — o comprador sempre vê "Appmax" na tela de
      # confirmação, não o nome da loja. Ver /api-reference/payments/apple-pay-dominio.

  /v1/recipient:
    post:
      operationId: createRecipient
      tags: [Split]
      summary: Criar um recebedor
      description: |
        Cadastra um recebedor para receber valores de [split de
        pagamentos](/guides/split-pagamentos).

        O cadastro é só a primeira etapa. Para completar o fluxo, o recebedor
        também precisa concluir o
        [facematch (KYC)](/api-reference/split/facematch-link) — enquanto o KYC
        não é aprovado, ele não participa de splits. Os três status possíveis do
        onboarding são:

        | Status | Significado |
        | --- | --- |
        | `Awaiting face match completion` | Aguardando o recebedor concluir a etapa de facematch (KYC). |
        | `Onboarding on verification` | Recebemos todos os dados do formulário + facematch e estamos analisando as informações. |
        | `Onboarding completed` | Cadastro completo e aprovado. |

        Referência completa em
        [Status do split de pagamentos](/guides/split-status#status-do-recebedor-recipient).

        A conta bancária (`bankAccount`) pode ser enviada já no cadastro. Os
        códigos de banco (COMPE) homologados e os tipos de conta aceitos estão
        em [Bancos homologados](/guides/bancos-homologados).

        ::: warning
        Uma vez criado, o recebedor **não pode ser excluído via API**. Parte dos
        dados (titular, endereço e conta bancária) pode ser alterada em
        [Editar recebedor](/api-reference/split/editar-recebedor);
        CPF, e-mail, razão social e CNPJ não podem ser alterados — revise-os
        antes de enviar.
        :::
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecipientRequest'
      responses:
        '201':
          description: Recebedor criado com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      recipient_hash:
                        type: string
                        description: HASH do recebedor criado.
                        example: bbd96f57-3e3c-5ea1-aa60-cb2518578faf

        '403':
          description: Token ausente ou inválido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        description: Token de autenticação ausente
                        example: Missing Authentication Token
        '422':
          description: Erro de validação dos dados enviados ou regra de negócio.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    title: Erro de validação
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: object
                            description: Mensagens de erro detalhadas para cada campo inválido ou ausente.
                  - type: object
                    title: Erro de negócio
                    properties:
                      error:
                        type: string
                        description: Motivo da recusa.
                        example: User already exists, invalid value for enableAutomaticWithdraw, automatic withdraw cannot be enabled.
              examples:
                camposObrigatorios:
                  summary: Campos obrigatórios ausentes
                  value:
                    data:
                      message:
                        account.name:
                          - O campo account.name é obrigatório.
                        account.cpf:
                          - O campo account.cpf é obrigatório.
                        company.companyName:
                          - O campo company.company name é obrigatório.
                        company.companyDocumentNumber:
                          - O campo company.company document number é obrigatório.
                        company.companyPostcode:
                          - O campo company.company postcode é obrigatório.
                        company.companyAddress:
                          - O campo company.company address é obrigatório.
                        company.companyAddressNumber:
                          - O campo company.company address number é obrigatório.
                        company.companyAddressState:
                          - O campo company.company address state é obrigatório.
                        company.companyCity:
                          - O campo company.company city é obrigatório.
                        company.companyAddressNeighborhood:
                          - O campo company.company address neighborhood é obrigatório.
                        triage.revenue:
                          - O campo triage.revenue é obrigatório.
                        triage.storeUrl:
                          - O campo triage.store url é obrigatório.
                documentoInvalido:
                  summary: CPF da conta ou documento da empresa em formato inválido
                  value:
                    data:
                      message:
                        account.cpf:
                          - O CPF da conta não é um CPF válido.
                        company.companyDocumentNumber:
                          - O número do documento da empresa não é um CPF ou CNPJ válido.
                        company.personType:
                          - O número do documento da empresa não permite determinar um tipo de pessoa válido (CPF ou CNPJ).
                formaRecebimentoNaoInformada:
                  summary: Nem bankAccount nem pixKey foram enviados
                  value:
                    data:
                      message:
                        bankAccount:
                          - O campo bank account é obrigatório quando pix key não está presente.
                        pixKey:
                          - O campo pix key é obrigatório quando bank account não está presente.
                dadosBancariosIncompletos:
                  summary: bankAccount enviado sem os subcampos obrigatórios
                  value:
                    data:
                      message:
                        bankAccount.bank:
                          - O campo bank account.bank é obrigatório quando bank account está presente.
                        bankAccount.agency:
                          - O campo bank account.agency é obrigatório quando bank account está presente.
                        bankAccount.account:
                          - O campo bank account.account é obrigatório quando bank account está presente.
                        bankAccount.bankAccountType:
                          - O campo bank account.bank account type é obrigatório quando bank account está presente.
                bancoOuTipoContaInvalido:
                  summary: Banco não homologado ou tipo de conta fora da lista permitida
                  value:
                    data:
                      message:
                        bankAccount.bank:
                          - The bank is not valid.
                        bankAccount.bankAccountType:
                          - "O tipo de conta selecionado é inválido: CC,CD,PG,PP."
                chavePixFormatoInvalido:
                  summary: pixKey não corresponde a CPF, CNPJ, e-mail, telefone ou chave aleatória
                  value:
                    data:
                      message:
                        pixKey:
                          - A chave Pix informada não corresponde a nenhum formato válido (CPF, CNPJ, e-mail, telefone ou chave aleatória).
                configuracaoInvalida:
                  summary: sendAccountAccess ou enableAutomaticWithdraw não booleano
                  value:
                    data:
                      message:
                        config.sendAccountAccess:
                          - O campo config.send account access deverá ter o valor verdadeiro ou falso.
                        config.enableAutomaticWithdraw:
                          - O campo config.enable automatic withdraw deverá ter o valor verdadeiro ou falso.
                saqueAutomaticoUsuarioExistente:
                  summary: Saque automático pedido para um CPF que já é usuário da Appmax
                  value:
                    error: User already exists, invalid value for enableAutomaticWithdraw, automatic withdraw cannot be enabled.

        '500':
          description: Erro do Servidor Interno.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        description: Erro do Servidor Interno
                        example: Internal Server Error
                        
