                        transfer_enabled: false
                        transfer_interval: null
                        transfer_day: 0
                      default_bank_account:
                        id: '8813'
                        holder_name: Loja do Carlos
                        holder_type: company
                        holder_document: '97761238000171'
                        bank: '001'
                        branch_number: '1234'
                        account_number: '654321'
                        account_check_digit: '0'
                        type: checking
                        status: active
                        created_at: '2026-10-07T14:32:10Z'
                        updated_at: '2026-10-07T14:32:10Z'
                      gateway_recipients: []
                      automatic_anticipation_settings:
                        enabled: false
                        type: full
                        volume_percentage: 0
                        delay: null
                      register_information:
