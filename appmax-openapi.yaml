              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PagarmeRecipient'
              examples:
                individual:
                  summary: Pessoa física criada
                  value:
                    data:
                      id: 0a0c3269-b5fa-543b-b9ad-1cf27d0944c1
                      code: erp-maria-001
                      name: Maria Souza
                      email: maria.souza@exemplo.com
                      document: '35873882029'
                      type: individual
                      payment_mode: bank_transfer
                      status: registration
                      created_at: '2026-10-07T14:32:10Z'
                      updated_at: '2026-10-07T14:32:10Z'
                      transfer_settings:
                        transfer_enabled: false
                        transfer_interval: null
                        transfer_day: 0
