  /v1/subscriptions/{id}/charge-day:
    patch:
      operationId: updateSubscriptionChargeDay
      tags: [Subscriptions]
      summary: Alterar o dia de cobrança
      description: |
        Altera o dia fixo de cobrança da assinatura. A mudança vale para todos os
        ciclos futuros e a próxima data de cobrança (`next_charge_at`) é
        recalculada.

        Dias 29, 30 e 31 são aceitos: nos meses que não têm o dia escolhido a cobrança
        cai no último dia do mês, e o dia volta a valer no mês seguinte que o tiver.
        Uma assinatura no dia 31 cobra 31/01, 28/02, 31/03, 30/04.

        ### Quando o novo dia passa a valer

        A periodicidade da assinatura não muda — só o dia. A partir daí:

        - **o dia ainda vai ocorrer neste mês** → vale já na próxima cobrança;
        - **o dia já passou neste mês** → vale na próxima vez que ele ocorrer, ainda que
          isso desloque os meses da assinatura (uma bimestral de set/nov passa a cobrar
          em out/dez). Um mês de espera em vez de um ciclo inteiro;
        - **a data ficaria a menos de meio ciclo da última cobrança** → o novo dia vale a
          partir do ciclo seguinte, para que ninguém seja cobrado duas vezes por causa de
          um ajuste de calendário.

        Nos dois últimos casos a resposta vem com `adjusted: true` e o motivo em
        `adjusted_reason` / `adjusted_message`, para você saber por que a data entregue
        não é a que o dia escolhido produziria.

        Ciclos já pagos adiantado por
        [antecipação de cobrança](/api-reference/subscriptions/antecipar-cobranca) e
        ciclos [pulados](/api-reference/subscriptions/pular-ciclo) são preservados: o
        novo dia é aplicado ao ciclo que já estava agendado. Quem antecipou dois ciclos
        continua com a próxima cobrança dois ciclos à frente, agora no dia escolhido.
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChargeDayRequest'
            examples:
              default:
                value:
                  charge_day: 15
      responses:
        '200':
          description: Dia de cobrança atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateChargeDayResponse'
              examples:
                default:
                  value:
                    data:
                      charge_day: 15
                      next_charge_at: '2026-08-15 00:00:00'
        '404':
          description: Assinatura não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
              examples:
                default:
                  value:
                    errors:
                      message: Assinatura não encontrada.
        '422':
          description: '`charge_day` fora do intervalo permitido (1 a 31).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
              examples:
                default:
                  value:
                    errors:
                      message:
                        charge_day:
                          - The charge day may not be greater than 28.
        '500':
          description: Erro ao alterar o dia de cobrança.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'

  /v1/subscriptions/{id}/force-charge:
    post:
      operationId: forceSubscriptionCharge
      tags: [Subscriptions]
      summary: Antecipar a cobrança
      description: |
        Antecipa o próximo ciclo agendado da assinatura: a cobrança é feita na hora e a
        resposta já traz o desfecho. Não recebe corpo — o ciclo cobrado é sempre o
        próximo, o mesmo que seria cobrado na data agendada.

        Quando aprovada, o ciclo é consumido como em uma renovação normal
        (`next_charge_at` avança para a data seguinte do calendário, sem deslocá-lo) e o
        pedido gerado é devolvido em `order_id`.

        Quando a operadora recusa, nada muda na assinatura: ela **não** entra em atraso,
        não acumula tentativas de falha e continua com a cobrança marcada para a data
        original. A resposta `402` traz o motivo informado pela adquirente.

        Disponível apenas para assinaturas ativas pagas com cartão de crédito.
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
      responses:
        '200':
          description: Cobrança aprovada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForceChargeResponse'
              examples:
                default:
                  value:
                    data:
                      charge_id: 41287
                      order_id: 126509440
                      cycle_index: 7
                      value: 189.9
                      currency: BRL
                      status: active
                      next_charge_at: '2026-10-20 00:00:00'
        '402':
          description: Cobrança recusada pela operadora. A assinatura segue inalterada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
              examples:
                default:
                  value:
                    errors:
                      message: 'Transação não autorizada - Saldo insuficiente'
        '404':
          description: Assinatura não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
              examples:
                default:
                  value:
                    errors:
                      message: Assinatura não encontrada.
        '409':
          description: Já existe uma cobrança em andamento ou a próxima cobrança já está em processamento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
              examples:
                default:
                  value:
                    errors:
                      message: Existe uma cobrança em andamento; não é possível antecipar agora.
        '422':
          description: Assinatura não elegível (inativa, pausada, sem cartão ou com o próximo ciclo pulado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
              examples:
                default:
                  value:
                    errors:
                      message: Só é possível antecipar a cobrança de assinaturas ativas.
        '500':
          description: Erro ao antecipar a cobrança.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'

  /v1/subscriptions/{id}/frequency:
    patch:
      operationId: updateSubscriptionFrequency
      tags: [Subscriptions]
      summary: Alterar a periodicidade
      description: |
        Altera a periodicidade (`interval` + `interval_count`) da assinatura e
        recalcula `next_charge_at`. Retorna o detalhe atualizado da assinatura.

        A periodicidade enviada precisa ser oferecida pelo produto da assinatura.
        Para assinaturas de produtos Shopify, isso significa existir uma variante de
        assinatura naquela cadência; caso contrário a troca é recusada com `422`.

        ::: warning Quando a troca é recusada
        - assinatura não está ativa ou está pausada;
        - a periodicidade enviada é igual à atual;
        - já existe uma cobrança em processamento (`409`);
        - a próxima cobrança está dentro da janela do agendador (`409`).
        :::
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubscriptionFrequencyRequest'
            examples:
              default:
                value:
                  interval: month
                  interval_count: 2
      responses:
        '200':
          description: Periodicidade alterada. Retorna o detalhe atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionDetailResponse'
              examples:
                default:
                  value:
                    data:
                      subscription_id: 10
                      status: ACTIVE
                      interval: month
                      interval_count: 2
                      next_charge_at: '2026-10-15 00:00:00'
        '404':
          description: Assinatura não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
              examples:
                default:
                  value:
                    errors:
                      message: Assinatura não encontrada.
        '409':
          description: |
            Existe uma cobrança em processamento ou a próxima cobrança já entrou
            na janela do agendador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
              examples:
                default:
                  value:
                    errors:
                      message: charge_in_scheduler_window
        '422':
          description: |
            Periodicidade indisponível para o produto, igual à atual, assinatura
            inativa/pausada ou campos inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
              examples:
                notAvailable:
                  summary: Periodicidade não oferecida pelo produto
                  value:
                    errors:
                      message: frequency_not_available_for_product
                validation:
                  summary: Campo obrigatório ausente
                  value:
                    errors:
                      message:
                        interval:
                          - The interval field is required.
        '500':
          description: Erro ao alterar a periodicidade da assinatura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'

  /v1/subscriptions/{id}/cycles/{cycleIndex}/skip:
    patch:
      operationId: skipSubscriptionCycle
      tags: [Subscriptions]
      summary: Pular um ciclo
      description: |
        Marca um ciclo futuro para ser pulado: a assinatura segue ativa, mas
        aquele ciclo não gera cobrança nem pedido — a cobrança salta para o
        próximo ciclo não pulado.

        `cycleIndex` é o número do ciclo (1 = primeiro ciclo de recorrência).
        Só é possível pular ciclos ainda **não processados** — use
        `completed_cycles` do detalhe da assinatura como referência.

        Para desfazer, chame
        [desfazer o skip](/api-reference/subscriptions/desfazer-skip-ciclo).
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
        - $ref: '#/components/parameters/SubscriptionCycleIndex'
      responses:
        '200':
          description: Ciclo marcado como pulado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionCycleResponse'
              examples:
                default:
                  value:
                    data:
                      cycle_index: 3
                      status: skipped
                      next_charge_at: '2026-10-15 00:00:00'
        '400':
          description: |
            Ciclo já processado, fora do limite de `max_cycles` ou assinatura
            que não está ativa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
              examples:
                alreadyProcessed:
                  value:
                    errors:
                      message: Só é possível pular ciclos que ainda não foram processados.
                notActive:
                  value:
                    errors:
                      message: Só é possível pular ciclos de assinaturas ativas.
        '404':
          description: Assinatura não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
              examples:
                default:
                  value:
                    errors:
                      message: Assinatura não encontrada.
        '500':
          description: Erro ao pular o ciclo da assinatura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'

  /v1/subscriptions/{id}/cycles/{cycleIndex}/unskip:
    patch:
      operationId: unskipSubscriptionCycle
      tags: [Subscriptions]
      summary: Desfazer o skip de um ciclo
      description: |
        Remove a marcação de "pulado" de um ciclo futuro, devolvendo-o à fila de
        cobrança. O ciclo precisa estar marcado como pulado e ainda não ter sido
        processado.
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
        - $ref: '#/components/parameters/SubscriptionCycleIndex'
      responses:
        '200':
          description: Skip desfeito. O ciclo volta a ser cobrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionCycleResponse'
              examples:
                default:
                  value:
                    data:
                      cycle_index: 3
                      status: unbilled
                      next_charge_at: '2026-09-15 00:00:00'
        '400':
          description: Ciclo já processado ou que não estava marcado como pulado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
              examples:
                notSkipped:
                  value:
                    errors:
                      message: O ciclo informado não está marcado como pulado.
                alreadyProcessed:
                  value:
                    errors:
                      message: Não é possível desfazer o skip de um ciclo já processado.
        '404':
          description: Assinatura não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
              examples:
                default:
                  value:
                    errors:
                      message: Assinatura não encontrada.
        '500':
          description: Erro ao desfazer o skip do ciclo da assinatura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'

  /v1/subscriptions/{id}/cycles/products:
    post:
      operationId: addSubscriptionCycleProducts
      tags: [Subscriptions]
      summary: Adicionar produtos em um ciclo
      description: |
        Adiciona um ou mais produtos **apenas em um ciclo** da assinatura. A
        composição permanente não muda: o ciclo seguinte volta a cobrar os
        produtos de sempre, sem nenhuma ação adicional.

        `cycle_index` é opcional — sem ele, os produtos entram no **próximo
        ciclo** (`completed_cycles + 1`). Informando, precisa ser um ciclo ainda
        não processado. O ciclo usado vem em `cycle_index` na resposta.

        A forma de identificar o produto é a mesma de
        [adicionar produtos](/api-reference/subscriptions/adicionar-produtos):
        `product_id` para produtos internos da Appmax, `shopify_product_id` +
        `shopify_variant_id` para produtos da Shopify. O valor do ciclo passa a
        ser o valor da assinatura somado aos produtos adicionados.

        Este endpoint também **desfaz uma remoção**: se o produto informado é da
        assinatura e tinha sido removido daquele ciclo, ele volta à composição.

        ::: tip Produto avulso, sem exigência de periodicidade
        Como o produto vale só para aquele ciclo, a variante **não** precisa ter
        a mesma periodicidade da assinatura.
        :::

        ::: warning Ciclos pulados
        Um ciclo marcado para ser
        [pulado](/api-reference/subscriptions/pular-ciclo) não aceita alterações,
        e um ciclo alterado não pode ser pulado — desfaça as alterações antes.
        :::
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddSubscriptionCycleProductsRequest'
            examples:
              nextCycle:
                summary: Próximo ciclo (sem informar o ciclo)
                value:
                  products:
                    - product_id: 55
                      quantity: 1
              specificCycle:
                summary: Ciclo específico
                value:
                  cycle_index: 3
                  products:
                    - product_id: 55
                      quantity: 1
              shopify:
                summary: Produto da Shopify
                value:
                  cycle_index: 3
                  products:
                    - shopify_product_id: '123'
                      shopify_variant_id: '456'
                      quantity: 1
      responses:
        '200':
          description: Produtos adicionados ao ciclo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionCycleProductsResponse'
              examples:
                default:
                  value:
                    data:
                      cycle_index: 3
                      products:
                        - name: Produto A
                          price: 100
                          quantity: 1
                          product_id: 55
                          sku: SKU-A
                      added_products:
                        - product_id: 77
                          quantity: 1
                          price: 30
                      removed_products: []
                      value: 130
        '400':
          description: |
            Ciclo já processado, fora do limite de `max_cycles` ou marcado para
            ser pulado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
              examples:
                alreadyProcessed:
                  value:
                    errors:
                      message: Só é possível alterar ciclos que ainda não foram processados.
                skipped:
                  value:
                    errors:
                      message: Não é possível adicionar produtos em um ciclo pulado.
        '404':
          description: Assinatura não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
        '409':
          description: |
            Produto já presente no ciclo, ou assinatura com cobrança em andamento
            / dentro da janela do agendador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
              examples:
                alreadyInCycle:
                  value:
                    errors:
                      message: Produto já está no ciclo informado.
        '422':
          description: |
            Assinatura não ativa, produto inválido/inativo ou variante não
            encontrada na Shopify.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
        '500':
          description: Erro ao adicionar produto no ciclo da assinatura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'

  /v1/subscriptions/{id}/cycles/products/{productRef}:
    delete:
      operationId: removeSubscriptionCycleProduct
      tags: [Subscriptions]
      summary: Remover produto de um ciclo
      description: |
        Remove um produto **apenas daquele ciclo**, sem alterar a composição
        permanente da assinatura. Vale para os dois casos:

        - um produto que tinha sido **adicionado** ao ciclo — desfaz a adição;
        - um produto **da assinatura** — ele deixa de ser cobrado e entregue
          naquele ciclo, e o valor do ciclo cai no preço dele.

        `cycle_index` é opcional na query string — sem ele, vale o **próximo
        ciclo** (`completed_cycles + 1`).

        Quando o ciclo volta integralmente à composição da assinatura, a
        alteração deixa de existir.

        ::: warning O ciclo não pode ficar vazio
        Sempre precisa sobrar ao menos um produto no ciclo, senão não haveria o
        que cobrar. A tentativa de remover o último responde `422`.
        :::
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
        - $ref: '#/components/parameters/SubscriptionCycleProductRef'
        - $ref: '#/components/parameters/SubscriptionCycleIndexQuery'
      responses:
        '200':
          description: Produto removido do ciclo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionCycleProductsResponse'
              examples:
                default:
                  value:
                    data:
                      cycle_index: 3
                      products:
                        - name: Produto A
                          price: 100
                          quantity: 1
                          product_id: 55
                          sku: SKU-A
                      added_products: []
                      removed_products:
                        - product_id: 56
                          quantity: 1
                          price: 40
                      value: 110
        '400':
          description: Ciclo já processado ou fora do limite de `max_cycles`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
        '404':
          description: |
            Assinatura não encontrada, ou o produto não está no ciclo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
              examples:
                notInCycle:
                  value:
                    errors:
                      message: Produto não está na assinatura.
        '409':
          description: Cobrança em andamento / dentro da janela do agendador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
        '422':
          description: |
            Assinatura não ativa, ou a remoção deixaria o ciclo sem nenhum
            produto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
              examples:
                emptyCycle:
                  value:
                    errors:
                      message: O ciclo deve manter ao menos um produto.
        '500':
          description: Erro ao remover produto do ciclo da assinatura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'

  /v1/subscriptions/{id}/cycles/products/{productRef}/quantity:
    patch:
      operationId: updateSubscriptionCycleProductQuantity
      tags: [Subscriptions]
      summary: Alterar a quantidade de um produto em um ciclo
      description: |
        Altera a quantidade de um produto **apenas naquele ciclo**, sem mexer na
        composição permanente da assinatura. Vale tanto para um produto da
        assinatura quanto para um que foi
        [adicionado ao ciclo](/api-reference/subscriptions/adicionar-produtos-ciclo).

        `cycle_index` é opcional — sem ele, vale o **próximo ciclo**
        (`completed_cycles + 1`). O valor do ciclo acompanha a nova quantidade.

        Voltar à quantidade original desfaz a alteração; quando o ciclo fica
        igual à assinatura, a alteração deixa de existir.

        ::: warning Quantidade mínima
        A quantidade precisa ser no mínimo `1`. Para não cobrar o produto
        naquele ciclo, use
        [remover produto de um ciclo](/api-reference/subscriptions/remover-produto-ciclo).
        :::
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
        - $ref: '#/components/parameters/SubscriptionCycleProductRef'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubscriptionCycleProductQuantityRequest'
            examples:
              nextCycle:
                summary: Próximo ciclo
                value:
                  quantity: 3
              specificCycle:
                summary: Ciclo específico
                value:
                  cycle_index: 3
                  quantity: 3
      responses:
        '200':
          description: Quantidade alterada para aquele ciclo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionCycleProductsResponse'
              examples:
                default:
                  value:
                    data:
                      cycle_index: 3
                      products:
                        - name: Produto A
                          price: 100
                          quantity: 3
                          product_id: 55
                          sku: SKU-A
                      added_products: []
                      removed_products: []
                      quantity_changes:
                        - reference: '55'
                          quantity: 3
                          previous_quantity: 1
                          name: Produto A
                          sku: SKU-A
                          product_id: 55
                      value: 310
        '400':
          description: |
            Ciclo já processado, fora do limite de `max_cycles` ou marcado para
            ser pulado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
        '404':
          description: Assinatura não encontrada, ou o produto não está no ciclo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
        '409':
          description: Cobrança em andamento / dentro da janela do agendador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
        '422':
          description: Assinatura não ativa ou quantidade menor que 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
        '500':
          description: Erro ao alterar a quantidade do produto no ciclo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'

  /v1/subscriptions/{id}/address:
    get:
      operationId: getSubscriptionAddress
      tags: [Subscriptions]
      summary: Consultar o endereço de entrega
      description: |
        Devolve o endereço de entrega que vale hoje para a assinatura.

        Assinatura que ainda não tem endereço próprio — criada antes desta rota
        existir, por exemplo — responde com o endereço do cadastro do cliente.
        `data.address` só vem `null` quando nenhuma das duas origens tem endereço
        utilizável (sem logradouro e sem CEP).

        O `postcode` vem apenas com dígitos e, em endereço brasileiro, o `state`
        vem em maiúsculas.
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
      responses:
        '200':
          description: Endereço em vigor na assinatura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSubscriptionAddressResponse'
              examples:
                default:
                  summary: Assinatura com endereço
                  value:
                    data:
                      address:
                        country: BR
                        state: SP
                        city: São Paulo
                        district: Centro
                        street: Rua São Bento
                        number: '111'
                        complement: Bloco 7
                        postcode: '01010000'
                empty:
                  summary: Sem endereço na assinatura nem no cliente
                  value:
                    data:
                      address: null
        '404':
          description: Assinatura não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
              examples:
                default:
                  value:
                    errors:
                      message: Assinatura não encontrada.
        '500':
          description: Erro ao retornar o endereço da assinatura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'

    post:
      operationId: createSubscriptionAddress
      tags: [Subscriptions]
      summary: Cadastrar o endereço de entrega
      description: |
        Cadastra o endereço próprio da assinatura, usado nos próximos ciclos de
        cobrança.

        Use quando a assinatura ainda não tem endereço próprio. Se já tiver, a
        resposta é `409` — nesse caso o caminho é o `PATCH` desta mesma rota.

        O `postcode` é gravado sem pontuação e o `state` de endereço brasileiro
        é gravado em maiúsculas — a resposta devolve os valores já normalizados.

        ::: tip
        O endereço é da assinatura, não do cliente: cadastrá-lo não altera o
        cadastro do cliente nem as outras assinaturas dele.
        :::

        Um cadastro bem-sucedido dispara o webhook `subscription_address_updated`.
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionAddressRequest'
            examples:
              default:
                summary: Endereço nacional
                value:
                  address:
                    postcode: 01010-000
                    street: Rua São Bento
                    number: '111'
                    complement: Bloco 7
                    district: Centro
                    city: São Paulo
                    state: SP
              international:
                summary: Endereço internacional
                value:
                  address:
                    country: CL
                    postcode: '1240000'
                    street: Avenida Angamos
                    number: '601'
                    district: Antofagasta
                    city: Antofagasta
                    state: Antofagasta
      responses:
        '201':
          description: Endereço cadastrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionAddressResponse'
              examples:
                default:
                  value:
                    data:
                      address:
                        country: BR
                        state: SP
                        city: São Paulo
                        district: Centro
                        street: Rua São Bento
                        number: '111'
                        complement: Bloco 7
                        postcode: '01010000'
        '404':
          description: Assinatura não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
              examples:
                default:
                  value:
                    errors:
                      message: Assinatura não encontrada.
        '409':
          description: A assinatura já tem endereço próprio — use o `PATCH`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
              examples:
                default:
                  value:
                    errors:
                      message: A assinatura 123 já possui endereço próprio.
        '422':
          description: Erro de validação dos campos do endereço.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
              examples:
                default:
                  value:
                    errors:
                      message:
                        address.postcode:
                          - The address.postcode field is required.
        '500':
          description: Erro ao cadastrar o endereço da assinatura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'

    patch:
      operationId: updateSubscriptionAddress
      tags: [Subscriptions]
      summary: Atualizar o endereço de entrega
      description: |
        Atualiza o endereço de entrega da assinatura. Aplica-se aos próximos
        ciclos de cobrança.

        O endereço é gravado na própria assinatura. Se ela ainda não tiver
        endereço próprio, esta rota **cadastra** o endereço enviado em vez de
        devolver erro — não é preciso descobrir antes qual é o caso.

        O `postcode` é gravado sem pontuação e o `state` de endereço brasileiro
        é gravado em maiúsculas — a resposta devolve os valores já normalizados.

        ::: tip
        O endereço é da assinatura, não do cliente: alterá-lo não muda o cadastro
        do cliente nem as outras assinaturas dele.
        :::

        Uma alteração bem-sucedida dispara o webhook `subscription_address_updated`.
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionAddressRequest'
            examples:
              default:
                value:
                  address:
                    postcode: 01010-000
                    street: Rua São Bento
                    number: '111'
                    complement: Bloco 7
                    district: Centro
                    city: São Paulo
                    state: SP
      responses:
        '200':
          description: Endereço atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionAddressResponse'
              examples:
                default:
                  value:
                    data:
                      address:
                        country: BR
                        state: SP
                        city: São Paulo
                        district: Centro
                        street: Rua São Bento
                        number: '111'
                        complement: Bloco 7
                        postcode: '01010000'
        '404':
          description: Assinatura não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
              examples:
                default:
                  value:
                    errors:
                      message: Assinatura não encontrada.
        '422':
          description: Erro de validação dos campos do endereço.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
              examples:
                default:
                  value:
                    errors:
                      message:
                        address.postcode:
                          - The address.postcode field is required.
        '500':
          description: Erro ao atualizar o endereço da assinatura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'

  /v1/subscriptions/{id}/cycles/discount:
    patch:
      operationId: setSubscriptionCycleDiscount
      tags: [Subscriptions]
      summary: Definir o desconto de um ciclo
      description: |
        Define um desconto que vale **apenas em um ciclo**, sobrepondo o desconto da
        assinatura naquela cobrança. Os demais ciclos seguem com o desconto normal.

        Omita `cycle_index` para aplicar no **próximo ciclo**. O desconto substitui o
        da assinatura, não soma — e no percentual incide sobre os produtos daquele
        ciclo, já com as alterações de produto que ele tiver.

        Use o `DELETE` deste mesmo caminho para remover o desconto do ciclo e devolvê-lo
        ao desconto da assinatura.
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetCycleDiscountRequest'
            examples:
              proximo:
                summary: R$ 40,00 no próximo ciclo
                value:
                  discount: 40
                  discount_type: nominal
              especifico:
                summary: 15% no ciclo 4
                value:
                  cycle_index: 4
                  discount: 15
                  discount_type: percent
      responses:
        '200':
          description: Desconto do ciclo definido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleDiscountResponse'
        '400':
          description: |
            Ciclo já processado, ciclo pulado, ou fora do limite da assinatura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
              examples:
                processado:
                  value:
                    errors:
                      message: Só é possível alterar ciclos que ainda não foram processados.
                pulado:
                  value:
                    errors:
                      message: Não é possível alterar o desconto de um ciclo pulado.
        '404':
          description: Assinatura não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
        '422':
          description: |
            Erro de validação, assinatura não ativa, cobrança em andamento, ou desconto
            que deixaria o valor do ciclo abaixo do mínimo de R$ 5,00.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
    delete:
      operationId: removeSubscriptionCycleDiscount
      tags: [Subscriptions]
      summary: Remover o desconto de um ciclo
      description: |
        Remove o desconto próprio do ciclo. A cobrança daquele ciclo volta a usar o
        desconto da assinatura.

        Omita `cycle_index` para agir sobre o **próximo ciclo**. Remover um ciclo que não
        tinha desconto próprio não faz nada e responde `200`.
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
        - name: cycle_index
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: |
            Ciclo a limpar. Omitido, vale para o próximo ciclo.
          example: 4
      responses:
        '200':
          description: Desconto do ciclo removido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleDiscountResponse'
        '404':
          description: Assinatura não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'

  /v1/subscriptions/{id}/discount:
    patch:
      operationId: updateSubscriptionDiscount
      tags: [Subscriptions]
      summary: Alterar o desconto da assinatura
      description: |
        Define o desconto da assinatura. Pode ser chamado a qualquer momento — para
        adicionar, alterar ou remover o desconto — e vale a partir da próxima
        cobrança gerada.

        O desconto pode ser **nominal** (valor fixo em reais) ou **percentual**. No
        percentual, o desconto incide sobre o valor dos produtos e é recalculado a
        cada cobrança: se a composição da assinatura mudar, o desconto acompanha.
        O frete é somado depois do desconto e nunca é descontado.

        Envie `discount: 0` para remover o desconto.

        ::: tip
        Uma cobrança que já está em cobrança vencida (retentativa) não é afetada —
        ela reutiliza o pedido que já havia sido gerado. A alteração vale do
        próximo ciclo em diante.
        :::
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubscriptionDiscountRequest'
            examples:
              nominal:
                summary: Desconto fixo de R$ 40,00
                value:
                  discount: 40
                  discount_type: nominal
              percent:
                summary: Desconto de 10% sobre os produtos
                value:
                  discount: 10
                  discount_type: percent
              remove:
                summary: Remove o desconto
                value:
                  discount: 0
      responses:
        '200':
          description: Desconto atualizado. Retorna o detalhe atualizado da assinatura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionDetailResponse'
        '404':
          description: Assinatura não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
              examples:
                default:
                  value:
                    errors:
                      message: Assinatura não encontrada.
        '422':
          description: |
            Erro de validação, ou desconto que deixaria o valor da assinatura abaixo
            do mínimo de R$ 5,00.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
              examples:
                minimo:
                  summary: Desconto acima do valor da assinatura
                  value:
                    errors:
                      message: O desconto deixaria o valor da assinatura abaixo do mínimo de R$ 5,00.
                percentual:
                  summary: Percentual acima de 100
                  value:
                    errors:
                      message:
                        discount:
                          - The Discount may not be greater than 100.

  /v1/subscriptions/{id}/tag:
    patch:
      operationId: updateSubscriptionTag
      tags: [Subscriptions]
      summary: Atualizar a tag da assinatura
      description: |
        Define o apelido da assinatura — um rótulo livre de até 255 caracteres que
        você escolhe para identificar a assinatura nos seus relatórios.

        Envie `tag` vazia (`""` ou `null`) para remover o apelido. Sem apelido
        definido, todas as respostas da API devolvem o padrão `#assinatura{id}`.

        ::: tip
        A tag não aparece no painel Appmax nem no portal do assinante — ela existe
        apenas nas respostas desta API.
        :::
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubscriptionTagRequest'
            examples:
              default:
                summary: Define um apelido
                value:
                  tag: Clube do Whey
              remove:
                summary: Remove o apelido (volta ao padrão)
                value:
                  tag: ''
      responses:
        '200':
          description: Tag atualizada. Retorna o detalhe atualizado da assinatura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionDetailResponse'
        '404':
          description: Assinatura não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
              examples:
                default:
                  value:
                    errors:
                      message: Assinatura não encontrada.
        '422':
          description: Erro de validação da tag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
              examples:
                default:
                  value:
                    errors:
                      message:
                        tag:
                          - The tag may not be greater than 255 characters.
        '500':
          description: Erro ao atualizar o apelido da assinatura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'

  /v1/subscriptions/{id}/payment-method:
    patch:
      operationId: updateSubscriptionPaymentMethod
      tags: [Subscriptions]
      summary: Alterar a forma de pagamento da assinatura
      description: |
        Troca o cartão de crédito usado nas próximas cobranças da assinatura.

        O endpoint aceita **somente cartão já tokenizado**: os dados do cartão
        nunca passam pelo seu servidor. São dois passos:

        1. **No navegador do assinante**, o [Appmax JS](/guides/appmax-js)
           recebe os dados do cartão e devolve um `token` no callback
           `onSuccess`. Esse passo exige o
           [`external-id`](/guides/external-id) da instalação do app na loja.
        2. **No seu backend**, chame este endpoint enviando esse `token`.

        A bandeira e os quatro últimos dígitos são derivados do próprio token —
        não precisa (nem deve) enviá-los.

        ::: danger Esta rota exige a permissão `subscription-payment-method`
        Diferente das outras rotas de assinatura, a credencial precisa carregar
        a permissão `subscription-payment-method`. Sem ela a chamada é recusada
        pelo gateway com `403`. Fale com o time da Appmax para habilitá-la na
        credencial da sua loja. Veja [Autenticação](/guides/autenticacao).
        :::

        ::: warning
        O token precisa ter sido gerado pela mesma loja da assinatura, e a loja
        precisa usar o mesmo meio de captura em que o token foi criado. Caso
        contrário a resposta é `400`.
        :::

        Se a assinatura estiver `overdue` ou `suspended`, a cobrança em aberto é
        reprocessada na hora com o cartão novo. Aprovando, a assinatura volta
        para `active` e a próxima cobrança é reagendada — a resposta já traz o
        `status` atualizado.

        ::: tip
        Neste momento o endpoint troca apenas entre cartões de crédito. Uma
        assinatura em PIX passa a ser cobrada no cartão informado.
        :::
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubscriptionPaymentMethodRequest'
            examples:
              default:
                summary: Cartão tokenizado no navegador
                value:
                  payment_data:
                    token: add5cac283934dd887c0c51360bf6822
      responses:
        '200':
          description: |
            Forma de pagamento atualizada. Retorna o detalhe atualizado da
            assinatura, já com a nova bandeira e os novos quatro últimos
            dígitos em `payment.payment_info`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionDetailResponse'
        '400':
          description: |
            Token não encontrado, ou não pertence a esta loja.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
              examples:
                not_found:
                  summary: Token inexistente
                  value:
                    errors:
                      message: Token de cartão não encontrado.
                other_site:
                  summary: Token de outra loja
                  value:
                    errors:
                      message: Token de cartão inválido para esta loja.
        '403':
          description: |
            Recusado pelo gateway: a credencial não carrega a permissão
            `subscription-payment-method`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Mensagem do gateway.
              examples:
                default:
                  value:
                    message: Unauthorized
        '404':
          description: Assinatura não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
              examples:
                default:
                  value:
                    errors:
                      message: Assinatura não encontrada.
        '422':
          description: Erro de validação do token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
              examples:
                default:
                  value:
                    errors:
                      message:
                        payment_data.token:
                          - The payment data.token field is required.
        '500':
          description: Erro ao alterar a forma de pagamento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'

  /v1/subscriptions/{id}/available-products:
    get:
      operationId: listSubscriptionAvailableProducts
      tags: [Subscriptions]
      summary: Listar produtos disponíveis
      description: |
        Lista os produtos que ainda não estão na assinatura e podem ser
        adicionados a ela, já filtrados pela periodicidade da assinatura.

        O formato de cada item depende da origem da assinatura:

        - **Assinaturas de produtos Shopify** — um item por produto, com a lista
          de `variants` compatíveis com a cadência da assinatura. `q` é
          obrigatório na prática: sem termo de busca a resposta vem vazia.
        - **Assinaturas de produtos internos da Appmax** — lista simples de
          produtos ativos da loja (`product_id`, `name`, `price`, `sku`), até 30
          itens. Sem `q`, retorna os primeiros produtos em ordem alfabética.
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: |
            Termo de busca por nome ou SKU do produto. Para assinaturas Shopify,
            sem este parâmetro a resposta vem vazia.
          example: camiseta
      responses:
        '200':
          description: Produtos disponíveis retornados com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionAvailableProductsResponse'
              examples:
                shopify:
                  summary: Assinatura de produtos Shopify
                  value:
                    data:
                      products:
                        - shopify_product_id: '123'
                          title: Camiseta Branca
                          variants:
                            - shopify_variant_id: '456'
                              title: Mensal
                              price: '189.90'
                              sku: SKU-2
                              interval: month
                              interval_count: 1
                internal:
                  summary: Assinatura de produtos internos
                  value:
                    data:
                      products:
                        - product_id: 55
                          name: Camiseta Branca
                          price: 189.9
                          sku: SKU-2
        '404':
          description: Assinatura não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
              examples:
                default:
                  value:
                    errors:
                      message: Assinatura não encontrada.
        '500':
          description: Erro ao listar os produtos disponíveis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'

  /v1/subscriptions/{id}/products:
    post:
      operationId: addSubscriptionProducts
      tags: [Subscriptions]
      summary: Adicionar produtos
      description: |
        Adiciona um ou mais produtos a uma assinatura existente. Retorna o detalhe
        atualizado da assinatura.

        Funciona para os dois tipos de assinatura, e a forma de identificar o
        produto muda conforme o tipo — sempre use os identificadores devolvidos por
        [produtos disponíveis](/api-reference/subscriptions/produtos-disponiveis):

        - **Produtos internos da Appmax** → `product_id` (+ `quantity`). Nome,
          preço e SKU vêm do cadastro do produto; se enviados, são ignorados.
        - **Produtos da Shopify** → `shopify_product_id` **e**
          `shopify_variant_id` (+ `quantity`). O preço é lido da variante.

        ::: warning A assinatura precisa estar "parada"
        Alterar produtos só é permitido enquanto a assinatura está ativa, não
        pausada e sem cobrança em andamento. Veja os erros `409` e `422` abaixo.
        :::

        ::: warning Assinaturas sem produtos
        A gestão de produtos exige uma assinatura com produtos definidos: criada
        com `products` no [criar assinatura](/api-reference/subscriptions/criar-assinatura)
        ou originada de um checkout Shopify. Assinaturas criadas sem `products`
        (que herdam o valor do pedido) respondem `404` aqui.
        :::
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddSubscriptionProductsRequest'
            examples:
              internal:
                summary: Produto interno da Appmax
                value:
                  products:
                    - product_id: 55
                      quantity: 1
              shopify:
                summary: Produto da Shopify
                value:
                  products:
                    - shopify_product_id: '123'
                      shopify_variant_id: '456'
                      quantity: 1
      responses:
        '200':
          description: Produtos adicionados. Retorna o detalhe atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionDetailResponse'
        '404':
          description: Assinatura não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
              examples:
                default:
                  value:
                    errors:
                      message: Assinatura não encontrada.
        '409':
          description: |
            Produto repetido na requisição, produto que já está na assinatura, ou
            assinatura com cobrança em andamento / dentro da janela do agendador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
              examples:
                alreadyInSubscription:
                  value:
                    errors:
                      message: Produto já está na assinatura.
                duplicated:
                  value:
                    errors:
                      message: Produto duplicado na seleção.
                chargeInFlight:
                  value:
                    errors:
                      message: charge_in_flight
        '422':
          description: |
            Erro de validação, produto inválido para a assinatura, ou assinatura
            inativa/pausada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
              examples:
                validation:
                  summary: Campo obrigatório ausente
                  value:
                    errors:
                      message:
                        products:
                          - The products field is required.
                invalidProduct:
                  summary: Identificadores Shopify ausentes
                  value:
                    errors:
                      message: 'Produto inválido: shopify_product_id e shopify_variant_id são obrigatórios.'
                paused:
                  summary: Assinatura pausada
                  value:
                    errors:
                      message: status_paused
        '500':
          description: Erro ao adicionar produto à assinatura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'

  /v1/subscriptions/{id}/products/{variantId}/quantity:
    patch:
      operationId: updateSubscriptionProductQuantity
      tags: [Subscriptions]
      summary: Alterar a quantidade de um produto
      description: |
        Altera a quantidade de um produto já presente na assinatura. Vale para os
        dois tipos de assinatura — o produto é identificado na URL pelo `variantId`,
        que é o `product_id` (produtos internos da Appmax) ou o `variant_id`
        (produtos da Shopify) mostrado no detalhe da assinatura. Retorna o detalhe
        atualizado.

        ::: warning A assinatura precisa estar "parada"
        Alterar produtos só é permitido enquanto a assinatura está ativa, não
        pausada e sem cobrança em andamento. Veja os erros `409` e `422` abaixo.
        :::
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
        - $ref: '#/components/parameters/SubscriptionVariantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubscriptionProductQuantityRequest'
            examples:
              default:
                value:
                  quantity: 3
      responses:
        '200':
          description: Quantidade atualizada. Retorna o detalhe atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionDetailResponse'
        '404':
          description: Assinatura não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
              examples:
                default:
                  value:
                    errors:
                      message: Assinatura não encontrada.
        '409':
          description: |
            Assinatura com cobrança em andamento ou dentro da janela do agendador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
              examples:
                default:
                  value:
                    errors:
                      message: charge_in_scheduler_window
        '422':
          description: |
            Erro de validação, produto ausente na assinatura ou assinatura
            inativa/pausada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
              examples:
                validation:
                  summary: Campo obrigatório ausente
                  value:
                    errors:
                      message:
                        quantity:
                          - The quantity field is required.
                paused:
                  summary: Assinatura pausada
                  value:
                    errors:
                      message: status_paused
        '500':
          description: Erro ao atualizar quantidade do produto na assinatura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'

  /v1/subscriptions/{id}/products/{variantId}:
    delete:
      operationId: removeSubscriptionProduct
      tags: [Subscriptions]
      summary: Remover um produto
      description: |
        Remove um produto da assinatura. Vale para os dois tipos de assinatura — o
        produto é identificado na URL pelo `variantId`, que é o `product_id`
        (produtos internos da Appmax) ou o `variant_id` (produtos da Shopify)
        mostrado no detalhe da assinatura. Retorna o detalhe atualizado, sem o
        produto removido.

        A assinatura precisa manter pelo menos um produto — para encerrá-la por
        completo use [cancelar assinatura](/api-reference/subscriptions/cancelar-assinatura).

        ::: warning
        A rota é `DELETE /v1/subscriptions/{id}/products/{variantId}` — sem o
        sufixo `/quantity`. Alterar produtos só é permitido enquanto a assinatura
        está ativa, não pausada e sem cobrança em andamento.
        :::
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
        - $ref: '#/components/parameters/SubscriptionVariantId'
      responses:
        '200':
          description: Produto removido. Retorna o detalhe atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionDetailResponse'
        '404':
          description: Assinatura não encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
              examples:
                default:
                  value:
                    errors:
                      message: Assinatura não encontrada.
        '409':
          description: |
            Assinatura com cobrança em andamento ou dentro da janela do agendador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
              examples:
                default:
                  value:
                    errors:
                      message: charge_in_flight
        '422':
          description: |
            Último produto da assinatura, produto ausente na assinatura ou
            assinatura inativa/pausada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'
              examples:
                lastProduct:
                  value:
                    errors:
                      message: A assinatura deve manter ao menos um produto.
                paused:
                  value:
                    errors:
                      message: status_paused
        '500':
          description: Erro ao remover produto da assinatura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageErrorEnvelope'

  /v1/products:
    get:
      operationId: listProducts
      tags: [Products]
      summary: Listar produtos
      description: |
        Lista os produtos do merchant com paginação, filtro por nome/status e
        ordenação. Retorna **20 itens por página**. Cada produto pertence a uma
        *company*, resolvida automaticamente a partir das credenciais.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Página da listagem.
          example: 1
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Filtra produtos cujo nome contém o termo informado.
          example: camiseta
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, inactive, all]
            default: active
          description: |
            Sem valor ou `active`: apenas ativos. `inactive`: apenas inativos.
            `all`: todos.
          example: active
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            enum: [name, price, created_at]
            default: name
          description: Campo de ordenação.
          example: price
        - name: sort_dir
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
          description: Direção da ordenação.
          example: asc
      responses:
        '200':
          description: Lista de produtos retornada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProductsResponse'
              examples:
                default:
                  value:
                    data:
                      products:
                        - id: 10
                          sku: SKU-1
                          name: Camiseta Preta
                          price: 199.9
                          description: Camiseta 100% algodão
                          image: /uploads/a.png
                          inventory: 5
                          cost: 50.0
                          is_active: true
                          created_at: '2026-07-01 10:00:00'
                          updated_at: '2026-07-02 12:00:00'
                      pagination:
                        total: 1
                        per_page: 20
                        current_page: 1
                        last_page: 1
        '422':
          description: Parâmetros de consulta inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
              examples:
                default:
                  value:
                    errors:
                      message:
                        status:
                          - The selected status is invalid.
        '500':
          description: Erro ao listar os produtos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductErrorEnvelope'
              examples:
                default:
                  value:
                    errors:
                      message: Erro ao listar os produtos.
    post:
      operationId: createProduct
      tags: [Products]
      summary: Criar um produto
      description: |
        Cria um novo produto para o merchant. Os campos `name` e `price` são
        obrigatórios. O produto é criado ativo (`is_active: true`).

        ::: tip Unicidade
        `sku` e `external_id` devem ser únicos por company. Se já existir um
        produto com o mesmo valor, a API retorna `422`.
        :::
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
            examples:
              default:
                summary: Produto com todos os campos
                value:
                  name: Camiseta Preta
                  price: 199.9
                  sku: SKU-1
                  external_id: EXT-123
                  description: Camiseta 100% algodão
                  image: /uploads/a.png
                  inventory: 5
                  cost: 50.0
      responses:
        '201':
          description: Produto criado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
              examples:
                default:
                  value:
                    data:
                      id: 10
                      sku: SKU-1
                      name: Camiseta Preta
                      price: 199.9
                      description: Camiseta 100% algodão
                      image: /uploads/a.png
                      inventory: 5
                      cost: 50.0
                      is_active: true
                      created_at: '2026-07-01 10:00:00'
                      updated_at: '2026-07-01 10:00:00'
        '422':
          description: |
            Erro de validação dos campos ou `sku`/`external_id` duplicado para a
            company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
              examples:
                validation:
                  summary: Campos obrigatórios ausentes
                  value:
                    errors:
                      message:
                        name:
                          - The name field is required.
                        price:
                          - The price field is required.
                duplicate:
                  summary: SKU ou external_id duplicado
                  value:
                    errors:
                      message: Já existe um produto com o mesmo SKU ou external_id.
        '500':
          description: Erro ao criar o produto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductErrorEnvelope'
              examples:
                default:
                  value:
                    errors:
                      message: Erro ao criar o produto.

  /v1/products/{id}:
    get:
      operationId: getProduct
      tags: [Products]
      summary: Consultar um produto
      description: |
        Retorna um produto específico do merchant pelo identificador (`id`).
        Produtos de outra company são tratados como inexistentes (`404`).
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Produto retornado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
              examples:
                default:
                  value:
                    data:
                      id: 10
                      sku: SKU-1
                      name: Camiseta Preta
                      price: 199.9
                      description: Camiseta 100% algodão
                      image: /uploads/a.png
                      inventory: 5
                      cost: 50.0
                      is_active: true
                      created_at: '2026-07-01 10:00:00'
                      updated_at: '2026-07-02 12:00:00'
        '404':
          description: Produto inexistente ou de outra company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductErrorEnvelope'
              examples:
                default:
                  value:
                    errors:
                      message: Produto não encontrado.
        '500':
          description: Erro ao buscar o produto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductErrorEnvelope'
              examples:
                default:
                  value:
                    errors:
                      message: Erro ao buscar o produto.
    put:
      operationId: updateProduct
      tags: [Products]
      summary: Atualizar um produto
      description: |
        Atualiza os dados de um produto existente. Envie apenas os campos que
        deseja alterar; todos são opcionais e seguem as mesmas regras da criação.
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
            examples:
              default:
                summary: Atualização parcial
                value:
                  name: Camiseta Preta Slim
                  price: 219.9
      responses:
        '200':
          description: Produto atualizado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
              examples:
                default:
                  value:
                    data:
                      id: 10
                      sku: SKU-1
                      name: Camiseta Preta Slim
                      price: 219.9
                      description: Camiseta 100% algodão
                      image: /uploads/a.png
                      inventory: 5
                      cost: 50.0
                      is_active: true
                      created_at: '2026-07-01 10:00:00'
                      updated_at: '2026-07-02 13:30:00'
        '404':
          description: Produto inexistente ou de outra company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductErrorEnvelope'
              examples:
                default:
                  value:
                    errors:
                      message: Produto não encontrado.
        '422':
          description: Erro de validação ou `sku`/`external_id` duplicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
              examples:
                duplicate:
                  summary: SKU ou external_id duplicado
                  value:
                    errors:
                      message: Já existe um produto com o mesmo SKU ou external_id.
        '500':
          description: Erro ao atualizar o produto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductErrorEnvelope'
              examples:
                default:
                  value:
                    errors:
                      message: Erro ao atualizar o produto.
    delete:
      operationId: deleteProduct
      tags: [Products]
      summary: Excluir um produto
      description: |
        Exclui um produto do merchant. A exclusão é feita por **soft delete**: o
        produto é marcado como inativo (`is_active: false`) e continua consultável
        com o filtro de status `inactive` ou `all`.

        ::: warning Bloqueio
        A exclusão é bloqueada (`409`) quando o produto está vinculado a uma
        assinatura.
        :::
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Produto excluído (soft delete) com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
              examples:
                default:
                  value:
                    data:
                      id: 10
                      sku: SKU-1
                      name: Camiseta Preta
                      price: 199.9
                      description: Camiseta 100% algodão
                      image: /uploads/a.png
                      inventory: 5
                      cost: 50.0
                      is_active: false
                      created_at: '2026-07-01 10:00:00'
                      updated_at: '2026-07-02 14:00:00'
        '404':
          description: Produto inexistente ou de outra company.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductErrorEnvelope'
              examples:
                default:
                  value:
                    errors:
                      message: Produto não encontrado.
        '409':
          description: Produto vinculado a uma assinatura não pode ser excluído.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductErrorEnvelope'
              examples:
                default:
                  value:
                    errors:
                      message: Produto vinculado a uma assinatura não pode ser excluído.
        '500':
          description: Erro ao excluir o produto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductErrorEnvelope'
              examples:
                default:
                  value:
                    errors:
                      message: Erro ao excluir o produto.

  /v1/payment-link:
    post:
      operationId: createPaymentLink
      tags: [Payment Links]
      summary: Criar um link de pagamento
      description: |
        Cria um novo link de pagamento. A resposta traz o `checkout_url` — a URL
        hospedada pela Appmax que você compartilha com o comprador para que ele
        finalize o pagamento.

        A requisição deve conter um token Bearer do **merchant**, obtido no
        fluxo de autenticação. Veja
        [Autenticação](/guides/autenticacao).

        ::: warning
        O campo `value` é informado em **centavos** e o mínimo aceito é `500`
        (R$ 5,00).
        :::

        O campo `fee_transfer_from_installment` define a partir de qual parcela
        o custo do parcelamento é repassado ao comprador. Com o valor `0`
        (default), o custo é absorvido pelo merchant em todas as parcelas.

        O campo `document` é opcional. Quando informado, deve conter um CPF ou
        CNPJ válido e o merchant deve possuir vínculo com a empresa do
        documento informado.

        ::: warning Comportamento padrão do documento
        Quando já existe um link de pagamento criado e vinculado a uma empresa,
        a última empresa utilizada na criação de um link passa a ser o padrão.
        Portanto, ao criar um novo link **sem informar o campo `document`**, o
        sistema continuará criando o link vinculado à última empresa utilizada,
        mesmo que uma nova empresa tenha sido cadastrada posteriormente. Para
        garantir que o link seja vinculado a uma empresa específica, informe o
        `document` correspondente no payload.
        :::
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentLinkRequest'
      responses:
        '201':
          description: Link de pagamento criado com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: ID do link de pagamento criado.
                        example: 244975
                      checkout_url:
                        type: string
                        description: URL de checkout a ser compartilhada com o comprador.
                        example: 'https://link_de_pagamento/pl/ID_DO_LINK'
        '400':
          description: Requisição inválida.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: object
                    properties:
                      message:
                        type: string
                        description: Mensagem descrevendo o problema.
                        example: "O nome 'Nome douto' viola os termos de uso da plataforma Appmax."
        '401':
          description: Não autorizado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: object
                    properties:
                      message:
                        type: string
                        description: Motivo da não autorização.
                        example: Usuário sem permissão
        '403':
          description: Usuário bloqueado para criar links de pagamento.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: object
                    properties:
                      message:
                        type: string
                        description: Motivo do bloqueio.
                        example: Usuário bloqueado para a criação de links de pagamento
        '404':
          description: Empresa do documento não encontrada ou não vinculada ao merchant.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: object
                    properties:
                      message:
                        type: string
                        description: Mensagem de erro.
                        example: Você não possui vínculo com a empresa do documento informado.
        '422':
          description: Erro na validação dos dados ou erro de negócio ao processar a criação.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: object
                    properties:
                      message:
                        type: string
                        description: Houve um erro ao criar seu link de pagamento. Por favor, tente novamente mais tarde.
                        example: Houve um erro ao criar seu link de pagamento. Por favor, tente novamente mais tarde.
              examples:
                camposObrigatorios:
                  summary: Campos obrigatórios ausentes ou inválidos
                  value:
                    errors:
                      message:
                        name:
                          - O campo name é obrigatório.
                        value:
                          - O campo value é obrigatório.
                        description:
                          - O campo description é obrigatório.
                        payments:
                          - O campo payments é obrigatório.
                valorMinimo:
                  summary: Valor abaixo do mínimo permitido
                  value:
                    errors:
                      message:
                        value:
                          - Valor mínimo de R$ 5,00
                metodoPagamentoInvalido:
                  summary: Método de pagamento não permitido
                  value:
                    errors:
                      message:
                        payments.0:
                          - 'Método de pagamento inválido. Os métodos de pagamento disponíveis são: creditcard,boleto,pix'
                parcelasObrigatorias:
                  summary: max_installments obrigatório quando credit card está presente
                  value:
                    errors:
                      message:
                        max_installments:
                          - O campo max installments é obrigatório.
                documentoInvalido:
                  summary: Documento em formato inválido
                  value:
                    errors:
                      message:
                        document:
                          - Documento inválido.

  /v1/payment-link/{payment_link_id}/orders:
    get:
      operationId: getPaymentLinkOrders
      tags: [Payment Links]
      summary: Consultar os dados de um link de pagamento
      description: |
        Retorna os pedidos gerados por um determinado link de pagamento, com o
        status de cada um. Use para acompanhar as conversões do link criado em
        [`POST /v1/payment-link`](/api-reference/payment-links/criar-link-pagamento).

        A resposta é paginada: `meta` traz os totais da consulta e `links` traz
        as URLs de navegação entre as páginas.
      parameters:
        - $ref: '#/components/parameters/PaymentLinkId'
      responses:
        '200':
          description: Link de pagamento encontrado com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: Pedidos gerados pelo link de pagamento.
                    items:
                      type: object
                      properties:
                        order:
                          type: object
                          properties:
                            id:
                              type: integer
                              description: ID do pedido.
                              example: 1
                            status:
                              type: string
                              description: Status do pedido.
                              example: cancelado
                            total:
                              type: integer
                              description: Valor total do pedido em **centavos**.
                              example: 6000
                  meta:
                    type: object
                    description: Metadados da paginação.
                    properties:
                      total:
                        type: integer
                        description: Total de pedidos encontrados.
                        example: 2
                      page:
                        type: integer
                        description: Página atual.
                        example: 1
                      per_page:
                        type: integer
                        description: Quantidade de itens por página.
                        example: 20
                      total_pages:
                        type: integer
                        description: Total de páginas.
                        example: 1
                  links:
                    type: object
                    description: URLs de navegação da paginação.
                    properties:
                      self:
                        type: string
                        example: 'https://api.appmax.com.br/v1/payment-link/1/orders?page=1'
                      next:
                        type: [string, 'null']
                        example: null
                      prev:
                        type: [string, 'null']
                        example: null
                      last:
                        type: string
                        example: 'https://api.appmax.com.br/v1/payment-link/1/orders?page=1'
              examples:
                default:
                  value:
                    data:
                      - order:
                          id: 1
                          status: cancelado
                          total: 6000
                      - order:
                          id: 2
                          status: pendente
                          total: 6000
                    meta:
                      total: 2
                      page: 1
                      per_page: 20
                      total_pages: 1
                    links:
                      self: 'https://api.appmax.com.br/v1/payment-link/1/orders?page=1'
                      next: null
                      prev: null
                      last: 'https://api.appmax.com.br/v1/payment-link/1/orders?page=1'
        '401':
          description: Erro de autenticação.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Token Bearer do **merchant** obtido via `POST /oauth2/token` usando as
        credenciais do merchant (não do app). Veja
        [Autenticação](/guides/autenticacao).
    secretHeader:
      type: apiKey
      in: header
      name: secret
      description: |
        Autenticação via header `secret` (API Gateway).

  parameters:
    SubscriptionId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Identificador da assinatura.
      example: 10
    SubscriptionVariantId:
      name: variantId
      in: path
      required: true
      schema:
        type: string
      description: |
        Identificador do produto dentro da assinatura, retornado no detalhe:

        - assinaturas de produtos Shopify → `variant_id` (o `shopify_variant_id`);
        - assinaturas de produtos internos da Appmax → `product_id`.
      example: '456'
    SubscriptionCycleIndex:
      name: cycleIndex
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: |
        Número do ciclo de recorrência (1 = primeiro ciclo após a cobrança de
        origem). Precisa ser maior que `completed_cycles`.
      example: 3
    SubscriptionCycleIndexQuery:
      name: cycle_index
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
      description: |
        Ciclo a alterar. Omitido, vale o próximo ciclo da assinatura
        (`completed_cycles + 1`).
      example: 3
    SubscriptionCycleProductRef:
      name: productRef
      in: path
      required: true
      schema:
        type: string
      description: |
        Identificador do produto adicionado ao ciclo: `shopify_variant_id` em
        assinaturas da Shopify, `product_id` em assinaturas de produtos internos
        da Appmax.
      example: '987'
    ProductId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Identificador único do produto.
      example: 10
    RecipientHash:
      name: recipient_hash
      in: path
      required: true
      schema:
        type: string
      description: Hash do recebedor (retornado em `POST /v1/recipient`).
      example: d9bd0dae-3274-5e5a-939f-f50d867eb652
    PagarmeRecipientHash:
      name: recipient_hash
      in: path
      required: true
      schema:
        type: string
      description: |
        `id` do recebedor, retornado em
        [Criar recebedor (contrato PagarMe)](/api-reference/pagarme/criar-recebedor).
      example: 0a0c3269-b5fa-543b-b9ad-1cf27d0944c1
    PaymentLinkId:
      name: payment_link_id
      in: path
      required: true
      schema:
        type: string
      description: ID do link de pagamento (retornado em `POST /v1/payment-link`).
      example: '2'

  responses:
    PagarmeForbidden:
      description: Token ausente ou inválido.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  message:
                    type: string
                    example: Missing Authentication Token
    PagarmeRecipientNotFound:
      description: Recebedor inexistente ou cadastrado por outro marketplace.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PagarmeMessageEnvelope'
          examples:
            default:
              value:
                data:
                  message: Recipient not found

  schemas:
    PagarmeMessageEnvelope:
      type: object
      description: Erro das rotas `/v1/p/`, com a descrição em `data.message`.
      properties:
        data:
          type: object
          properties:
            message:
              type: string
              description: Descrição do erro.

    PagarmeFieldErrors:
      type: object
      description: |
        Erro de formato das rotas `/v1/p/`: mapa `campo → [mensagens]` na raiz
        do corpo, sem envelope. A chave é o caminho do campo em notação de
        ponto (ex.: `register_information.document`).
      additionalProperties:
        type: array
        items:
          type: string

    PagarmePhoneNumber:
      type: object
      required: [ddd, number]
      properties:
        ddd:
          type: string
          description: DDD com 2 dígitos.
          example: '11'
        number:
          type: string
          description: Número com 8 ou 9 dígitos.
          example: '976187304'
        type:
          type: string
          description: Tipo do telefone.
          example: mobile

    PagarmeAddress:
      type: object
      required: [street, street_number, complementary, neighborhood, city, state, zip_code]
      properties:
        street:
          type: string
          maxLength: 255
          example: Av. Paulista
        street_number:
          type: string
          maxLength: 45
          example: '1000'
        complementary:
          type: string
          maxLength: 120
          example: Sala 10
        neighborhood:
          type: string
          maxLength: 120
          example: Bela Vista
        city:
          type: string
          maxLength: 80
          example: São Paulo
        state:
          type: string
          maxLength: 120
          example: SP
        zip_code:
          type: string
          description: CEP.
          example: '01310100'
        reference_point:
          type: string
          maxLength: 255
          description: Ponto de referência.
          example: Próximo ao metrô

    PagarmeManagingPartner:
      type: object
      description: |
        Sócio de recebedor PJ. O primeiro da lista é o representante legal e
        vira o titular do login na Appmax: `name`, `email`, `document` e
        `birthdate` são obrigatórios nele. Os demais sócios só são validados
        e ecoados na resposta do cadastro.
      properties:
        name:
          type: string
          description: Nome completo. Só letras, acentos e espaços.
          minLength: 3
          maxLength: 255
          example: Carlos Lima
        email:
          type: string
          format: email
          example: carlos@lojadocarlos.com.br
        document:
          type: string
          description: CPF, só dígitos.
          example: '52998224725'
        birthdate:
          type: string
          description: Data de nascimento em `dd/mm/aaaa` ou `aaaa-mm-dd`.
          example: 09/12/1980
        mother_name:
          type: string
          maxLength: 255
          example: Rosa Lima
        monthly_income:
          type: integer
          description: Renda mensal em centavos.
          example: 1000000
        professional_occupation:
          type: string
          maxLength: 255
          example: Empresário
        self_declared_legal_representative:
          type: boolean
          description: Se o sócio se declara representante legal.
          example: true
        phone_numbers:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/PagarmePhoneNumber'
        address:
          $ref: '#/components/schemas/PagarmeAddress'

    PagarmeRegisterInformation:
      type: object
      description: |
        Dados cadastrais do recebedor. Os campos dependem de `type`:

        - `individual` (PF): `name`, `birthdate`, `monthly_income` e `address`
          são obrigatórios;
        - `corporation` (PJ): `company_name`, `trading_name`,
          `annual_revenue`, `main_address` e `managing_partners` são
          obrigatórios.
      required: [type, email, document, site_url, phone_numbers]
      properties:
        type:
          type: string
          enum: [individual, corporation]
          description: Tipo do recebedor.
          example: individual
        email:
          type: string
          format: email
          description: |
            E-mail do recebedor. Em PJ é o e-mail da empresa; o login usa o
            e-mail do representante legal (`managing_partners[0].email`).
          example: maria.souza@exemplo.com
        document:
          type: string
          description: CPF (`individual`) ou CNPJ (`corporation`), só dígitos.
          example: '35873882029'
        site_url:
          type: string
          maxLength: 100
          description: URL da loja ou página de vendas. Opcional na PagarMe, **obrigatório aqui**.
          example: https://lojadamaria.com.br
        phone_numbers:
          type: array
          minItems: 1
          description: |
            Telefones. Opcional na PagarMe, **obrigatório aqui**. Só o
            primeiro é gravado.
          items:
            $ref: '#/components/schemas/PagarmePhoneNumber'
        name:
          type: string
          description: "**PF.** Nome completo. Só letras, acentos e espaços."
          minLength: 3
          maxLength: 255
          example: Maria Souza
        birthdate:
          type: string
          description: "**PF.** Data de nascimento em `dd/mm/aaaa` ou `aaaa-mm-dd`."
          example: 12/10/1995
        monthly_income:
          type: integer
          description: "**PF.** Renda mensal em centavos."
          example: 500000
        mother_name:
          type: string
          maxLength: 255
          description: "**PF.** Nome da mãe."
          example: Ana Souza
        professional_occupation:
          type: string
          maxLength: 255
          description: "**PF.** Profissão."
          example: Vendedora
        address:
          allOf:
            - $ref: '#/components/schemas/PagarmeAddress'
          description: "**PF.** Endereço do recebedor."
        company_name:
          type: string
          minLength: 3
          maxLength: 255
          description: "**PJ.** Nome fantasia."
          example: Loja do Carlos
        trading_name:
          type: string
          minLength: 3
          maxLength: 255
          description: "**PJ.** Razão social."
          example: Carlos Comércio LTDA
        annual_revenue:
          type: integer
          description: "**PJ.** Faturamento anual em centavos."
          example: 120000000
        corporation_type:
          type: string
          maxLength: 255
          description: "**PJ.** Tipo de empresa."
          example: LTDA
        founding_date:
          type: string
          maxLength: 255
          description: "**PJ.** Data de fundação."
          example: '2015-03-20'
        main_address:
          allOf:
            - $ref: '#/components/schemas/PagarmeAddress'
          description: "**PJ.** Endereço da empresa."
        managing_partners:
          type: array
          minItems: 1
          maxItems: 20
          description: "**PJ.** Sócios. O primeiro é o representante legal."
          items:
            $ref: '#/components/schemas/PagarmeManagingPartner'

    PagarmeBankAccountInput:
      type: object
      required: [holder_name, holder_type, holder_document, bank, branch_number, account_number, account_check_digit, type]
      properties:
        holder_name:
          type: string
          maxLength: 255
          description: Nome do titular.
          example: Maria Souza
        holder_type:
          type: string
          enum: [individual, company]
          description: |
            `individual` para recebedor pessoa física, `company` para pessoa
            jurídica.
          example: individual
        holder_document:
          type: string
          description: CPF ou CNPJ do titular. Precisa ser o documento do próprio recebedor.
          example: '35873882029'
        bank:
          type: string
          description: |
            Código COMPE do banco. Precisa estar entre os
            [bancos homologados](/guides/bancos-homologados).
          example: '001'
        branch_number:
          type: string
          description: Agência, só dígitos (até 40).
          example: '1234'
        branch_check_digit:
          type: string
          description: Dígito da agência, se houver (até 4 dígitos).
          example: '5'
        account_number:
          type: string
          description: Número da conta, só dígitos (até 13).
          example: '123456'
        account_check_digit:
          type: string
          description: Dígito da conta (até 4 dígitos).
          example: '7'
        type:
          type: string
          enum: [checking, savings]
          description: "`checking` (corrente) ou `savings` (poupança)."
          example: checking
        metadata:
          type: object
          description: Dados livres.

    PagarmeCreateRecipientRequest:
      type: object
      required: [register_information, default_bank_account]
      properties:
        code:
          type: string
          maxLength: 100
          description: Referência do recebedor no seu sistema.
          example: erp-maria-001
        metadata:
          type: object
          description: Dados livres.
        register_information:
          $ref: '#/components/schemas/PagarmeRegisterInformation'
        default_bank_account:
          $ref: '#/components/schemas/PagarmeBankAccountInput'
        transfer_settings:
          type: object
          description: |
            Aceito só com `transfer_enabled: false`. `true` retorna `422`.
          properties:
            transfer_enabled:
              type: boolean
              example: false
        automatic_anticipation_settings:
          type: object
          description: |
            Aceito só com `enabled: false`. `true` retorna `422`.
          properties:
            enabled:
              type: boolean
              example: false

    PagarmeUpdateRecipientRequest:
      type: object
      description: |
        Mesmo formato do cadastro. Só os campos editáveis são gravados; os
        demais são ignorados.
      properties:
        register_information:
          type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [individual, corporation]
              description: Tipo com que o recebedor foi cadastrado.
            name:
              type: string
              description: "**PF.** Nome do recebedor."
            birthdate:
              type: string
              description: "**PF.** Data de nascimento (`dd/mm/aaaa` ou `aaaa-mm-dd`, maior de idade)."
            phone_numbers:
              type: array
              description: Só o primeiro item é lido; envie `ddd` e `number` juntos.
              items:
                $ref: '#/components/schemas/PagarmePhoneNumber'
            address:
              allOf:
                - $ref: '#/components/schemas/PagarmeAddress'
              description: "**PF.** Endereço. Envie só os campos que quer alterar."
            main_address:
              allOf:
                - $ref: '#/components/schemas/PagarmeAddress'
              description: "**PJ.** Endereço da empresa. Envie só os campos que quer alterar."
            managing_partners:
              type: array
              description: "**PJ.** Só `name` e `birthdate` do primeiro item (representante legal) são gravados."
              items:
                type: object
                properties:
                  name:
                    type: string
                  birthdate:
                    type: string

    PagarmeBankAccount:
      type: object
      description: Conta bancária padrão do recebedor.
      properties:
        id:
          type: string
          description: Identificador da conta.
          example: '8812'
        holder_name:
          type: string
          example: Maria Souza
        holder_type:
          type: string
          enum: [individual, company]
          example: individual
        holder_document:
          type: string
          example: '35873882029'
        bank:
          type: string
          example: '001'
        branch_number:
          type: string
          description: |
            Agência. Na consulta, vem com o dígito junto (se houver), sem
            `branch_check_digit`.
          example: '1234'
        branch_check_digit:
          type: string
          description: Dígito da agência. Só na resposta do cadastro.
          example: '5'
        account_number:
          type: string
          example: '123456'
        account_check_digit:
          type: string
          example: '7'
        type:
          type: string
          enum: [checking, savings]
          example: checking
        status:
          type: string
          description: Sempre `active`.
          example: active
        created_at:
          type: string
          format: date-time
          example: '2026-10-07T14:32:10Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-10-07T14:32:10Z'
        metadata:
          type: object
          description: Só na resposta do cadastro, ecoando a entrada.

    PagarmeRecipient:
      type: object
      description: Objeto `recipient` no formato da PagarMe v5.
      properties:
        id:
          type: string
          description: "`recipient_hash` do recebedor."
          example: 0a0c3269-b5fa-543b-b9ad-1cf27d0944c1
        code:
          type: string
          description: Só na resposta do cadastro, ecoando a entrada.
          example: erp-maria-001
        name:
          type: string
          description: Nome da pessoa (PF) ou nome fantasia (PJ).
          example: Maria Souza
        email:
          type: string
          example: maria.souza@exemplo.com
        document:
          type: string
          description: CPF (PF) ou CNPJ (PJ).
          example: '35873882029'
        type:
          type: string
          enum: [individual, corporation]
          example: individual
        payment_mode:
          type: string
          description: Sempre `bank_transfer`.
          example: bank_transfer
        status:
          type: string
          enum: [registration, active, refused]
          description: |
            - `registration`: onboarding (KYC) em andamento;
            - `active`: onboarding aprovado;
            - `refused`: onboarding recusado.
          example: registration
        created_at:
          type: string
          format: date-time
          example: '2026-10-07T14:32:10Z'
        updated_at:
          type: string
          format: date-time
          example: '2026-10-07T14:32:10Z'
        transfer_settings:
          type: object
          description: |
            Fixo: a Appmax não faz saque automático por esta API, e o saque é
            sempre sob demanda.
          properties:
            transfer_enabled:
              type: boolean
              example: false
            transfer_interval:
              type: string
              nullable: true
              example: null
            transfer_day:
              type: integer
              example: 0
        default_bank_account:
          allOf:
            - $ref: '#/components/schemas/PagarmeBankAccount'
          nullable: true
        gateway_recipients:
          type: array
          description: Sempre vazio.
          items:
            type: object
        automatic_anticipation_settings:
          type: object
          description: "Fixo: antecipação automática não é configurada por esta API."
          properties:
            enabled:
              type: boolean
              example: false
            type:
              type: string
              example: full
            volume_percentage:
              type: integer
              example: 0
            delay:
              type: integer
              nullable: true
              example: null
        metadata:
          type: object
          description: Só na resposta do cadastro, ecoando a entrada.
        register_information:
          type: object
          description: |
            Dados cadastrais, com os mesmos campos da entrada. No cadastro, os
            campos não gravados são ecoados da entrada; na consulta, saem
            `null` ou são omitidos.

    PagarmeRecipientBalance:
      type: object
      properties:
        currency:
          type: string
          description: Moeda dos saldos (ISO 4217).
          example: BRL
        available_amount:
          type: integer
          description: Saldo disponível, em centavos.
          example: 152030
        waiting_funds_amount:
          type: integer
          description: Saldo a liberar, em centavos.
          example: 489900
        transferred_amount:
          type: integer
          description: Total líquido já transferido para a conta do recebedor, em centavos.
          example: 1250000
        recipient:
          type: object
          description: Resumo do recebedor.
          properties:
            id:
              type: string
              example: 0a0c3269-b5fa-543b-b9ad-1cf27d0944c1
            name:
              type: string
              example: Maria Souza
            email:
              type: string
              example: maria.souza@exemplo.com
            document:
              type: string
              example: '35873882029'
            type:
              type: string
              enum: [individual, corporation]
              example: individual
            status:
              type: string
              enum: [registration, active, refused]
              example: active
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    PagarmeTransferSettingsInput:
      type: object
      required: [transfer_enabled]
      properties:
        transfer_enabled:
          type: boolean
          description: Liga (`true`) ou desliga (`false`) o saque automático.
          example: true
        transfer_interval:
          type: string
          description: Só `daily`, em qualquer capitalização.
          example: Daily
        transfer_day:
          type: integer
          description: Só `0`.
          example: 0

    PagarmeAnticipationSettingsInput:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: Liga (`true`) ou desliga (`false`) a antecipação automática.
          example: true
        type:
          type: string
          description: Só `full`.
          example: full
        volume_percentage:
          description: Só `100`, como número ou texto.
          oneOf:
            - type: integer
            - type: string
          example: '100'
        delay:
          type: integer
          nullable: true
          description: |
            Ausente, `null` ou igual à janela de liberação atual do recebedor.
            Não é configurável.
          example: null
        days:
          type: array
          description: Ausente ou `[]` (todo dia útil).
          items:
            type: integer
          example: []

    PagarmeRecipientSummary:
      type: object
      description: Resumo do recebedor na listagem.
      properties:
        id:
          type: string
          example: 0a0c3269-b5fa-543b-b9ad-1cf27d0944c1
        name:
          type: string
          example: Maria Souza
        email:
          type: string
          example: maria.souza@exemplo.com
        document:
          type: string
          example: '35873882029'
        type:
          type: string
          enum: [individual, corporation]
          example: individual
        status:
          type: string
          enum: [registration, active, refused]
          example: active
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        transfer_settings:
          type: object
          properties:
            transfer_enabled:
              type: boolean
            transfer_interval:
              type: string
              nullable: true
            transfer_day:
              type: integer
        default_bank_account:
          allOf:
            - $ref: '#/components/schemas/PagarmeBankAccount'
          nullable: true

    PagarmeListRecipientsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PagarmeRecipientSummary'
        paging:
          type: object
          properties:
            total:
              type: integer
              description: Total de recebedores do marketplace.
              example: 1

    Product:
      type: object
      required: [sku, name, quantity]
      properties:
        sku:
          type: string
          description: SKU do produto.
          example: '9000010'
        name:
          type: string
          description: Nome do produto.
          example: Livro de receitas
        quantity:
          type: integer
          minimum: 1
          description: Quantidade do produto.
          example: 1
        unit_value:
          type: integer
          minimum: 0
          description: |
            Valor unitário do produto em **centavos**. Obrigatório quando
            `products_value` não é informado no pedido.
          example: 12300
        type:
          type: string
          enum: [physical, digital]
          default: physical
          description: Tipo do produto.
          example: digital

    SubscriptionStatus:
      type: string
      enum: [ACTIVE, PAUSED, CANCELLED, OVERDUE, SUSPENDED, FINISHED]
      description: |
        Status da assinatura:
        - `ACTIVE` — ativa, com cobranças recorrentes em dia.
        - `PAUSED` — pausada temporariamente.
        - `CANCELLED` — cancelada (não gera novas cobranças).
        - `OVERDUE` — com cobrança em atraso.
        - `SUSPENDED` — suspensa.
        - `FINISHED` — encerrada (atingiu o número máximo de ciclos).
      example: ACTIVE

    SubscriptionTag:
      type: [string, 'null']
      description: |
        Apelido da assinatura definido pelo lojista. Quando não há apelido
        definido, a API devolve o padrão `#assinatura{id}`.
      example: Clube do Whey

    SubscriptionListProduct:
      type: object
      properties:
        name:
          type: string
          description: Nome do produto.
          example: Camiseta Preta
        price:
          type: [number, 'null']
          description: Preço unitário registrado na assinatura.
          example: 199.9
        quantity:
          type: integer
          description: Quantidade do produto cobrada a cada ciclo.
          example: 1
        shopify_product_id:
          type: [string, 'null']
          description: |
            Identificador do produto na Shopify. Vem `null` em assinaturas de
            produtos internos da Appmax.
          example: null
        variant_id:
          type: [string, 'null']
          description: |
            Identificador da variante na Shopify. Vem `null` em assinaturas de
            produtos internos da Appmax.
          example: null
        product_id:
          type: [integer, 'null']
          description: |
            Identificador do produto interno da Appmax. Vem `null` em assinaturas
            de produtos Shopify.
          example: 55
        image_url:
          type: [string, 'null']
          description: Imagem do produto (da variante na Shopify ou do cadastro interno).
          example: null
        compare_at_price:
          type: [number, 'null']
          description: Preço "de" da variante na Shopify, quando disponível.
          example: null

    SubscriptionCustomer:
      type: object
      description: Dados do cliente vinculado à assinatura.
      properties:
        name:
          type: string
          description: Nome completo do cliente.
          example: Maria Silva
        email:
          type: string
          format: email
          description: E-mail do cliente.
          example: cliente@exemplo.com
        document:
          type: [string, 'null']
          description: CPF ou CNPJ do cliente, apenas dígitos.
          example: '12345678909'
        phone:
          type: [string, 'null']
          description: Telefone do cliente (DDD + número), apenas dígitos.
          example: '11999999999'
        address:
          type: object
          description: |
            Endereço de entrega usado nas cobranças recorrentes: o endereço
            próprio da assinatura ou, quando ela ainda não tem um, o do cadastro
            do cliente. Assinatura sem endereço em nenhuma das duas origens
            devolve o bloco com todos os campos `null`, exceto `country`.
          properties:
            country:
              type: [string, 'null']
              description: País no padrão ISO 3166-1 alpha-2.
              example: BR
            street:
              type: [string, 'null']
              description: Logradouro.
              example: Rua São Bento
            number:
              type: [string, 'null']
              description: Número.
              example: '111'
            complement:
              type: [string, 'null']
              description: Complemento.
              example: Bloco 7
            district:
              type: [string, 'null']
              description: Bairro.
              example: Centro
            city:
              type: [string, 'null']
              description: Cidade.
              example: São Paulo
            state:
              type: [string, 'null']
              description: UF, sigla de 2 letras.
              example: SP
            postcode:
              type: [string, 'null']
              description: CEP, apenas dígitos.
              example: '01010000'

    SubscriptionPayment:
      type: object
      description: Meio de pagamento usado nas cobranças recorrentes.
      properties:
        payment_info:
          type: object
          description: |
            Dados do cartão tokenizado. Em assinaturas de PIX todos os campos
            vêm `null`.
          properties:
            brand:
              type: [string, 'null']
              description: |
                Bandeira do cartão, como devolvida pelo adquirente (por exemplo
                `visa`, `mastercard`, `elo`, `amex`). Não é uma lista fechada.
              example: visa
            final:
              type: [string, 'null']
              description: Últimos dígitos do cartão.
              example: '1234'
            expiration:
              type: [string, 'null']
              description: Validade do cartão no formato `MM/AAAA`.
              example: 12/2029

    SubscriptionListItem:
      type: object
      properties:
        subscription_id:
          type: integer
          description: Identificador da assinatura. Use este valor nas demais rotas.
          example: 10
        tag:
          $ref: '#/components/schemas/SubscriptionTag'
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
        products:
          type: array
          description: Produtos que compõem a assinatura.
          items:
            $ref: '#/components/schemas/SubscriptionListProduct'
        value:
          type: [number, 'null']
          description: Valor da assinatura.
          example: 199.9
        freight_value:
          type: [number, 'null']
          description: Valor do frete cobrado a cada ciclo.
          example: 19.9
        discount:
          type: [number, 'null']
          description: |
            Desconto da assinatura. Em reais quando `discount_type` é `nominal`,
            ou o percentual quando é `percent`. `null` quando a assinatura nunca
            teve desconto próprio definido.
          example: 10
        discount_type:
          type: [string, 'null']
          enum: [nominal, percent, null]
          description: |
            Como o `discount` é interpretado. `nominal` é um valor fixo em reais;
            `percent` incide sobre o valor dos produtos e é recalculado a cada
            cobrança.
          example: percent
        interval:
          type: [string, 'null']
          enum: [week, month, year, null]
          description: |
            Unidade da periodicidade:
            - `week` — semanas.
            - `month` — meses.
            - `year` — anos.

            Combine com `interval_count` para obter a cadência (por exemplo
            `month` + `2` = a cada dois meses).
          example: month
        interval_count:
          type: [integer, 'null']
          description: Quantidade de unidades entre cobranças.
          example: 1
        current_cycle:
          type: [integer, 'null']
          description: Ciclo em andamento (`completed_cycles` + 1).
          example: 3
        customer:
          oneOf:
            - $ref: '#/components/schemas/SubscriptionCustomer'
            - type: 'null'
        payment:
          allOf:
            - $ref: '#/components/schemas/SubscriptionPayment'
          description: |
            Na listagem, `payment_info.expiration` vem sempre `null` — a validade do
            cartão só é retornada no detalhe da assinatura.
        charges:
          type: array
          description: Histórico de cobranças.
          items:
            $ref: '#/components/schemas/SubscriptionCharge'
        skipped_cycles:
          type: array
          description: |
            Índices dos ciclos futuros marcados para pular. Vazio quando não há
            nenhum. Use o índice aqui para
            [desfazer o skip](/api-reference/subscriptions/desfazer-skip-ciclo).
          items:
            type: integer
          example: [3]
        cycle_changes:
          type: array
          description: |
            Ciclos cuja composição de produtos difere da composição permanente da
            assinatura, por conta de
            [alterações feitas naquele ciclo](/api-reference/subscriptions/adicionar-produtos-ciclo).
            Vazio quando nenhum ciclo foi alterado.

            É o estado atual, não um histórico: desfazer a alteração remove o ciclo
            desta lista.
          items:
            $ref: '#/components/schemas/SubscriptionCycleChange'
        original_order_id:
          type: [integer, 'null']
          description: |
            Pedido que deu origem à assinatura — a venda a partir da qual ela foi criada.
            Vem `null` quando a assinatura ainda não tem nenhuma cobrança com pedido
            associado.
          example: 126509440
        original_shopify_order_id:
          type: [string, 'null']
          description: |
            Mesmo pedido de origem, identificado na Shopify. Vem `null` quando a venda
            que originou a assinatura não veio de uma loja Shopify.
          example: '7217346216132'
        next_charge_at:
          type: [string, 'null']
          description: |
            Data da próxima cobrança, no formato `dd/mm/aaaa`. Já desconta os
            ciclos pulados — é sempre a data em que a cobrança vai de fato
            acontecer. Veja `skipped_cycles`.
          example: 15/08/2026
        created_at:
          type: [string, 'null']
          description: |
            Data/hora de criação da assinatura, no formato `aaaa-mm-dd hh:mm:ss` —
            o mesmo formato devolvido no detalhe.
          example: '2026-06-15 10:00:00'

    ListSubscriptionsResponse:
      type: object
      properties:
        data:
          type: object
          description: Envelope de dados da listagem.
          properties:
            subscriptions:
              type: array
              description: Assinaturas da página retornada.
              items:
                $ref: '#/components/schemas/SubscriptionListItem'
            pagination:
              type: object
              description: Dados de paginação da listagem.
              properties:
                total:
                  type: integer
                  description: Total de assinaturas encontradas para o e-mail informado.
                  example: 1
                per_page:
                  type: integer
                  description: Itens por página. Fixo em 10.
                  example: 10
                current_page:
                  type: integer
                  description: Página retornada.
                  example: 1
                last_page:
                  type: integer
                  description: Última página disponível.
                  example: 1

    CreateSubscriptionRequest:
      type: object
      required: [order_id]
      properties:
        order_id:
          type: integer
          minimum: 1
          description: Identificador do pedido de origem, que será transformado em assinatura.
          example: 12345
        interval:
          type: string
          enum: [week, month, year]
          default: month
          description: |
            Unidade da periodicidade (semanas, meses ou anos). Combine com
            `interval_count` para obter a cadência — `month` + `2` = a cada dois meses.
          example: month
        interval_count:
          type: integer
          minimum: 1
          default: 1
          description: Quantidade de intervalos entre cobranças.
          example: 1
        max_cycles:
          type: integer
          minimum: 1
          description: Número máximo de ciclos. Sem valor = ilimitado.
          example: 12
        next_charge_at:
          type: string
          format: date
          description: Data da próxima cobrança.
          example: '2026-08-15'
        fail_max_tries:
          type: integer
          minimum: 1
          default: 3
          description: Tentativas em caso de falha na cobrança.
          example: 3
        fail_interval_hours:
          type: integer
          minimum: 1
          default: 24
          description: Horas entre tentativas de cobrança.
          example: 24
        products:
          type: array
          description: |
            Produtos que compõem a assinatura. Informe **ou** `product_id` (produto
            interno da Appmax) **ou** o par `shopify_product_id` +
            `shopify_variant_id` (produto da Shopify).

            Obrigatório quando o pedido veio de um checkout Shopify — nesse caso
            só a forma Shopify é aceita.
          items:
            type: object
            properties:
              product_id:
                type: integer
                minimum: 1
                description: Identificador do produto interno da Appmax.
                example: 55
              shopify_product_id:
                type: string
                description: Identificador do produto na Shopify. Exigido junto de `shopify_variant_id`.
                example: '8888888'
              shopify_variant_id:
                type: string
                description: |
                  Identificador da variante na Shopify. O preço é lido da variante,
                  não do payload.
                example: '7777777'
              quantity:
                type: integer
                minimum: 1
                default: 1
                description: Quantidade do produto cobrada a cada ciclo.
                example: 1
        freight_value:
          type: number
          minimum: 0
          description: Valor do frete.
          example: 19.9
        discount:
          type: number
          minimum: 0
          description: |
            Desconto da assinatura. Em reais quando `discount_type` é `nominal`,
            ou o percentual (0 a 100) quando é `percent`. Omitido, a assinatura
            nasce sem desconto — o cupom do pedido de origem não é herdado.
          example: 10.0
        discount_type:
          type: string
          enum: [nominal, percent]
          default: nominal
          description: |
            Como o `discount` é interpretado. `nominal` é um valor fixo em reais;
            `percent` incide sobre o valor dos produtos e é recalculado a cada
            cobrança, acompanhando mudanças na composição da assinatura.
          example: percent

    CreateSubscriptionResponse:
      type: object
      description: |
        A criação devolve a assinatura recém-criada. Diferente dos demais
        endpoints, aqui o identificador vem em `id` e o `status` usa a forma
        interna em minúsculas (`active`, `canceled`, `overdue`, `suspended`,
        `finished`). Para o formato normalizado, consulte a assinatura pelo
        endpoint de detalhe.
      properties:
        data:
          type: object
          description: Assinatura criada.
          properties:
            id:
              type: integer
              description: Identificador da assinatura.
              example: 10
            uuid:
              type: string
              format: uuid
              description: |
                Identificador público da assinatura, usado na URL do painel do
                assinante (`panel_url`).
              example: 6f1c0f1e-6a1c-4a2b-9f0e-3d5c7a9b1234
            status:
              type: string
              enum: [active, canceled, overdue, suspended, finished]
              description: |
                Status interno da assinatura, em minúsculas:
                - `active` — ativa.
                - `canceled` — cancelada.
                - `overdue` — com cobrança em atraso.
                - `suspended` — suspensa.
                - `finished` — encerrada (atingiu `max_cycles`).

                Não inclui `paused`: uma assinatura pausada continua `active` aqui.
                O status normalizado (com `PAUSED`) vem no detalhe e na listagem.
              example: active
            subscription_status_id:
              type: integer
              enum: [1, 2, 3, 4, 5]
              description: |
                Identificador numérico do status, equivalente a `status`:
                - `1` — `active`
                - `2` — `canceled`
                - `3` — `overdue`
                - `4` — `suspended`
                - `5` — `finished`
              example: 1
            interval:
              type: string
              enum: [week, month, year]
              description: |
                Unidade da periodicidade:
                - `week` — semanas.
                - `month` — meses.
                - `year` — anos.
              example: month
            interval_count:
              type: integer
              description: Quantidade de unidades entre cobranças.
              example: 1
            interval_name:
              type: string
              description: |
                Nome da cadência em português, derivado de `interval` +
                `interval_count`. Não é uma lista fechada: combinações usuais
                devolvem `Semanal`, `Quinzenal`, `Mensal`, `Bimestral`,
                `Trimestral`, `Semestral` ou `Anual`; as demais caem em um rótulo
                genérico como `Mensal a cada 4 mês(es)`.
              example: Mensal
            charge_day:
              type: [integer, 'null']
              description: |
                Dia fixo de cobrança (1 a 31), quando definido. Vem `null` quando a
                assinatura segue a data de criação em vez de um dia fixo. Em dias 29 a
                31, os meses mais curtos cobram no último dia.
              example: 15
            fail_max_tries:
              type: [integer, 'null']
              description: Tentativas de cobrança antes de a assinatura sair de `active`.
              example: 3
            fail_interval_hours:
              type: [integer, 'null']
              description: Horas de espera entre tentativas de cobrança.
              example: 24
            max_cycles:
              type: [integer, 'null']
              description: Número máximo de ciclos (`null` = ilimitado).
              example: 12
            completed_cycles:
              type: [integer, 'null']
              description: Ciclos já cobrados. Começa em `0` na criação.
              example: 0
            current_cycle:
              type: [integer, 'null']
              description: Ciclo em andamento (`completed_cycles` + 1).
              example: 1
            next_charge_at:
              type: [string, 'null']
              description: |
                Data/hora da próxima cobrança, no formato `aaaa-mm-dd hh:mm:ss`.
              example: '2026-08-15 00:00:00'
            original_order_id:
              type: [integer, 'null']
              description: |
                Pedido que deu origem à assinatura — a venda a partir da qual ela foi
                criada.
              example: 126509440
            original_shopify_order_id:
              type: [string, 'null']
              description: |
                Mesmo pedido de origem, identificado na Shopify. Vem `null` quando a
                venda não veio de uma loja Shopify.
              example: '7217346216132'
            created_at:
              type: [string, 'null']
              description: |
                Data/hora de criação da assinatura, no formato `aaaa-mm-dd hh:mm:ss`.
              example: '2026-07-15 10:00:00'
            freight_value:
              type: [number, 'null']
              description: Valor do frete cobrado a cada ciclo.
              example: 19.9
            discount:
              type: [number, 'null']
              description: |
                Desconto da assinatura. Em reais quando `discount_type` é `nominal`,
                ou o percentual quando é `percent`. `null` quando a assinatura nunca
                teve desconto próprio definido.
              example: 10
            discount_type:
              type: [string, 'null']
              enum: [nominal, percent, null]
              description: |
                Como o `discount` é interpretado. `nominal` é um valor fixo em reais;
                `percent` incide sobre o valor dos produtos e é recalculado a cada
                cobrança.
              example: percent
            products:
              type: array
              description: Produtos que compõem a assinatura.
              items:
                $ref: '#/components/schemas/SubscriptionDetailProduct'
            customer:
              oneOf:
                - $ref: '#/components/schemas/SubscriptionCustomer'
                - type: 'null'
            payment:
              $ref: '#/components/schemas/SubscriptionPayment'
            charges:
              type: array
              description: |
                Cobranças da assinatura. Na criação traz apenas a cobrança de
                origem, com `cycle` igual a `0`.
              items:
                $ref: '#/components/schemas/SubscriptionCharge'
            panel_url:
              type: string
              format: uri
              description: URL do painel do assinante.
              example: https://assinaturas.appmax.com.br/painel/6f1c0f1e-6a1c-4a2b-9f0e-3d5c7a9b1234

    SubscriptionDetailProduct:
      type: object
      properties:
        name:
          type: string
          description: Nome do produto.
          example: Camiseta Preta
        shopify_product_id:
          type: [string, 'null']
          description: |
            Identificador do produto na Shopify. Vem `null` em assinaturas de
            produtos internos da Appmax.
          example: null
        variant_id:
          type: [string, 'null']
          description: |
            Identificador da variante na Shopify. Vem `null` em assinaturas de
            produtos internos da Appmax.
          example: null
        product_id:
          type: [integer, 'null']
          description: |
            Identificador do produto interno da Appmax. Vem `null` em assinaturas
            de produtos Shopify.
          example: 55
        sku:
          type: [string, 'null']
          description: SKU do produto.
          example: SKU-1
        quantity:
          type: [integer, 'null']
          description: Quantidade do produto cobrada a cada ciclo.
          example: 1
        price:
          type: [number, 'null']
          description: Preço unitário registrado na assinatura.
          example: 199.9
        image_url:
          type: [string, 'null']
          description: Imagem do produto (da variante na Shopify ou do cadastro interno).
          example: null
        compare_at_price:
          type: [number, 'null']
          description: Preço "de" da variante na Shopify, quando disponível.
          example: null

    SubscriptionCharge:
      type: object
      properties:
        cycle:
          type: integer
          description: |
            Ciclo de renovação a que a cobrança corresponde, começando em `1`. A
            cobrança de origem (o pedido que deu início à assinatura) não entra
            nesta lista — use `last_charge_at` para a data do pagamento inicial.
          example: 1
        order_id:
          type: [integer, 'null']
          description: Pedido gerado pela cobrança na Appmax.
          example: 12345
        shopify_order_id:
          type: [string, 'null']
          description: |
            Pedido correspondente na Shopify, quando houver. Vem `null` enquanto o
            pedido ainda não foi criado na loja.
          example: '6868591542526'
        charged_at:
          type: [string, 'null']
          description: Data da cobrança, no formato `dd/mm/aaaa`.
          example: 15/07/2026
        value:
          type: [number, 'null']
          description: Valor cobrado no ciclo, já com frete e desconto aplicados.
          example: 199.9
        status:
          type: [string, 'null']
          enum: [paid, waiting, overdue, canceled, null]
          description: |
            Status da cobrança:
            - `paid` — paga.
            - `waiting` — aguardando pagamento.
            - `overdue` — em atraso (falhou e ainda há tentativas).
            - `canceled` — cancelada.
          example: paid

    SubscriptionDetail:
      type: object
      properties:
        subscription_id:
          type: integer
          description: Identificador da assinatura.
          example: 10
        tag:
          $ref: '#/components/schemas/SubscriptionTag'
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
        products:
          type: array
          description: Produtos que compõem a assinatura.
          items:
            $ref: '#/components/schemas/SubscriptionDetailProduct'
        value:
          type: [number, 'null']
          description: Valor da assinatura.
          example: 199.9
        freight_value:
          type: [number, 'null']
          description: Valor do frete cobrado a cada ciclo.
          example: 19.9
        discount:
          type: [number, 'null']
          description: |
            Desconto da assinatura. Em reais quando `discount_type` é `nominal`,
            ou o percentual quando é `percent`. `null` quando a assinatura nunca
            teve desconto próprio definido.
          example: 10
        discount_type:
          type: [string, 'null']
          enum: [nominal, percent, null]
          description: |
            Como o `discount` é interpretado. `nominal` é um valor fixo em reais;
            `percent` incide sobre o valor dos produtos e é recalculado a cada
            cobrança.
          example: percent
        interval:
          type: [string, 'null']
          enum: [week, month, year, null]
          description: |
            Unidade da periodicidade:
            - `week` — semanas.
            - `month` — meses.
            - `year` — anos.

            Combine com `interval_count` para obter a cadência (por exemplo
            `month` + `2` = a cada dois meses).
          example: month
        interval_count:
          type: [integer, 'null']
          description: Quantidade de unidades entre cobranças.
          example: 1
        current_cycle:
          type: [integer, 'null']
          description: Ciclo em andamento (`completed_cycles` + 1).
          example: 3
        completed_cycles:
          type: [integer, 'null']
          description: Ciclos já cobrados.
          example: 2
        customer:
          oneOf:
            - $ref: '#/components/schemas/SubscriptionCustomer'
            - type: 'null'
        payment:
          $ref: '#/components/schemas/SubscriptionPayment'
        max_cycles:
          type: [integer, 'null']
          description: Número máximo de ciclos (`null` = ilimitado).
          example: 12
        skipped_cycles:
          type: array
          description: |
            Índices dos ciclos futuros marcados para pular. Vazio quando não há
            nenhum. Use o índice aqui para
            [desfazer o skip](/api-reference/subscriptions/desfazer-skip-ciclo).
          items:
            type: integer
          example: [3]
        cycle_changes:
          type: array
          description: |
            Ciclos cuja composição de produtos difere da composição permanente da
            assinatura, por conta de
            [alterações feitas naquele ciclo](/api-reference/subscriptions/adicionar-produtos-ciclo).
            Vazio quando nenhum ciclo foi alterado.

            É o estado atual, não um histórico: desfazer a alteração remove o ciclo
            desta lista.
          items:
            $ref: '#/components/schemas/SubscriptionCycleChange'
        original_order_id:
          type: [integer, 'null']
          description: |
            Pedido que deu origem à assinatura — a venda a partir da qual ela foi criada.
            Vem `null` quando a assinatura ainda não tem nenhuma cobrança com pedido
            associado.
          example: 126509440
        original_shopify_order_id:
          type: [string, 'null']
          description: |
            Mesmo pedido de origem, identificado na Shopify. Vem `null` quando a venda
            que originou a assinatura não veio de uma loja Shopify.
          example: '7217346216132'
        next_charge_at:
          type: [string, 'null']
          description: |
            Data/hora da próxima cobrança, no formato `aaaa-mm-dd hh:mm:ss`. Já
            desconta os ciclos pulados — é sempre a data em que a cobrança vai
            de fato acontecer. Vem `null` quando não há próxima cobrança.
          example: '2026-08-15 00:00:00'
        last_charge_at:
          type: [string, 'null']
          description: Data da última cobrança, no formato `dd/mm/aaaa`.
          example: 15/07/2026
        charges:
          type: array
          description: Histórico de cobranças.
          items:
            $ref: '#/components/schemas/SubscriptionCharge'
        created_at:
          type: [string, 'null']
          description: |
            Data/hora de criação da assinatura, no formato `aaaa-mm-dd hh:mm:ss`.
          example: '2026-06-15 10:00:00'
        canceled_at:
          type: [string, 'null']
          description: |
            Data/hora do cancelamento, no formato `aaaa-mm-dd hh:mm:ss`. Vem `null`
            quando a assinatura não foi cancelada.
          example: null
        paused_from:
          type: [string, 'null']
          description: |
            Data/hora em que a pausa começou, no formato `aaaa-mm-dd hh:mm:ss`. Vem
            `null` quando a assinatura nunca foi pausada.
          example: null
        paused_until:
          type: [string, 'null']
          description: |
            Data/hora em que a pausa termina, no formato `aaaa-mm-dd hh:mm:ss`. Vem
            `null` em pausa por prazo indeterminado ou quando não há pausa.
          example: null
        pause_reason:
          type: [string, 'null']
          description: |
            Motivo informado na última pausa da assinatura. Permanece preenchido
            depois de reativar — serve como histórico, não como estado atual.
          example: Cliente vai viajar
        cancel_reason:
          type: [string, 'null']
          description: Motivo informado no cancelamento da assinatura.
          example: Achou caro

    SubscriptionDetailResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/SubscriptionDetail'

    UpdateSubscriptionFrequencyRequest:
      type: object
      required: [interval, interval_count]
      properties:
        interval:
          type: string
          enum: [week, month, year]
          description: |
            Nova unidade da periodicidade (semanas, meses ou anos). Combine com
            `interval_count` para obter a cadência — `month` + `2` = a cada dois meses.
          example: month
        interval_count:
          type: integer
          minimum: 1
          description: Quantidade de intervalos entre cobranças.
          example: 2

    AddSubscriptionCycleProductsRequest:
      allOf:
        - $ref: '#/components/schemas/AddSubscriptionProductsRequest'
        - type: object
          properties:
            cycle_index:
              type: integer
              minimum: 1
              description: |
                Ciclo que recebe os produtos. Omitido, vale o próximo ciclo da
                assinatura (`completed_cycles + 1`).
              example: 3
    UpdateSubscriptionCycleProductQuantityRequest:
      type: object
      required: [quantity]
      properties:
        cycle_index:
          type: integer
          minimum: 1
          description: |
            Ciclo a alterar. Omitido, vale o próximo ciclo da assinatura
            (`completed_cycles + 1`).
          example: 3
        quantity:
          type: integer
          minimum: 1
          description: Nova quantidade do produto naquele ciclo.
          example: 3
    SubscriptionCycleProductsResponse:
      type: object
      properties:
        data:
          type: object
          description: Composição do ciclo depois da alteração.
          properties:
            cycle_index:
              type: integer
              description: Ciclo alterado. Quando o ciclo não é informado, vem o próximo ciclo.
              example: 3
            products:
              type: array
              description: |
                Todos os produtos que aquele ciclo vai cobrar: os da assinatura
                mais os adicionados ao ciclo.
              items:
                type: object
                properties:
                  name:
                    type: string
                    example: Produto A
                  price:
                    type: number
                    format: float
                    example: 100
                  quantity:
                    type: integer
                    example: 1
                  variant_id:
                    type: string
                    description: Variante na Shopify. Ausente em assinaturas de produtos internos.
                    example: '456'
                  shopify_product_id:
                    type: string
                    description: Produto na Shopify. Ausente em assinaturas de produtos internos.
                    example: '123'
                  product_id:
                    type: integer
                    description: Produto interno da Appmax. Ausente em assinaturas da Shopify.
                    example: 55
                  sku:
                    type: [string, 'null']
                    example: SKU-A
            added_products:
              type: array
              description: |
                Produtos adicionados àquele ciclo. Vem vazio quando nada foi
                adicionado.
              items:
                type: object
                properties:
                  shopify_product_id:
                    type: string
                    example: '789'
                  variant_id:
                    type: string
                    example: '987'
                  product_id:
                    type: [integer, 'null']
                    description: |
                      Produto interno da Appmax. Em assinaturas da Shopify vem o
                      produto que a Appmax mantém para aquela variante.
                    example: 55
                  name:
                    type: string
                    example: Caneca
                  sku:
                    type: [string, 'null']
                    example: CAN-1
                  quantity:
                    type: integer
                    example: 1
                  price:
                    type: number
                    format: float
                    example: 30
            removed_products:
              type: array
              description: |
                Produtos da assinatura que **não** serão cobrados nem entregues
                naquele ciclo.
              items:
                type: object
                properties:
                  shopify_product_id:
                    type: string
                    example: '789'
                  variant_id:
                    type: string
                    example: '654'
                  product_id:
                    type: [integer, 'null']
                    description: |
                      Produto interno da Appmax. Em assinaturas da Shopify vem o
                      produto que a Appmax mantém para aquela variante.
                    example: 56
                  name:
                    type: string
                    example: Produto A
                  sku:
                    type: [string, 'null']
                    example: SKU-A
                  quantity:
                    type: integer
                    example: 1
                  price:
                    type: number
                    format: float
                    example: 40
            quantity_changes:
              type: array
              description: |
                Produtos cuja quantidade foi alterada só naquele ciclo.
              items:
                type: object
                properties:
                  reference:
                    type: string
                    description: |
                      `shopify_variant_id` em assinaturas da Shopify,
                      `product_id` nas de produtos internos.
                    example: '55'
                  quantity:
                    type: integer
                    description: Quantidade que passa a valer naquele ciclo.
                    example: 3
                  previous_quantity:
                    type: [integer, 'null']
                    description: |
                      Quantidade da composição permanente, para comparação. Vem
                      `null` quando o produto não está mais na composição atual.
                    example: 1
                  name:
                    type: [string, 'null']
                    example: Produto A
                  sku:
                    type: [string, 'null']
                    example: SKU-A
                  variant_id:
                    type: string
                    description: Variante na Shopify. Presente em assinaturas Shopify.
                    example: '654'
                  shopify_product_id:
                    type: [string, 'null']
                    description: Produto na Shopify. Presente em assinaturas Shopify.
                    example: '789'
                  product_id:
                    type: [integer, 'null']
                    description: |
                      Produto interno da Appmax. Em assinaturas da Shopify vem o
                      produto que a Appmax mantém para aquela variante.
                    example: 55
            value:
              type: [number, 'null']
              format: float
              description: Valor que aquele ciclo vai cobrar, já com as alterações aplicadas.
              example: 130
    SubscriptionCycleResponse:
      type: object
      description: Endereço de entrega da assinatura, já normalizado.
      properties:
        data:
          type: object
          description: Resultado da operação sobre o ciclo.
          properties:
            cycle_index:
              type: integer
              description: Ciclo afetado.
              example: 3
            status:
              type: string
              enum: [skipped, unbilled]
              description: |
                Situação do ciclo após a operação:
                - `skipped` — ciclo será pulado.
                - `unbilled` — ciclo voltou à fila de cobrança.
              example: skipped
            next_charge_at:
              type: [string, 'null']
              description: |
                Data da próxima cobrança que efetivamente será feita, já
                descontando os ciclos pulados. É o mesmo valor devolvido no
                detalhe e na listagem da assinatura. Vem `null` quando o ciclo
                pulado era o último (`max_cycles`) e a assinatura será encerrada.
              example: '2026-10-15 00:00:00'

    PauseSubscriptionRequest:
      type: object
      description: Todos os campos são opcionais.
      properties:
        paused_until:
          type: string
          format: date
          description: |
            Data até a qual a assinatura fica pausada. Sem valor, a pausa é por
            prazo indeterminado.
          example: '2026-09-01'
        reason:
          type: string
          maxLength: 1000
          description: Motivo da pausa.
          example: Cliente solicitou pausa temporária

    CancelSubscriptionRequest:
      type: object
      description: Todos os campos são opcionais.
      properties:
        reason:
          type: string
          maxLength: 1000
          description: Motivo do cancelamento.
          example: Cliente não deseja mais o produto

    UpdateChargeDayRequest:
      type: object
      required: [charge_day]
      properties:
        charge_day:
          type: integer
          minimum: 1
          maximum: 31
          description: |
            Dia fixo de cobrança (1 a 31).
            Dias 29, 30 e 31 são aceitos: nos meses que não têm o dia escolhido a
            cobrança cai no último dia do mês, e o dia volta a valer no mês seguinte
            que o tiver. Uma assinatura no dia 31 cobra 31/01, 28/02, 31/03, 30/04.
          example: 15

    UpdateChargeDayResponse:
      type: object
      properties:
        data:
          type: object
          description: Resultado da alteração do dia de cobrança.
          properties:
            charge_day:
              type: integer
              description: Dia fixo de cobrança aplicado (1 a 31).
              example: 15
            next_charge_at:
              type: [string, 'null']
              description: Próxima data de cobrança recalculada.
              example: '2026-08-15 00:00:00'
            adjusted:
              type: boolean
              description: |
                `true` quando a data entregue não é a que o dia escolhido produziria
                (dia já passado no mês, ou data que ficaria colada na cobrança anterior).
              example: false
            adjusted_reason:
              type: [string, 'null']
              description: |
                Código do ajuste. `day_already_passed` quando o dia escolhido já passou
                neste mês; `too_close_to_last_charge` quando a data ficaria a menos de
                meio ciclo da última cobrança. `null` quando não houve ajuste.
              enum: [day_already_passed, too_close_to_last_charge, null]
              example: null
            adjusted_message:
              type: [string, 'null']
              description: Explicação do ajuste, pronta para exibição. `null` quando não houve ajuste.
              example: null

    SubscriptionCycleChange:
      type: object
      description: O que um ciclo específico tem de diferente da composição permanente.
      properties:
        cycle_index:
          type: integer
          description: Índice do ciclo, contado a partir de 1.
          example: 3
        status:
          type: string
          description: |
            Situação do ciclo: `PROCESSED` já foi cobrado, `UNBILLED` ainda vai ser.
          enum: [PROCESSED, UNBILLED]
          example: UNBILLED
        added:
          type: array
          description: Produtos adicionados só neste ciclo.
          items:
            $ref: '#/components/schemas/SubscriptionCycleProduct'
        removed:
          type: array
          description: Produtos da composição permanente que não entram neste ciclo.
          items:
            $ref: '#/components/schemas/SubscriptionCycleProduct'
        quantity_changes:
          type: array
          description: Produtos cuja quantidade foi alterada só neste ciclo.
          items:
            $ref: '#/components/schemas/SubscriptionCycleQuantityChange'

    SubscriptionCycleProduct:
      type: object
      properties:
        name:
          type: [string, 'null']
          example: Caneca Appmax
        sku:
          type: [string, 'null']
          example: CAN-1
        quantity:
          type: integer
          example: 1
        price:
          type: number
          description: Preço unitário.
          example: 30
        variant_id:
          type: string
          description: Variante na Shopify. Presente em assinaturas Shopify.
          example: '48304785031422'
        shopify_product_id:
          type: string
          description: Produto na Shopify. Presente em assinaturas Shopify.
          example: '9260400836862'
        product_id:
          type: [integer, 'null']
          description: |
            Produto interno da Appmax. Em assinaturas da Shopify vem o produto que
            a Appmax mantém para aquela variante.
          example: 42
        image_url:
          type: [string, 'null']
          description: Imagem do produto (da variante na Shopify ou do cadastro interno).
          example: null
        compare_at_price:
          type: [number, 'null']
          description: Preço "de" da variante na Shopify, quando disponível.
          example: null

    SubscriptionCycleQuantityChange:
      type: object
      properties:
        reference:
          type: string
          description: |
            Identificador do produto alterado: a variante na Shopify, ou o id do
            produto da Appmax em assinaturas criadas por API.
          example: '48304785031422'
        quantity:
          type: integer
          description: Quantidade que vale neste ciclo.
          example: 3
        previous_quantity:
          type: [integer, 'null']
          description: |
            Quantidade da composição permanente. Vem `null` quando o produto não
            está mais na composição atual.
          example: 2
        name:
          type: [string, 'null']
          example: Caneca Appmax
        sku:
          type: [string, 'null']
          example: CAN-1
        variant_id:
          type: string
          description: Variante na Shopify. Presente em assinaturas Shopify.
          example: '48304785031422'
        shopify_product_id:
          type: [string, 'null']
          description: Produto na Shopify. Presente em assinaturas Shopify.
          example: '9260400836862'
        product_id:
          type: [integer, 'null']
          description: |
            Produto interno da Appmax. Em assinaturas da Shopify vem o produto que
            a Appmax mantém para aquela variante.
          example: 42
        image_url:
          type: [string, 'null']
          description: Imagem do produto (da variante na Shopify ou do cadastro interno).
          example: null
        compare_at_price:
          type: [number, 'null']
          description: Preço "de" da variante na Shopify, quando disponível.
          example: null

    ForceChargeResponse:
      type: object
      properties:
        data:
          type: object
          description: Resultado da cobrança antecipada.
          properties:
            charge_id:
              type: integer
              description: Identificador da cobrança gerada.
              example: 41287
            order_id:
              type: [integer, 'null']
              description: Pedido gerado para o ciclo antecipado.
              example: 126509440
            cycle_index:
              type: integer
              description: Ciclo cobrado, contado a partir de 1.
              example: 7
            value:
              type: [number, 'null']
              description: Valor cobrado.
              example: 189.9
            currency:
              type: [string, 'null']
              description: Moeda da cobrança.
              example: BRL
            status:
              type: string
              description: Status da assinatura após a cobrança.
              example: active
            next_charge_at:
              type: [string, 'null']
              description: Próxima data de cobrança já considerando o ciclo consumido.
              example: '2026-10-20 00:00:00'

    SubscriptionAddress:
      type: object
      required: [postcode, street, number, district, city, state]
      properties:
        country:
          type: string
          minLength: 2
          maxLength: 2
          description: |
            País no padrão ISO 3166-1 alpha-2. Opcional — na ausência do campo,
            o endereço é tratado como brasileiro (`BR`).
          example: BR
        postcode:
          type: string
          maxLength: 20
          description: CEP. A pontuação enviada é removida na gravação.
          example: 01010-000
        street:
          type: string
          maxLength: 255
          description: Logradouro.
          example: Rua São Bento
        number:
          type: string
          maxLength: 56
          description: Número.
          example: '111'
        complement:
          type: string
          maxLength: 255
          description: Complemento.
          example: Bloco 7
        district:
          type: string
          maxLength: 255
          description: Bairro.
          example: Centro
        city:
          type: string
          maxLength: 255
          description: Cidade.
          example: São Paulo
        state:
          type: string
          maxLength: 255
          description: |
            Em endereço brasileiro, a UF com 2 letras (gravada em maiúsculas).
            Em endereço de outro país, o nome da região, com até 255 caracteres.
          example: SP

    SetCycleDiscountRequest:
      type: object
      required: [discount]
      properties:
        cycle_index:
          type: integer
          minimum: 1
          description: |
            Ciclo que recebe o desconto. Omitido, vale para o próximo ciclo da
            assinatura.
          example: 4
        discount:
          type: number
          minimum: 0
          description: |
            Valor do desconto do ciclo. Em reais quando `discount_type` é `nominal`,
            ou o percentual (0 a 100) quando é `percent`.
          example: 15
        discount_type:
          type: string
          enum: [nominal, percent]
          default: nominal
          description: |
            Como o `discount` é interpretado. No percentual, incide sobre os produtos
            daquele ciclo.
          example: percent

    CycleDiscountResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            cycle_index:
              type: integer
              description: Ciclo afetado.
              example: 4
            discount:
              type: [number, 'null']
              description: |
                Desconto do ciclo. `null` quando o ciclo não tem desconto próprio e
                segue o desconto da assinatura.
              example: 15
            discount_type:
              type: [string, 'null']
              enum: [nominal, percent, null]
              description: Como o `discount` do ciclo é interpretado.
              example: percent

    UpdateSubscriptionDiscountRequest:
      type: object
      required: [discount]
      properties:
        discount:
          type: number
          minimum: 0
          description: |
            Valor do desconto. Em reais quando `discount_type` é `nominal`, ou o
            percentual (0 a 100) quando é `percent`. Envie `0` para remover o
            desconto.
          example: 10
        discount_type:
          type: string
          enum: [nominal, percent]
          default: nominal
          description: |
            Como o `discount` é interpretado. `nominal` é um valor fixo em reais;
            `percent` incide sobre o valor dos produtos e é recalculado a cada
            cobrança.
          example: percent

    UpdateSubscriptionTagRequest:
      type: object
      required: [tag]
      properties:
        tag:
          type: [string, 'null']
          maxLength: 255
          description: |
            Apelido da assinatura. Vazio ou `null` remove o apelido e faz a API
            voltar a devolver o padrão `#assinatura{id}`.
          example: Clube do Whey

    UpdateSubscriptionPaymentMethodRequest:
      type: object
      required: [payment_data]
      properties:
        payment_data:
          type: object
          required: [token]
          properties:
            token:
              type: string
              minLength: 32
              maxLength: 32
              description: |
                Token do cartão, com 32 caracteres, devolvido pelo
                [Appmax JS](/guides/appmax-js) no navegador do assinante.
                Não envie dados de cartão neste endpoint.
              example: add5cac283934dd887c0c51360bf6822

    SubscriptionAddressRequest:
      type: object
      required: [address]
      properties:
        address:
          $ref: '#/components/schemas/SubscriptionAddress'

    SubscriptionAddressResource:
      type: object
      properties:
        country:
          type: [string, 'null']
          description: País no padrão ISO 3166-1 alpha-2.
          example: BR
        state:
          type: [string, 'null']
          description: |
            UF em maiúsculas nos endereços brasileiros; nome da região nos
            demais países.
          example: SP
        city:
          type: [string, 'null']
          description: Cidade.
          example: São Paulo
        district:
          type: [string, 'null']
          description: Bairro.
          example: Centro
        street:
          type: [string, 'null']
          description: Logradouro.
          example: Rua São Bento
        number:
          type: [string, 'null']
          description: Número.
          example: '111'
        complement:
          type: [string, 'null']
          description: Complemento.
          example: Bloco 7
        postcode:
          type: [string, 'null']
          description: CEP, sem pontuação.
          example: '01010000'

    SubscriptionAddressResponse:
      type: object
      properties:
        data:
          type: object
          description: Resultado da gravação do endereço.
          properties:
            address:
              $ref: '#/components/schemas/SubscriptionAddressResource'

    GetSubscriptionAddressResponse:
      type: object
      properties:
        data:
          type: object
          description: Endereço em vigor na assinatura.
          properties:
            address:
              description: |
                Endereço próprio da assinatura ou, na falta dele, o do cadastro
                do cliente. Vem `null` quando nenhuma das duas origens tem
                endereço utilizável.
              oneOf:
                - $ref: '#/components/schemas/SubscriptionAddressResource'
                - type: 'null'

    SubscriptionAvailableShopifyProduct:
      type: object
      description: Item retornado para assinaturas de produtos Shopify.
      properties:
        shopify_product_id:
          type: string
          description: Identificador do produto na Shopify.
          example: '123'
        title:
          type: string
          description: Nome do produto na Shopify.
          example: Camiseta Branca
        variants:
          type: array
          description: Variantes compatíveis com a periodicidade da assinatura.
          items:
            type: object
            properties:
              shopify_variant_id:
                type: string
                description: Use este valor no corpo de "Adicionar produtos".
                example: '456'
              title:
                type: string
                description: Nome da variante na Shopify.
                example: Mensal
              price:
                type: [string, 'null']
                description: Preço da variante na Shopify, devolvido como texto.
                example: '189.90'
              sku:
                type: [string, 'null']
                description: SKU da variante.
                example: SKU-2
              interval:
                type: string
                enum: [week, month, year]
                description: |
                  Unidade da periodicidade da variante:
                  - `week` — semanas.
                  - `month` — meses.
                  - `year` — anos.
                example: month
              interval_count:
                type: integer
                description: Quantidade de unidades entre cobranças.
                example: 1

    SubscriptionAvailableInternalProduct:
      type: object
      description: Item retornado para assinaturas de produtos internos da Appmax.
      properties:
        product_id:
          type: integer
          description: Use este valor no corpo de "Adicionar produtos".
          example: 55
        name:
          type: string
          description: Nome do produto.
          example: Camiseta Branca
        price:
          type: [number, 'null']
          description: Preço cadastrado do produto.
          example: 189.9
        sku:
          type: [string, 'null']
          description: SKU do produto.
          example: SKU-2

    SubscriptionAvailableProductsResponse:
      type: object
      properties:
        data:
          type: object
          description: Envelope de dados dos produtos disponíveis.
          properties:
            products:
              type: array
              description: |
                Produtos que podem ser adicionados à assinatura. O formato de cada
                item depende do tipo da assinatura: produtos Shopify ou produtos
                internos da Appmax.
              items:
                oneOf:
                  - $ref: '#/components/schemas/SubscriptionAvailableShopifyProduct'
                  - $ref: '#/components/schemas/SubscriptionAvailableInternalProduct'

    AddSubscriptionProductsRequest:
      type: object
      required: [products]
      properties:
        products:
          type: array
          minItems: 1
          description: Lista de produtos a adicionar.
          items:
            type: object
            description: |
              Identifique o produto conforme o tipo da assinatura: `product_id`
              (produto interno da Appmax) ou `shopify_product_id` +
              `shopify_variant_id` (produto da Shopify). Use `qty` ou `quantity`
              para a quantidade.
            properties:
              product_id:
                type: integer
                minimum: 1
                description: Produto interno da Appmax. Usado em assinaturas de produtos internos.
                example: 55
              shopify_product_id:
                type: string
                description: Produto na Shopify. Exigido junto de `shopify_variant_id`.
                example: '123'
              shopify_variant_id:
                type: string
                description: Variante na Shopify. Exigido junto de `shopify_product_id`.
                example: '456'
              name:
                type: string
                description: |
                  Opcional e apenas informativo — nome, preço e SKU são resolvidos
                  do cadastro do produto (interno) ou da variante (Shopify).
                example: Camiseta Branca
              price:
                type: number
                description: Opcional e apenas informativo. Veja `name`.
                example: 189.9
              sku:
                type: string
                description: Opcional e apenas informativo. Veja `name`.
                example: SKU-2
              qty:
                type: integer
                minimum: 1
                description: Quantidade (alias de `quantity`).
                example: 1
              quantity:
                type: integer
                minimum: 1
                description: Quantidade do produto cobrada a cada ciclo.
                example: 1

    UpdateSubscriptionProductQuantityRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
          description: Nova quantidade do produto.
          example: 3

    MessageErrorEnvelope:
      type: object
      description: Formato padrão de erro da API com mensagem simples.
      properties:
        errors:
          type: object
          properties:
            message:
              type: string
              description: Descrição do erro.

    ProductResource:
      type: object
      description: Representação de um produto do catálogo retornada pela API.
      properties:
        id:
          type: integer
          description: Identificador único do produto.
          example: 10
        sku:
          type: [string, 'null']
          description: Código interno do produto (SKU). Único por company.
          example: SKU-1
        name:
          type: string
          description: Nome do produto.
          example: Camiseta Preta
        price:
          type: number
          description: Preço de venda.
          example: 199.9
        description:
          type: [string, 'null']
          description: Descrição do produto.
          example: Camiseta 100% algodão
        image:
          type: [string, 'null']
          description: Caminho ou URL da imagem.
          example: /uploads/a.png
        inventory:
          type: integer
          description: Quantidade em estoque.
          example: 5
        cost:
          type: [number, 'null']
          description: Custo do produto.
          example: 50.0
        is_active:
          type: boolean
          description: Indica se o produto está ativo. Produtos excluídos ficam `false`.
          example: true
        created_at:
          type: string
          description: Data/hora de criação (`YYYY-MM-DD HH:MM:SS`).
          example: '2026-07-01 10:00:00'
        updated_at:
          type: string
          description: Data/hora da última atualização (`YYYY-MM-DD HH:MM:SS`).
          example: '2026-07-02 12:00:00'

    CreateProductRequest:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
          maxLength: 255
          description: Nome do produto.
          example: Camiseta Preta
        price:
          type: number
          minimum: 0
          description: Preço de venda. Maior ou igual a 0.
          example: 199.9
        sku:
          type: string
          maxLength: 100
          description: Código interno do produto. Único por company.
          example: SKU-1
        external_id:
          type: string
          maxLength: 255
          description: Identificador externo do produto. Único por company.
          example: EXT-123
        description:
          type: string
          description: Descrição livre do produto.
          example: Camiseta 100% algodão
        image:
          type: string
          description: Caminho ou URL da imagem.
          example: /uploads/a.png
        inventory:
          type: integer
          minimum: 0
          default: 0
          description: Quantidade em estoque. Maior ou igual a 0.
          example: 5
        cost:
          type: number
          minimum: 0
          description: Custo do produto. Maior ou igual a 0.
          example: 50.0

    UpdateProductRequest:
      type: object
      description: |
        Envie apenas os campos que deseja alterar. Todos são opcionais e seguem
        as mesmas regras da criação.
      properties:
        name:
          type: string
          maxLength: 255
          example: Camiseta Preta Slim
        price:
          type: number
          minimum: 0
          example: 219.9
        sku:
          type: string
          maxLength: 100
          description: Único por company.
          example: SKU-1
        external_id:
          type: string
          maxLength: 255
          description: Único por company.
          example: EXT-123
        description:
          type: string
          example: Camiseta 100% algodão
        image:
          type: string
          example: /uploads/a.png
        inventory:
          type: integer
          minimum: 0
          example: 5
        cost:
          type: number
          minimum: 0
          example: 50.0

    ProductResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ProductResource'

    ListProductsResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            products:
              type: array
              items:
                $ref: '#/components/schemas/ProductResource'
            pagination:
              type: object
              properties:
                total:
                  type: integer
                  description: Total de produtos que atendem ao filtro.
                  example: 1
                per_page:
                  type: integer
                  description: Itens por página. Fixo em 20.
                  example: 20
                current_page:
                  type: integer
                  description: Página atual.
                  example: 1
                last_page:
                  type: integer
                  description: Última página disponível.
                  example: 1

    ProductErrorEnvelope:
      type: object
      description: Formato padrão de erro da API V4 com mensagem simples.
      properties:
        errors:
          type: object
          properties:
            message:
              type: string
              description: Descrição do erro.

    CreateOrderRequest:
      type: object
      required: [customer_id, products]
      properties:
        customer_id:
          type: integer
          description: ID do cliente (obtido na criação do cliente).
          example: 29
        products:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Product'
          description: Lista de produtos do pedido.
        products_value:
          type: integer
          minimum: 0
          description: |
            Valor total dos produtos em **centavos**. Obrigatório quando
            `unit_value` não é informado nos produtos.
          example: 12300
        discount_value:
          type: integer
          minimum: 0
          description: Valor do desconto em **centavos**.
          example: 0
        shipping_value:
          type: integer
          minimum: 0
          description: Valor do frete em **centavos**.
          example: 3999

    Order:
      type: object
      properties:
        id:
          type: integer
          description: Identificador do pedido na Appmax.
          example: 1
        status:
          type: string
          description: Status do pedido. Veja [Status de pedidos](/guides/status-pedidos).
          example: pendente

    CreateOrderResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            order:
              $ref: '#/components/schemas/Order'

    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string

    ValidationErrorEnvelope:
      type: object
      properties:
        errors:
          type: object
          properties:
            message:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
              description: |
                Mapa `campo -> [mensagens de erro]` com a descrição do problema
                em cada campo inválido.

    OrderAmounts:
      type: object
      description: Detalhamento dos valores do pedido, todos em **centavos**.
      properties:
        sub_total:
          type: integer
          description: Subtotal dos produtos (em centavos).
          example: 4662
        shipping_value:
          type: integer
          description: Valor do frete (em centavos).
          example: 2738
        discount:
          type: integer
          description: Valor do desconto aplicado (em centavos).
          example: 0
        installment_fee:
          type: integer
          description: Taxa de parcelamento, quando aplicável (em centavos).
          example: 1516

    OrderDetail:
      type: object
      description: |
        Dados detalhados do pedido. Veja [Status de pedidos](/guides/status-pedidos)
        para o significado do campo `status`.
      properties:
        id:
          type: integer
          description: Identificador do pedido na Appmax.
          example: 3531
        status:
          type: string
          description: Status atual do pedido.
          example: estornado
        total_paid:
          type: integer
          description: Valor total pago em **centavos**.
          example: 8916
        amounts:
          $ref: '#/components/schemas/OrderAmounts'
        created_at:
          type: string
          description: Data/hora de criação do pedido (`YYYY-MM-DD HH:mm:ss`).
          example: '2025-02-13 14:09:48'
        updated_at:
          type: string
          description: Data/hora da última atualização do pedido.
          example: '2025-02-13 14:11:55'

    OrderCustomer:
      type: object
      description: Dados do cliente vinculado ao pedido.
      properties:
        id:
          type: integer
          description: ID do cliente.
          example: 2023
        name:
          type: string
          description: Nome completo do cliente.
          example: Junior Almeida
        email:
          type: string
          description: E-mail do cliente.
          example: junior.almeida@teste.com
        document_number:
          type: string
          description: CPF ou CNPJ do cliente (apenas dígitos).
          example: '19100000000'

    OrderPaymentCard:
      type: object
      description: Dados do cartão utilizado, quando o método for `creditcard`.
      properties:
        brand:
          type: string
          description: Bandeira do cartão.
          example: visa
        number:
          type: string
          description: Número do cartão mascarado.
          example: 400000****0010

    OrderPayment:
      type: object
      description: |
        Dados do pagamento. Pode estar vazio quando o pagamento ainda não foi
        processado.
      properties:
        method:
          type: string
          description: 'Método utilizado: `creditcard`, `pix`, `boleto` ou `apple_pay`.'
          example: creditcard
        installments:
          type: integer
          description: Número de parcelas (somente cartão de crédito).
          example: 12
        installments_amount:
          type: integer
          description: Valor de cada parcela em **centavos**.
          example: 743
        card:
          $ref: '#/components/schemas/OrderPaymentCard'
        pix:
          $ref: '#/components/schemas/OrderPaymentPix'
        paid_at:
          type: string
          description: Data/hora da confirmação do pagamento.
          example: '2025-02-13 14:10:20'

    OrderPaymentPix:
      type: object
      description: |
        Dados do pagamento PIX. Presente apenas quando `method` é `pix`.
      properties:
        end_to_end_id:
          type: string
          description: Identificador único da transação PIX no Banco Central (E2EID). Vazio enquanto o pagamento não for confirmado.
          example: 0F362453123GGF
        pay_reference:
          type: string
          description: Identificador da transação PIX no sistema (txid).
          example: 12150f98e957540ba46b297be99afce971c
        creation_date:
          type: string
          description: Data/hora de criação da cobrança PIX, formato `Y-m-d H:i:s`.
          example: '2026-02-11 09:23:29'
        expiration_date:
          type: string
          description: Data/hora de expiração da cobrança PIX, formato `Y-m-d H:i:s`.
          example: '2026-02-11 09:53:29'

    OrderRefund:
      type: object
      description: |
        Dados do reembolso. Pode estar vazio caso o pedido não tenha sido
        estornado.
      properties:
        refunded_at:
          type: string
          description: Data/hora do estorno.
          example: '2025-02-13 14:11:55'

    GetOrderResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            order:
              $ref: '#/components/schemas/OrderDetail'
            customer:
              $ref: '#/components/schemas/OrderCustomer'
            payment:
              $ref: '#/components/schemas/OrderPayment'
            refund:
              $ref: '#/components/schemas/OrderRefund'

    CustomerAddress:
      type: object
      description: Endereço do cliente.
      properties:
        postcode:
          type: string
          description: CEP (apenas dígitos).
          example: '91520270'
        street:
          type: string
          description: Logradouro.
          example: Rua Francisco Carneiro da Rocha
        number:
          type: string
          description: Número do endereço.
          example: '582'
        complement:
          type: string
          description: Complemento (opcional).
          example: Casa
        district:
          type: string
          description: Bairro.
          example: Moinhos de Ventos
        city:
          type: string
          description: Cidade.
          example: Porto Alegre
        state:
          type: string
          description: UF.
          example: RS

    CustomerTracking:
      type: object
      description: Dados de origem da visita (UTMs).
      additionalProperties:
        type: string
      example:
        utm_source: google
        utm_campaign: teste

    CreateOrUpdateCustomerRequest:
      type: object
      required: [first_name, last_name, email, phone, ip]
      properties:
        first_name:
          type: string
          description: Nome do cliente.
          example: Junior
        last_name:
          type: string
          description: Sobrenome do cliente.
          example: Almeida
        email:
          type: string
          description: E-mail válido do cliente.
          example: junior.almeida@email.com
        phone:
          type: string
          description: Telefone com DDD (máximo 11 caracteres).
          example: '51983655100'
        ip:
          type: string
          description: IP de origem do cliente (coletado via Appmax JS).
          example: 127.0.0.1
        document_number:
          type: string
          description: CPF ou CNPJ do cliente.
          example: '25226493029'
        address:
          $ref: '#/components/schemas/CustomerAddress'
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
          description: Lista de produtos vinculados ao cliente.
        tracking:
          $ref: '#/components/schemas/CustomerTracking'
        cart_link:
          type: string
          description: |
            URL do carrinho abandonado. Envie este campo para acionar a
            [recuperação de vendas com IA](/guides/recuperacao-vendas-ia)
            (funcionalidade em fase beta).
          example: https://subdomain.domain.com/cart/123-345-678

    CreateCustomerResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            customer:
              type: object
              properties:
                id:
                  type: integer
                  description: ID do cliente criado/atualizado.
                  example: 1

    TrackingCodeRequest:
      type: object
      required: [order_id, shipping_tracking_code]
      properties:
        order_id:
          type: integer
          description: ID do pedido.
          example: 2
        shipping_tracking_code:
          type: string
          description: Código de rastreio do pedido.
          example: EEEASDASDAS1239A

    UpsellRequest:
      type: object
      required: [upsell_hash, products_value, products]
      properties:
        upsell_hash:
          type: string
          description: Hash do pedido para upsell (gerado no pagamento por cartão).
          example: '4000114202503117156088040208561001715608804'
        products_value:
          type: integer
          minimum: 0
          description: Valor total dos produtos do upsell (em **centavos**).
          example: 12300
        products:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Product'

    CreditCardData:
      type: object
      description: Dados do cartão. Use `token` (tokenização prévia) **ou** os dados completos do cartão.
      properties:
        token:
          type: string
          description: Token do cartão (obtido via tokenização).
          example: 422146c7523a46119d6073ea56193913
        number:
          type: string
          description: Número do cartão.
          example: '4444222222222222'
        cvv:
          type: string
          description: Código de segurança (máximo 4 caracteres).
          example: '123'
        expiration_month:
          type: string
          description: Mês de expiração (1 a 12).
          example: '1'
        expiration_year:
          type: string
          description: Ano de expiração (2 a 4 caracteres).
          example: '25'
        holder_document_number:
          type: string
          description: CPF ou CNPJ do titular do cartão.
          example: '19100000000'
        holder_name:
          type: string
          description: Nome do titular do cartão.
          example: Teste teste
        installments:
          type: integer
          minimum: 1
          description: 'Número de parcelas. O teto é o configurado para a loja — 12 por padrão, e maior quando ela tem parcelamento estendido habilitado. No Apple Pay o limite é fixo em 12.'
          example: 1
        soft_descriptor:
          type: string
          description: Texto exibido na fatura do cartão.
          example: MYSTORE

    Subscription:
      type: object
      description: |
        **Pendente de especificação.** Placeholder criado só para destravar a
        resolução de `$ref` no restante da spec — o formato real de
        `payment_data.subscription` ainda não foi documentado. Antes de usar
        em produção, substituir pelos campos reais (ex.: os mesmos de
        `CreateSubscriptionRequest`, sem `order_id`, ou outro formato a
        confirmar com o time responsável).

    CreditCardPaymentRequest:
      type: object
      required: [order_id, customer_id, payment_data]
      properties:
        order_id:
          type: integer
          description: ID do pedido.
          example: 12345
        customer_id:
          type: integer
          description: ID do cliente.
          example: 407
        payment_data:
          type: object
          required: [credit_card]
          properties:
            credit_card:
              $ref: '#/components/schemas/CreditCardData'
            subscription:
              $ref: '#/components/schemas/Subscription'

    PixData:
      type: object
      properties:
        document_number:
          type: string
          description: CPF ou CNPJ do pagador.
          example: '19100000000'
        expiration_date:
          type: string
          description: |
            Opcional. Data/hora de vencimento do Pix, formato `Y-m-d H:i:s`
            no fuso de Brasília (`America/Sao_Paulo`). Precisa ser uma data
            futura. Se omitido, o vencimento segue a configuração da loja.
          example: '2026-09-10 15:00:00'

    PixPaymentRequest:
      type: object
      required: [order_id]
      properties:
        order_id:
          type: integer
          description: ID do pedido.
          example: 113
        payment_data:
          type: object
          properties:
            pix:
              $ref: '#/components/schemas/PixData'
            subscription:
              $ref: '#/components/schemas/Subscription'

    BoletoData:
      type: object
      required: [document_number]
      properties:
        document_number:
          type: string
          description: CPF ou CNPJ do pagador.
          example: '19100000000'

    BoletoPaymentRequest:
      type: object
      required: [order_id, payment_data]
      properties:
        order_id:
          type: integer
          description: ID do pedido.
          example: 113
        payment_data:
          type: object
          required: [boleto]
          properties:
            boleto:
              $ref: '#/components/schemas/BoletoData'

    ApplePayToken:
      type: object
      description: Apple Pay Token devolvido pela PaymentSheet do Safari.
      properties:
        data:
          type: string
        signature:
          type: string
        header:
          type: object
          properties:
            publicKeyHash:
              type: string
            ephemeralPublicKey:
              type: string
            transactionId:
              type: string
        version:
          type: string
          example: EC_v1

    ApplePayMethod:
      type: object
      properties:
        displayName:
          type: string
          example: Visa 3714
        network:
          type: string
          example: Visa
        type:
          type: string
          example: credit

    ApplePayData:
      type: object
      properties:
        installments:
          type: integer
          minimum: 1
          maximum: 12
          description: 'Número de parcelas, de 1 a 12. O teto aqui é fixo — veja o aviso sobre parcelamento estendido na descrição do endpoint.'
          example: 3
        holder_document_number:
          type: string
          example: '22233344450'
        soft_descriptor:
          type: string
          example: EXEMPLOLOJA
        payment_data:
          $ref: '#/components/schemas/ApplePayToken'
        payment_method:
          $ref: '#/components/schemas/ApplePayMethod'
        transaction_identifier:
          type: string
          example: trx....wvu

    ApplePayPaymentRequest:
      type: object
      required: [order_id, customer_id, payment_data]
      properties:
        order_id:
          type: integer
          example: 123
        customer_id:
          type: integer
          example: 456
        payment_data:
          type: object
          required: [apple_pay]
          properties:
            apple_pay:
              $ref: '#/components/schemas/ApplePayData'
    GooglePayData:
      type: object
      required: [installments, holder_document_number, payment_data]
      properties:
        installments:
          type: integer
          minimum: 1
          maximum: 12
          description: 'Número de parcelas, de 1 a 12.'
          example: 2
        holder_document_number:
          type: string
          description: CPF ou CNPJ do portador.
          example: '51425014038'
        soft_descriptor:
          type: string
          maxLength: 13
          description: Texto exibido na fatura, até 13 caracteres.
          example: MINHALOJA
        payment_data:
          $ref: '#/components/schemas/GooglePayPaymentMethodData'
    GooglePayPaymentMethodData:
      type: object
      description: 'O `paymentMethodData` recebido no `onAuthorize` do Appmax JS, integral e sem alteração. Os campos já vêm preenchidos pelo Google.'
      required: [tokenizationData, info]
      properties:
        type:
          type: string
          example: CARD
        description:
          type: string
          example: 'Visa •••• 1234'
        tokenizationData:
          type: object
          required: [type, token]
          properties:
            type:
              type: string
              description: Sempre `PAYMENT_GATEWAY`.
              example: PAYMENT_GATEWAY
            token:
              type: string
              description: 'O token, como string. Não aplicar parse — o parse é feito pela Appmax.'
              example: '{"signature":"MEUCIQ...","protocolVersion":"ECv2","signedMessage":"{...}"}'
        info:
          type: object
          required: [cardNetwork]
          properties:
            cardNetwork:
              type: string
              description: Bandeira devolvida pelo Google.
              example: VISA
            cardDetails:
              type: string
              description: Quatro últimos dígitos, utilizados no comprovante.
              example: '1234'
            assuranceDetails:
              type: object
              description: Dados de verificação do Google. Repassar sem alteração.
              properties:
                accountVerified:
                  type: boolean
                  example: true
                cardHolderAuthenticated:
                  type: boolean
                  example: true
    GooglePayPaymentRequest:
      type: object
      required: [order_id, customer_id, payment_data]
      properties:
        order_id:
          type: integer
          description: Pedido a ser pago, retornado por `POST /v1/orders`.
          example: 3
        customer_id:
          type: integer
          description: Cliente, retornado por `POST /v1/customers`.
          example: 7
        payment_data:
          type: object
          required: [google_pay]
          properties:
            google_pay:
              $ref: '#/components/schemas/GooglePayData'

    TokenizeRequest:
      type: object
      required: [payment_data]
      properties:
        payment_data:
          type: object
          required: [credit_card]
          properties:
            credit_card:
              type: object
              required: [number, cvv, expiration_month, expiration_year, holder_name]
              properties:
                number:
                  type: string
                  description: Número do cartão de crédito.
                  example: '4444222222222222'
                cvv:
                  type: string
                  description: Código de segurança (máximo 4 caracteres).
                  example: '123'
                expiration_month:
                  type: string
                  description: Mês de expiração (1 a 12).
                  example: '12'
                expiration_year:
                  type: string
                  description: Ano de expiração (2 a 4 caracteres).
                  example: '28'
                holder_name:
                  type: string
                  description: Nome do titular do cartão.
                  example: John Doe

    InstallmentsRequest:
      type: object
      required: [installments, total_value]
      properties:
        installments:
          type: integer
          minimum: 1
          maximum: 12
          description: Número de parcelas desejado.
          example: 10
        total_value:
          type: integer
          minimum: 0
          description: Valor total do pedido em **centavos**.
          example: 10000
        settings:
          type: boolean
          description: Quando `true`, retorna as configurações de parcelamento do merchant.
          example: true

    RefundRequest:
      type: object
      required: [order_id, type]
      properties:
        order_id:
          type: integer
          description: ID do pedido.
          example: 1
        type:
          type: string
          enum: [total, partial]
          description: 'Tipo de reembolso. Padrão: `total`.'
          example: total
        value:
          type: integer
          minimum: 0
          description: Valor do reembolso em **centavos**. Obrigatório quando `type = partial`.
          example: 10000

    MerchantSessionRequest:
      type: object
      required: [store_url, external_id]
      properties:
        store_url:
          type: string
          description: >-
            Hostname do domínio do checkout em que o Apple Pay vai rodar —
            **sem** `https://` e **sem** caminho (ex.: `window.location.hostname`
            no browser). Enviar a URL completa faz a Apple recusar a sessão
            com "domainName must be a fully qualified domain name without
            scheme or path".
          example: checkout.minhaloja.com.br
        external_id:
          type: string
          description: UUID da loja gerado durante a instalação.
          example: 37bb0791-ee0b-457d-860c-186e32978bcd

    RecipientTriage:
      type: object
      required: [revenue, storeUrl]
      properties:
        revenue:
          type: integer
          description: Faturamento mensal online em reais (inteiro). `1000` = R$ 1.000,00.
          example: 10000
        storeUrl:
          type: string
          description: URL da página de vendas da loja.
          example: 'https://exemplo-loja.com.br'

    RecipientAccount:
      type: object
      required: [email, name, cpf, phone, dateOfBirth]
      properties:
        email:
          type: string
          description: E-mail do titular da conta.
          example: usuario@exemplo.com
        name:
          type: string
          description: Nome completo do titular.
          example: Nome do Usuário
        cpf:
          type: string
          description: CPF do titular (apenas dígitos).
          example: '00000000000'
        phone:
          type: string
          description: Telefone do titular.
          example: '11900000000'
        dateOfBirth:
          type: string
          description: Data de nascimento (YYYY-MM-DD).
          example: '1990-01-01'

    RecipientCompany:
      type: object
      required:
        [companyName, companyDocumentNumber, companyPostcode, companyAddress,
         companyAddressNumber, companyAddressState, companyAddressNeighborhood,
         companyCity]
      properties:
        companyName:
          type: string
          description: Razão social da empresa.
          example: Empresa Exemplo LTDA
        companyDocumentNumber:
          type: string
          description: CNPJ da empresa — apenas dígitos, 14 posições, sem pontuação.
          example: '00000000000000'
        companyPostcode:
          type: string
          description: CEP do endereço da empresa (apenas dígitos).
          example: '00000000'
        companyAddress:
          type: string
          description: Logradouro (rua, avenida) do endereço da empresa.
          example: Rua Exemplo
        companyAddressNumber:
          type: string
          description: Número do endereço.
          example: '100'
        companyAddressState:
          type: string
          description: Estado (UF) em duas letras.
          example: SP
        companyAddressNeighborhood:
          type: string
          description: Bairro.
          example: Bairro Exemplo
        companyCity:
          type: string
          description: Cidade.
          example: São Paulo
        companyAddressComplement:
          type: string
          description: Complemento do endereço (opcional).
          example: Complemento

    RecipientBankAccount:
      type: object
      description: |
        Conta bancária do recebedor, usada para os saques. Se o objeto for
        enviado, **todos os campos abaixo passam a ser obrigatórios**.
      required: [bank, agency, account, bankAccountType]
      properties:
        bank:
          type: integer
          description: |
            Código do banco (COMPE). Consulte a lista completa de instituições
            homologadas em [Bancos homologados](/guides/bancos-homologados).
          example: 104
        agency:
          type: string
          description: Agência da conta, com dígito quando houver.
          example: '1234-0'
        account:
          type: string
          description: Número da conta, com dígito verificador.
          example: '12345-2'
        bankAccountType:
          type: string
          description: |
            Tipo de conta: `CC` (conta corrente), `CD` (conta digital),
            `PG` (conta de pagamento) ou `PP` (conta poupança). Veja
            [Bancos homologados](/guides/bancos-homologados).
          enum: [CC, CD, PG, PP]
          example: CC

    RecipientConfig:
      type: object
      description: |
        Configurações aplicadas no cadastro do recebedor. Quando o CPF da conta
        já pertence a um usuário da Appmax, o recebedor é vinculado a esse
        usuário: o e-mail de acesso não é enviado e
        `enableAutomaticWithdraw: true` é recusado com `422`.
      properties:
        sendAccountAccess:
          type: boolean
          description: |
            Envia ao recebedor um e-mail para redefinir a senha e acessar a
            plataforma. Enviado como booleano (`true` ou `false`). Não tem efeito
            quando o CPF já pertence a um usuário da Appmax.
          default: false
          example: true
        enableAutomaticWithdraw:
          type: boolean
          description: |
            Ativa o saque automático do recebedor: saque de todo o saldo
            disponível e antecipação do saldo a liberar, todos os dias úteis às
            08:00, na conta de recebimento cadastrada (com chave PIX). Cada
            agendamento só é criado se a empresa do recebedor ainda não tiver um
            do mesmo tipo. Recusado com `422` quando o CPF já pertence a um
            usuário da Appmax.

            Uma vez ativado, o saque automático não pode ser desativado pela API
            nem pelo próprio recebedor. Caso seja necessário desativá-lo, entre
            em contato com a Appmax: a solicitação passa por uma análise
            individual antes de ser efetivada.
          default: false
          example: false

    CreateRecipientRequest:
      type: object
      required: [triage, account, company]
      properties:
        triage:
          $ref: '#/components/schemas/RecipientTriage'
        account:
          $ref: '#/components/schemas/RecipientAccount'
        company:
          $ref: '#/components/schemas/RecipientCompany'
        bankAccount:
          $ref: '#/components/schemas/RecipientBankAccount'
        config:
          $ref: '#/components/schemas/RecipientConfig'

    UpdateRecipientRequest:
      type: object
      description: |
        Todos os blocos e campos são opcionais — envie só o que deseja alterar.
        Campos fora desta lista são ignorados.
      properties:
        account:
          type: object
          description: Dados do titular da conta.
          properties:
            name:
              type: string
              description: Nome completo do titular. Apenas letras (com ou sem acento) e espaços.
              minLength: 3
              maxLength: 255
              example: Nome do Usuário
            phone:
              type: string
              description: |
                Telefone do titular com DDD (10 ou 11 caracteres). Caracteres não
                numéricos são removidos antes de salvar. Não pode estar em uso
                por outro usuário.
              minLength: 10
              maxLength: 11
              example: '11900000000'
            dateOfBirth:
              type: string
              format: date
              description: Data de nascimento (YYYY-MM-DD). O titular precisa ter 18 anos ou mais.
              example: '1990-01-01'
        company:
          type: object
          description: Endereço da empresa.
          properties:
            companyPostcode:
              type: string
              description: CEP do endereço da empresa (apenas dígitos).
              example: '00000000'
            companyAddress:
              type: string
              description: Logradouro (rua, avenida) do endereço da empresa.
              maxLength: 255
              example: Rua Exemplo
            companyAddressNumber:
              type: string
              description: Número do endereço.
              maxLength: 45
              example: '100'
            companyAddressState:
              type: string
              description: Estado (UF) em duas letras.
              maxLength: 120
              example: SP
            companyAddressComplement:
              type: string
              description: Complemento do endereço.
              maxLength: 120
              example: Complemento
            companyAddressNeighborhood:
              type: string
              description: Bairro.
              maxLength: 120
              example: Bairro Exemplo
            companyCity:
              type: string
              description: Cidade.
              maxLength: 80
              example: São Paulo
        bankAccount:
          type: object
          description: |
            Altera a conta bancária **principal** já cadastrada do recebedor.
            Diferente do cadastro, os subcampos são independentes — envie apenas
            os que deseja alterar. **Não pode ser enviado** para recebedores
            lojistas (usuário que já possui lojas na Appmax) — nesse caso a
            requisição retorna `422`.
          properties:
            bank:
              type: string
              description: |
                Código do banco (COMPE), numérico. Precisa ser um banco
                homologado — veja [Bancos homologados](/guides/bancos-homologados).
              example: '104'
            agency:
              type: string
              description: Agência da conta, com dígito quando houver.
              maxLength: 45
              example: '1234-0'
            account:
              type: string
              description: Número da conta, com dígito verificador.
              maxLength: 45
              example: '12345-2'
            bankAccountType:
              type: string
              description: |
                Tipo de conta: `CC` (conta corrente), `CD` (conta digital),
                `PG` (conta de pagamento) ou `PP` (conta poupança).
              enum: [CC, CD, PG, PP]
              example: CC

    CreateRecipientFlexibleRequest:
      type: object
      description: |
        O endpoint realiza o cadastro de um recebedor flexível, 
        recebendo dados de triagem, identificação da conta, 
        informações cadastrais da empresa e dados bancários para vinculação da conta de recebimento.
      required: [triage, account, company]
      properties:
        triage:
          $ref: '#/components/schemas/RecipientTriage'
        account:
          type: object
          description: |
            Dados do titular. Nesta rota o envio é parcial — apenas `name` e
            `cpf` são obrigatórios.
          required: [name, cpf]
          properties:
            name:
              type: string
              description: Nome completo do titular.
              example: 'Fulano de Tal'
            cpf:
              type: string
              description: CPF do titular (apenas dígitos).
              example: '11122233344'
        company:
          type: object
          required:
            [companyName, companyDocumentNumber, companyPostcode, companyAddress,
             companyAddressNumber, companyAddressState, companyAddressComplement,
             companyAddressNeighborhood, companyCity]
          properties:
            companyName:
              type: string
              description: Razão social da empresa.
              example: 'Empresa de Testes LTDA'
            companyDocumentNumber:
              type: string
              description: CPF ou CNPJ da empresa — apenas dígitos.
              example: '00000000000191'
            companyPostcode:
              type: string
              description: CEP do endereço da empresa (apenas dígitos).
              example: '00000000'
            companyAddress:
              type: string
              description: Logradouro (rua, avenida) do endereço da empresa.
              example: 'Rua dos Testes'
            companyAddressNumber:
              type: string
              description: Número do endereço.
              example: '123'
            companyAddressState:
              type: string
              description: Estado (UF) em duas letras.
              example: SP
            companyAddressComplement:
              type: string
              description: Complemento do endereço — opcional nesta rota.
              example: 'Bloco A'
            companyAddressNeighborhood:
              type: string
              description: Bairro.
              example: 'Bairro Fictício'
            companyCity:
              type: string
              description: Cidade.
              example: 'Cidade Exemplo'
        bankAccount:
          type: object
          description: |
            Conta bancária do recebedor. Se enviado, todos os campos abaixo
            são obrigatórios. Envie `bankAccount` ou `pixKey` — nunca os dois
            ausentes.
          required: [bank, agency, account, bankAccountType]
          properties:
            bank:
              type: integer
              description: |
                Código do banco (COMPE). Consulte a lista completa em
                [Bancos homologados](/guides/bancos-homologados).
              example: 104
            agency:
              type: string
              description: Agência da conta, com dígito quando houver.
              example: '0001'
            account:
              type: string
              description: Número da conta, com dígito verificador.
              example: '12345-6'
            bankAccountType:
              type: string
              description: Tipo de conta bancária.
              oneOf:
                - const: CC
                  title: Conta Corrente
                - const: CD
                  title: Conta Digital
                - const: PG
                  title: Conta de Pagamento
                - const: PP
                  title: Conta Poupança
              example: CC
        config:
          $ref: '#/components/schemas/RecipientConfig'
        pixKey:
          type: string
          description: |
            Chave Pix do recebedor (CPF, CNPJ, e-mail, telefone ou chave
            aleatória). Obrigatório quando `bankAccount` não é enviado.
          example: 'chave-pix-exemplo'

    FacematchLinkRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          description: 'Telefone que recebe o SMS (formato com DDD: `11999999999`).'
          example: '11999999999'

    SplitItem:
      type: object
      required: [amount, recipient_hash]
      properties:
        amount:
          type: integer
          minimum: 0
          description: Valor destinado ao recebedor em **centavos**.
          example: 1000
        recipient_hash:
          type: string
          description: Hash do recebedor previamente aprovado.
          example: d9bd0dae-3274-5e5a-939f-f50d867eb652
        refund_charge_percentage:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            Porcentagem que o recebedor deve ser cobrado sobre o valor líquido em caso de estorno do pedido. (0 - 100).
          example: 0

    CreateSplitOrderRequest:
      type: object
      required: [split]
      properties:
        split:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SplitItem'

    WithdrawRequestBody:
      type: object
      required: [value]
      properties:
        value:
          type: integer
          minimum: 1
          description: Valor do saque em **centavos** (inteiro positivo).
          example: 1000

    WithdrawRequestBankAccount:
      type: object
      description: Conta bancária vinculada à solicitação de saque, no formato retornado pela consulta (não confundir com `RecipientBankAccount`, usado no cadastro do recebedor).
      properties:
        id:
          type: integer
          example: 9
        bank:
          type: string
          description: Código do banco (COMPE), como string.
          example: '66'
        agency:
          type: string
          example: '512'
        account:
          type: string
          example: '9260373'
        name:
          type: string
          nullable: true
        type:
          type: string
          description: 'Tipo da conta, ex: `national_pj`.'
          example: national_pj
        profile:
          type: string
          description: 'Perfil da conta: `CC` (conta corrente), `CD`, `PG` ou `PP`.'
          example: CC
        register_number:
          type: string
          nullable: true
        pix_key:
          type: string
          nullable: true
          example: test@test.com
        bank_account_type:
          type: string
          nullable: true

    GetWithdrawRequestResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            withdraw_request_id:
              type: integer
              example: 69
            status:
              type: string
              description: 'Status traduzido, ex: `pending`, `approved`, `refused`. Veja a lista completa em [Status do split de pagamentos](/guides/split-status).'
              example: pending
            net_value:
              type: integer
              description: Valor líquido do saque, em centavos.
              example: 984
            gross_value:
              type: integer
              description: Valor bruto do saque, em centavos.
              example: 1000
            withdraw_tax:
              type: integer
              description: Taxa de saque aplicada, em centavos.
              example: 0
            currency:
              type: string
              example: BRL
            created_at:
              type: string
              nullable: true
              description: 'Data de criação, formato `Y-m-d H:i:s`.'
              example: '2025-12-30 11:08:04'
            source_type:
              type: string
              description: 'Origem do solicitante: `recipient` ou `user`.'
              example: recipient
            source_id:
              type: string
              description: Hash do recebedor ou ID do usuário solicitante.
              example: 4471b2d1-5e30-5f4d-a64b-c18d72c82a79
            bank_account:
              $ref: '#/components/schemas/WithdrawRequestBankAccount'

    RecipientPaginationMeta:
      type: object
      properties:
        page:
          type: integer
          description: Página atual.
          example: 1
        pages:
          type: integer
          description: Total de páginas. É `0` quando não há resultados.
          example: 1
        total:
          type: integer
          description: Total de itens encontrados.
          example: 2
        limit:
          type: integer
          description: Quantidade máxima de itens por página.
          example: 20

    ListRecipientsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              recipient_hash:
                type: string
                description: Hash do recebedor, usado nas demais rotas de split.
                example: 0a0c3269-b5fa-543b-b9ad-1cf27d0944c1
              status:
                type: string
                description: |
                  Status do onboarding do recebedor. Veja
                  [Status do split de pagamentos](/guides/split-status#status-do-recebedor-recipient).
                enum:
                  - Onboarding completed
                  - Onboarding on verification
                  - Awaiting face match completion
                  - Onboarding rejected
                example: Onboarding completed
              account:
                type: object
                description: Dados da conta (pessoa) do recebedor.
                properties:
                  name:
                    type: string
                    example: Maria Souza
                  email:
                    type: string
                    example: maria.souza@exemplo.com
                  cpf:
                    type: string
                    description: CPF, sem máscara.
                    example: '35873882029'
                  phone:
                    type: string
                    example: '11976187304'
              company:
                type: object
                description: Dados da empresa do recebedor.
                properties:
                  name:
                    type: string
                    example: Souza Comércio LTDA
                  document_number:
                    type: string
                    description: CNPJ, sem máscara. Para empresas de pessoa física, é o CPF.
                    example: '97761238000171'
              created_at:
                type: string
                nullable: true
                description: 'Data de cadastro do recebedor, formato `Y-m-d H:i:s`.'
                example: '2026-10-01 14:32:10'
        meta:
          $ref: '#/components/schemas/RecipientPaginationMeta'

    ListRecipientOrdersResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              order_id:
                type: integer
                description: ID do pedido na Appmax.
                example: 500
              total:
                type: integer
                description: Valor total do pedido, em centavos.
                example: 15000
              liquid_total:
                type: integer
                description: Valor líquido do pedido (total menos as taxas da Appmax), em centavos.
                example: 14230
              recipient_amount:
                type: integer
                description: |
                  Valor destinado ao recebedor no pedido, em centavos. É a soma de
                  todos os splits do recebedor nesse pedido.
                example: 4035
        meta:
          $ref: '#/components/schemas/RecipientPaginationMeta'

    CreatePaymentLinkRequest:
      type: object
      required: [name, value, description, payments, max_installments, fee_transfer_from_installment]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 255
          description: Nome do link de pagamento.
          example: Teste Name
        value:
          type: integer
          minimum: 500
          description: Valor do link em **centavos**. Mínimo `500`.
          example: 1551
        description:
          type: string
          maxLength: 1000
          description: Descrição do link de pagamento.
          example: Description payment link
        product_type:
          type: string
          enum: [physical, digital]
          default: physical
          description: Tipo do produto.
          example: physical
        document:
          type: string
          nullable: true
          description: |
            CPF ou CNPJ vinculado ao link de pagamento. Quando informado,
            deve ser um documento válido e o merchant precisa possuir
            vínculo com a empresa deste documento.
          example: '19100000000'
        payments:
          type: array
          description: Métodos de pagamento habilitados no link.
          items:
            type: string
            enum: [creditcard, boleto, pix]
          example: [creditcard, boleto, pix]
        max_installments:
          type: integer
          minimum: 1
          maximum: 12
          default: 12
          description: Número máximo de parcelas.
          example: 12
        fee_transfer_from_installment:
          type: integer
          minimum: 0
          maximum: 12
          default: 0
          description: |
            Parcela a partir da qual o custo do parcelamento é
            absorvido/repassado. Com `0`, o custo é absorvido pelo merchant.
          example: 0
        allow_multiple_sales:
            type: boolean
            nullable: true
            default: true
            description: |
              Indica se o link de pagamento permite alterar a 
              quantidade de produtos a ser vendidos no carrinho. Quando
              `true`, permite editar a quantidade; quando
              `false`, é desativado. Por padrão,
              o valor é `true`; caso o dado não seja enviado, o link permanecerá
              com a opção ativa.
            example: true