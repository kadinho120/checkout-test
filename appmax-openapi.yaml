  /v1/recipient/{recipient_hash}/facematch-link:
    post:
      operationId: createFacematchLink
      tags: [Split]
      summary: Criar link de facematch (KYC)
      description: |
        Gera o link de facematch (KYC) para um recebedor recém-criado e envia
        um SMS com esse link para o telefone informado.

        ::: warning
        SMS **não são enviados em homologação**. Teste o disparo do facematch
        em produção.
        :::

        ::: info
        O telefone enviado neste endpoint **não precisa ser o mesmo** do
        `account.phone` usado na criação do recebedor.
        :::
      parameters:
        - $ref: '#/components/parameters/RecipientHash'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacematchLinkRequest'
            examples:
              default:
                value:
                  phone: '11999999999'
      responses:
        '201':
          description: Link de facematch criado e SMS disparado.
          content:
            application/json:
              examples:
                default:
                  value:
                    message: Facematch created successfully
        '500':
          description: Erro interno.

  /v1/recipient/{recipient_hash}/status:
    get:
      operationId: getRecipientStatus
      tags: [Split]
      summary: Consultar status do recebedor
      description: |
        Retorna o status atual do onboarding do recebedor. Use para descobrir
        se o recebedor está pronto para receber splits (`Onboarding completed`).

        Para a referência completa dos status, veja
        [Status do split de pagamentos](/guides/split-status).
      parameters:
        - $ref: '#/components/parameters/RecipientHash'
      responses:
        '200':
          description: Status retornado.
          content:
            application/json:
              examples:
                completed:
                  value:
                    data: Onboarding completed
                awaiting:
                  value:
                    data: Awaiting face match completion
                onVerification:
                  value:
                    data: Onboarding on verification
        '500':
          description: Erro interno.

  /v1/recipient/{recipient_hash}:
    put:
      operationId: updateRecipient
      tags: [Split]
      summary: Editar um recebedor
      description: |
        Atualiza os dados cadastrais de um recebedor criado em
        [`POST /v1/recipient`](/api-reference/split/criar-recebedor). A resposta
        devolve o `recipient_hash` do recebedor atualizado.

        A edição é **parcial**: todos os blocos (`account`, `company`,
        `bankAccount`) e todos os campos dentro deles são opcionais.
        Só os campos enviados são alterados — o que não for enviado permanece
        como está.

        Só é possível editar recebedores cadastrados pela própria empresa
        autenticada. Um `recipient_hash` inexistente ou de outra empresa
        retorna `404`.

        ::: warning Campos que não podem ser editados
        CPF e e-mail do titular (`account.cpf`, `account.email`), razão social
        e CPF/CNPJ da empresa (`company.companyName`,
        `company.companyDocumentNumber`, `company.personType`) e os dados de
        triagem (`triage`) **não são alterados** por este endpoint. Se forem
        enviados, são ignorados silenciosamente e a requisição retorna `200`.
        :::

        | Bloco | O que altera |
        | --- | --- |
        | `account` | Nome, telefone e data de nascimento do titular. |
        | `company` | Endereço da empresa. |
        | `bankAccount` | Conta bancária **principal** já cadastrada do recebedor. Indisponível para recebedores lojistas (ver abaixo). |

        **Telefone** — caracteres não numéricos são removidos antes de salvar.
        O número não pode estar em uso por outro usuário da Appmax.

        **Data de nascimento** — o titular precisa ser maior de idade (18 anos
        ou mais).

        **Conta bancária** — o endpoint edita a conta principal existente; ele
        não cria uma conta nova nem troca qual conta é a principal. A edição é
        recusada quando o recebedor não tem conta cadastrada, quando há uma
        solicitação de saque pendente ou quando a conta foi criada pelo Max.
        Códigos de banco (COMPE) e tipos de conta aceitos estão em
        [Bancos homologados](/guides/bancos-homologados).

        **Recebedor lojista** — quando o recebedor foi cadastrado para um
        usuário que já é lojista na Appmax (possui lojas), o bloco
        `bankAccount` não pode ser alterado por este endpoint. Enviá-lo para
        esse recebedor retorna `422` com
        `Recipient with merchant role cannot update bank account.`.

        ::: tip Validação antes da escrita
        Todas as regras de negócio acima são checadas antes de qualquer
        alteração ser salva. Se a requisição retornar `422`, **nenhum bloco
        foi alterado** — inclusive os demais blocos enviados na mesma
        requisição.
        :::
      parameters:
        - $ref: '#/components/parameters/RecipientHash'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRecipientRequest'
      responses:
        '200':
          description: Recebedor atualizado com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      recipient_hash:
                        type: string
                        description: HASH do recebedor atualizado.
                        example: d9bd0dae-3274-5e5a-939f-f50d867eb652
        '403':
          description: Token ausente ou inválido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        description: Token de autenticação ausente
                        example: Missing Authentication Token
        '404':
          description: Recebedor não encontrado ou não pertence à empresa autenticada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Mensagem de erro.
                    example: Recipient not found
        '422':
          description: |
            Erro na validação dos dados enviados ou regra de negócio que impede
            a atualização. Erros de validação trazem as mensagens agrupadas por
            campo; erros de negócio trazem a mensagem em `error`.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    title: Erro de validação
                    description: Mensagens de erro agrupadas pelo campo inválido.
                    additionalProperties:
                      type: array
                      items:
                        type: string
                  - type: object
                    title: Erro de negócio
                    properties:
                      error:
                        type: string
                        description: Motivo da recusa.
                        example: The phone number already exists.
              examples:
                menorDeIdade:
                  summary: Titular menor de 18 anos
                  value:
                    account.dateOfBirth:
                      - O parceiro deve ser maior de idade.
                dataInvalida:
                  summary: Data de nascimento em formato inválido
                  value:
                    account.dateOfBirth:
                      - O campo account.date of birth não contém uma data válida.
                telefoneTamanhoInvalido:
                  summary: Telefone fora do tamanho permitido (10 a 11 caracteres)
                  value:
                    account.phone:
                      - O campo account.phone deverá conter no mínimo 10 caracteres.
                bancoInvalido:
                  summary: Banco não homologado
                  value:
                    bankAccount.bank:
                      - The bank is not valid.
                tipoContaInvalido:
                  summary: Tipo de conta fora da lista permitida
                  value:
                    bankAccount.bankAccountType:
                      - "O tipo de conta selecionado é inválido: CC,CD,PG,PP."
                telefoneEmUso:
                  summary: Telefone já utilizado por outro usuário
                  value:
                    error: The phone number already exists.
                semContaBancaria:
                  summary: Recebedor sem conta bancária cadastrada
                  value:
                    error: Recipient has no bank account to update.
                saquePendente:
                  summary: Conta bancária com solicitação de saque pendente
                  value:
                    error: Não foi possível atualizar a conta bancária, pois há uma solicitação de saque pendente.
                contaCriadaPeloMax:
                  summary: Conta bancária criada pelo Max
                  value:
                    error: Não é possível modificar uma chave pix criada pelo Max.
                bankAccountRecebedorLojista:
                  summary: Bloco bankAccount enviado para recebedor lojista
                  value:
                    error: Recipient with merchant role cannot update bank account.
        '500':
          description: Erro do Servidor Interno.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Erro do Servidor Interno
                    example: Internal Server Error

  /v1/recipients:
    get:
      operationId: listRecipients
      tags: [Split]
      summary: Listar recebedores
      description: |
        Lista, de forma paginada, os recebedores cadastrados pelo merchant
        autenticado, do mais recente para o mais antigo. Cada item traz o
        status de onboarding — o mesmo valor retornado por
        [Consultar status do recebedor](/api-reference/split/consultar-recebedor).

        Para a referência completa dos status, veja
        [Status do split de pagamentos](/guides/split-status#status-do-recebedor-recipient).

        ::: tip Filtros
        Os filtros são opcionais, enviados como query params, e podem ser
        combinados — o recebedor precisa atender a todos. Os documentos podem
        ser enviados com ou sem máscara.
        :::
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Página a ser retornada.
          example: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Quantidade de recebedores por página.
          example: 20
        - name: email
          in: query
          required: false
          schema:
            type: string
            format: email
          description: E-mail da conta do recebedor (comparação exata).
          example: maria.souza@exemplo.com
        - name: recipient_document
          in: query
          required: false
          schema:
            type: string
          description: CPF da conta do recebedor. Precisa ser um CPF válido.
          example: 358.738.820-29
        - name: recipient_company_document
          in: query
          required: false
          schema:
            type: string
          description: |
            Documento da empresa do recebedor. Aceita CNPJ ou, para empresas de
            pessoa física, CPF. Precisa ser um documento válido.
          example: 97.761.238/0001-71
      responses:
        '200':
          description: Recebedores retornados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRecipientsResponse'
              examples:
                default:
                  value:
                    data:
                      - recipient_hash: 0a0c3269-b5fa-543b-b9ad-1cf27d0944c1
                        status: Onboarding completed
                        account:
                          name: Maria Souza
                          email: maria.souza@exemplo.com
                          cpf: '35873882029'
                          phone: '11976187304'
                        company:
                          name: Souza Comércio LTDA
                          document_number: '97761238000171'
                        created_at: '2026-10-01 14:32:10'
                      - recipient_hash: 5d25c7b6-a52d-54e7-85a8-8a17f6e2549e
                        status: Awaiting face match completion
                        account:
                          name: João Lima
                          email: joao.lima@exemplo.com
                          cpf: '52998224725'
                          phone: '21988887777'
                        company:
                          name: João Lima
                          document_number: '52998224725'
                        created_at: '2026-09-28 09:15:47'
                    meta:
                      page: 1
                      pages: 1
                      total: 2
                      limit: 20
                empty:
                  summary: Nenhum recebedor encontrado
                  value:
                    data: []
                    meta:
                      page: 1
                      pages: 0
                      total: 0
                      limit: 20
        '403':
          description: Token ausente ou inválido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        description: Token de autenticação ausente
                        example: Missing Authentication Token
        '422':
          description: Parâmetros de paginação ou filtros inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
              examples:
                default:
                  value:
                    errors:
                      message:
                        email:
                          - The E-mail must be a valid email address.
                        recipient_document:
                          - O documento do recebedor não é um CPF válido.
        '500':
          description: Erro interno.
          content:
            application/json:
              examples:
                default:
                  value:
                    error: Internal Server Error

  /v1/p/recipients:
    post:
      operationId: createRecipientPagarme
      tags: [PagarMe]
      summary: Criar recebedor (contrato PagarMe)
      description: |
        Cadastra um recebedor usando o **mesmo contrato da PagarMe v5**
        (`POST /core/v5/recipients`). É para quem já integrou recebedores na
        PagarMe e quer operar na Appmax sem reescrever a integração. O
        recebedor fica vinculado ao marketplace autenticado.

        O retorno é o objeto `recipient` da PagarMe dentro do envelope `data`.
        O `id` devolvido é o `recipient_hash` do recebedor, o identificador
        usado nas demais rotas `/v1/p/recipients/{recipient_hash}`.

        ::: warning Diferenças em relação à PagarMe
        - **Campos obrigatórios a mais:** `register_information.site_url` e
          `register_information.phone_numbers` (o primeiro telefone da lista).
          Em PJ, `managing_partners` também é obrigatório.
        - **Representante legal (PJ):** o primeiro item de `managing_partners`
          é o representante legal e vira o titular do login do recebedor na
          Appmax. Os demais sócios não são gravados.
        - **Saque e antecipação automáticos não são configurados aqui.** Veja
          a seção **Saque automático e antecipação automática** abaixo.
        - **Status inicial:** o recebedor nasce com `status: registration` e
          passa a `active` quando o onboarding (KYC) é aprovado.
        :::

        **Regras de validação principais**

        | Regra | Detalhe |
        | --- | --- |
        | Documento × tipo | `individual` exige CPF; `corporation` exige CNPJ. |
        | CPF já cadastrado | Se o CPF do titular (o `document` em PF, `managing_partners[0].document` em PJ) já existir na Appmax, a rota retorna `422` com `Recebedor já cadastrado.`, mesmo que o cadastro seja de outro marketplace. |
        | Titular da conta | `default_bank_account.holder_document` precisa ser o próprio `register_information.document`. `holder_type` precisa ser `individual` para recebedor `individual` e `company` para `corporation`. |
        | Datas | `birthdate` em `dd/mm/aaaa` ou `aaaa-mm-dd`. |
        | Nomes | `name` (PF) e `managing_partners[].name` aceitam só letras, acentos e espaços (entre 3 e 255 caracteres). |
        | Valores | `monthly_income` e `annual_revenue` em **centavos**. |
        | Banco | `bank` é o código COMPE e precisa estar entre os [bancos homologados](/guides/bancos-homologados). |
        | Tamanho | `metadata`, `default_bank_account.metadata` e `managing_partners` têm limite de ~60 KB cada; `managing_partners` aceita até 20 sócios. |

        **Saque automático e antecipação automática**

        Neste cadastro, a Appmax não aplica as configurações de saque
        automático (`transfer_settings`) nem de antecipação automática
        (`automatic_anticipation_settings`). Elas serão configuradas em rotas
        próprias de atualização do recebedor, disponíveis só depois que ele for
        aprovado. Um recebedor recém-cadastrado ainda está em `registration` e
        não pode sacar.

        | Valor enviado | Resultado |
        | --- | --- |
        | Seção ausente | Aceito |
        | `transfer_settings.transfer_enabled: false` | Aceito, sem efeito |
        | `automatic_anticipation_settings.enabled: false` | Aceito, sem efeito |
        | Demais campos da seção (`transfer_interval`, `transfer_day`, `type`, `volume_percentage`, `delay`, `days`), com a flag desligada | Aceitos e ignorados |
        | `transfer_settings.transfer_enabled: true` (ou `1` / `"1"`) | `422`, e o recebedor não é criado |
        | `automatic_anticipation_settings.enabled: true` (ou `1` / `"1"`) | `422`, e o recebedor não é criado |

        Mensagem do `422`:

        > Saque automático e Antecipação automática têm endpoints próprios de
        > configuração, disponíveis depois da Aprovação do Recebedor. Esta rota
        > não os aplica.

        A configuração ligada é recusada, e não ignorada, de propósito: se
        fosse ignorada, você acreditaria que o repasse automático ficou ativo
        quando ele não ficou. Por isso dá para reaproveitar o seu payload atual
        da PagarMe, desde que essas seções estejam desligadas ou fora dele.

        Na resposta, as duas seções voltam sempre desligadas, refletindo o que
        de fato vale para o recebedor:

        ```json
        "transfer_settings": {
          "transfer_enabled": false,
          "transfer_interval": null,
          "transfer_day": 0
        },
        "automatic_anticipation_settings": {
          "enabled": false,
          "type": "full",
          "volume_percentage": 0,
          "delay": null
        }
        ```

        ::: info Como ativar (em breve)
        Depois da aprovação, o saque automático e a antecipação automática
        serão ligados e desligados pelas rotas de atualização do recebedor:

        - [Configurar saque automático](/api-reference/pagarme/configurar-saque-automatico)
          (`PATCH /v1/p/recipients/{recipient_hash}/transfer-settings`)
        - [Configurar antecipação automática](/api-reference/pagarme/configurar-antecipacao-automatica)
          (`PATCH /v1/p/recipients/{recipient_hash}/automatic-anticipation-settings`)

        Nessas rotas, só a configuração que a Appmax executa hoje será aceita:

        - **Frequência:** saque diário (`daily`), em dia útil às 08:00.
        - **Valor sacado:** todo o saldo disponível.
        - **Antecipação:** do tipo `full`, de todo o saldo a liberar.

        Configurações semanais, mensais, em dias específicos ou com percentual
        parcial vão responder `422`.
        :::

        ::: danger Sem idempotência
        Não repita a chamada depois de uma resposta `200`, mesmo que o corpo
        venha incompleto: se o cadastro foi feito e a montagem da resposta
        falhou, a rota devolve só `id` e `code` (e, se possível, `status`).
        Uma nova tentativa com o mesmo CPF retorna `422`.
        :::

        Envie o header `Accept: application/json`; sem ele, erros de
        validação não são devolvidos em JSON.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PagarmeCreateRecipientRequest'
            examples:
              individual:
                summary: Pessoa física (individual)
                value:
                  code: erp-maria-001
                  metadata:
                    origem: erp
