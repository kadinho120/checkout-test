  /v1/orders/unified-order/partner-flexible:
    post:
      operationId: createUnifiedOrderFlexible
      tags: [Orders]
      summary: Criar um pedido unificado flexível
      description: |
        Permite criar pedidos completos em uma única requisição, centralizando
        dados do cliente, produtos, frete, pagamentos e split de pagamentos. Para
        pagamentos via PIX, o customer pode ser opcional conforme configuração
        interna.

        **Responsabilidade da rota**

        - Receber payloads de pedido em formato unificado
        - Resolver a identificação do cliente:
          - Utilizar customer_id quando informado
          - Criar um novo cliente quando apenas customer for informado
          - Em cenários de PIX com configuração habilitada, cria automaticamente um system customer (cliente com dados reaproveitados de um usuário vinculado ao site), tornando opcional customer, customer_id e document_number (pix).
        - Criar a configuração de *split de pagamentos*
        - Validar estrutura e regras de negócio
        - Normalizar os dados para o modelo aceito pela Appmax
        - Encaminhar o pedido para o fluxo de cobrança

        **Métodos de pagamento suportados**

        | Método | Regras principais |
        |--------|-------------------|
        | Cartão de crédito | Exige *token* ou objeto *card* completo |
        | Pix | Não exige o *document_number* quando a configuração de customer opcional estiver habilitada. |
        | Boleto | Exige *document_number* |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, payments]
              properties:
                customer:
                  type: array
                  description: Dados do cliente. Obrigatório caso o customer_id não seja informado. Para pagamentos via PIX, pode ser omitido quando houver configuração interna habilitando customer opcional — nesse caso, um customer técnico será utilizado automaticamente.
                  items:
                    type: object
                    required: [name, email, phones]
                    properties:
                      name:
                        type: string
                        description: 'Nome do cliente. Max: 64 caracteres.'
                      email:
                        type: string
                        description: 'E-mail do cliente. Max: 64 caracteres.'
                      phones:
                        type: array
                        default: []
                customer_id:
                  type: integer
                  format: int32
                  description: Código do cliente. Obrigatório caso não seja informado o objeto customer. Para pagamentos via PIX, pode ser omitido quando houver configuração interna habilitando customer opcional.
                ip:
                  type: string
                  description: 'Endereço IP do dispositivo que solicitou a compra no formato: IPV4 e IPV6'
                items:
                  type: array
                  description: Itens do pedido.
                  items:
                    type: object
                    required: [amount, description, quantity, code]
                    properties:
                      amount:
                        type: integer
                        format: int32
                        description: Valor unitário. Obrigatoriamente maior que zero.
                      description:
                        type: string
                        description: Descrição do item.
                      quantity:
                        type: integer
                        format: int32
                        description: Quantidade de itens.
                      code:
                        type: string
                        description: Código do item no sistema da loja.
                shipping:
                  type: array
                  description: Dados para entrega. (OPCIONAL)
                  items:
                    type: object
                    required: [amount]
                    properties:
                      amount:
                        type: integer
                        format: int32
                        description: Valor da entrega.
                      address:
                        type: array
                        description: Endereço de entrega
                        items:
                          type: object
                          required: [line_1, line_2, state, city, zip_code]
                          properties:
                            line_1:
                              type: string
                              description: Dados principais do endereço. Neste campo deve ser informado Número, Rua, Bairro, nesta ordem e separados por vírgula.
                            line_2:
                              type: string
                              description: Dados complementares do endereço. Neste campo pode ser informado complemento, referências.
                            state:
                              type: string
                              description: Estado (Código do estado no formato ISO 3166-2).
                            city:
                              type: string
                              description: Cidade.
                            zip_code:
                              type: integer
                              format: int32
                              description: Código Postal (CEP).
                payments:
                  type: array
                  description: Dados de pagamento. Billing adress obrigatório.
                  items:
                    type: object
                    properties:
                      pix:
                        type: array
                        description: Dados sobre o pagamento com pix (obrigatório caso o payment_method seja pix)
                        items:
                          type: object
                          properties:
                            document_number:
                              type: string
                              description: 'Documento do pagador (CPF). Máx.: 16 caracteres. Obrigatório, exceto em PIX com customer opcional habilitado, quando será preenchido automaticamente via system customer.'
                      boleto:
                        type: array
                        description: Dados sobre o pagamento com boleto (obrigatório caso o payment_method seja boleto).
                        items:
                          type: object
                          required: [document_number]
                          properties:
                            document_number:
                              type: string
                              description: 'Identificador do boleto. Max: 16 caracteres.'
                      creditcard:
                        type: array
                        description: Dados sobre o pagamento com cartão de crédito (obrigatório caso o payment_method seja credit_card).
                        items:
                          type: object
                          required: [installments]
                          properties:
                            installments:
                              type: integer
                              format: int32
                              description: 'Quantidade de parcelas. O teto é o configurado para a loja (12 por padrão, maior com parcelamento estendido). No Apple Pay o limite é fixo em 12.'
                            card:
                              type: array
                              description: Cartão de crédito.
                              default: []
                            card_token:
                              type: string
                              description: Token do cartão gerado pelo checkout transparente (OBRIGATÓRIO na ausência do objeto Card)
            examples:
              'Pedido com Pix sem customer e documento':
                value:
                  ip: 1.2.3.4
                  items:
                    - amount: 2000
                      description: Chaveiro do Caneta
                      quantity: 2
                      code: sku910
                  payments:
                    - payment_method: pix
                      split:
                        - amount: 1200
                          recipient_id: 72ccc884-edb6-5699-9eee-51ab34165e14
              'Pedido com Pix':
                value:
                  customer:
                    name: Vegeta Príncipe
                    email: vegetaprincipe@email.com
                    phones:
                      mobile_phone:
                        area_code: '11'
                        number: '988887777'
                  ip: 1.2.3.4
                  items:
                    - amount: 2000
                      description: Chaveiro do Caneta
                      quantity: 2
                      code: sku910
                  shipping:
                    address:
                      line_1: Rua do Rei Vegeta, 999, Distrito Real
                      line_2: Palácio de Vegeta, Sala do Trono
                      zip_code: '90265'
                      city: Cidade Vegeta
                      state: BA
                    amount: 1000
