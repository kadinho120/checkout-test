openapi: 3.1.0

info:
  title: Appmax API
  version: 1.0.0
  description: |
    API oficial da Appmax — plataforma de pagamentos com gateway, antifraude e
    adquirência integrados. Esta especificação está em prova de conceito;
    inicialmente cobre apenas `POST /v1/orders` (criação de pedido).
  contact:
    name: Suporte Appmax
    url: https://docs.appmax.com.br

servers:
  - url: https://api.appmax.com.br
    description: Produção
  - url: https://api.sandboxappmax.com.br
    description: Sandbox

tags:
  - name: Customers
    description: Cadastro de clientes vinculados aos pedidos.
  - name: Products
    description: |
      CRUD do catálogo de produtos do merchant. Cada produto pertence a uma
      *company*, resolvida automaticamente a partir das credenciais da requisição.
  - name: Orders
    description: |
      Gestão de pedidos. Pedidos sempre são vinculados a um cliente previamente
      criado em [`POST /v1/customers`](/api-reference/customers/criar-atualizar).
  - name: Payments
    description: Processamento de pagamentos por cartão, Pix, boleto, Apple Pay e Google Pay.
  - name: Subscriptions
    description: |
      Transforma um pedido aprovado em cobrança recorrente e gerencia todo o
      ciclo de vida da assinatura — status, produtos, dia de cobrança e endereço
      de entrega. Cada assinatura pertence a uma loja (*site*), resolvida a partir
      das credenciais.
  - name: Refunds
    description: Solicitação de estornos totais ou parciais.
  - name: Payment Links
    description: |
      Criação e consulta de links de pagamento — uma URL de checkout hospedada
      pela Appmax, sem necessidade de criar pedido e pagamento pela API.
  - name: Split
    description: |
      Onboarding de recebedores (KYC) e divisão de valores de pedidos. Veja a
      [visão geral](/guides/split-pagamentos) para o fluxo completo.
  - name: PagarMe
    description: |
      Rotas de recebedor no contrato da PagarMe v5, para quem já integrou
      recebedores na PagarMe operar na Appmax sem reescrever a integração.

security:
  - bearerAuth: []

paths:
  /v1/orders:
    post:
      operationId: createOrder
      tags: [Orders]
      summary: Criar um pedido
      description: |
        Cria um novo pedido na Appmax. Um pedido deve estar sempre vinculado a um
        cliente previamente criado.

        ::: warning Pré-requisito
        Para criar um pedido, você precisa ter o `customer_id` do cliente. Caso
        ainda não tenha, veja
        [Criar ou atualizar cliente](/api-reference/customers/criar-atualizar).
        :::

        Armazene o `order_id` retornado, pois ele será necessário para efetuar o
        pagamento ou consultar o status do pedido. Para entender como o valor
        total é calculado, veja
        [Cálculo do valor total](/api-reference/orders/calculo-valor).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            examples:
              default:
                summary: Pedido com 1 produto digital
                value:
                  customer_id: 29
                  products_value: 12300
                  discount_value: 0
                  shipping_value: 3999
                  products:
                    - sku: '9000010'
                      name: Livro de receitas
                      quantity: 1
                      unit_value: 12300
                      type: digital
      responses:
        '201':
          description: Pedido criado com sucesso. O pedido é criado com status `pendente` até que o pagamento seja processado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
              examples:
                default:
                  value:
                    data:
                      order:
                        id: 1
                        status: pendente
        '404':
          description: Cliente ou dados não encontrados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                merchantNotFound:
                  value:
                    error:
                      message: Merchant not found
        '422':
          description: Erro de validação dos campos do payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
              examples:
                default:
                  value:
                    errors:
                      message:
                        products_value:
                          - The products value must be an integer.
                        shipping_value:
                          - The shipping value must be an integer.
                        products:
                          - The products field is required.

  /v1/orders/{order_id}:
    get:
      operationId: getOrder
      tags: [Orders]
      summary: Consultar dados de um pedido
      description: |
        Consulta os detalhes de um pedido previamente criado para um merchant.
        Basta informar o ID do pedido na URL.

        Veja a [lista completa de status](/guides/status-pedidos) para entender
        o campo `status` retornado.
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: integer
          description: ID do pedido na Appmax.
          example: 3531
      responses:
        '200':
          description: Detalhes do pedido retornados com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrderResponse'
              examples:
                creditcard:
                  summary: Pedido aprovado e estornado
                  value:
                    data:
                      order:
                        id: 3531
                        status: estornado
                        total_paid: 8916
                        amounts:
                          sub_total: 4662
                          shipping_value: 2738
                          discount: 0
                          installment_fee: 1516
                        created_at: '2025-02-13 14:09:48'
                        updated_at: '2025-02-13 14:11:55'
                      customer:
                        id: 2023
                        name: Junior Almeida
                        email: junior.almeida@teste.com
                        document_number: '19100000000'
                      payment:
                        method: creditcard
                        installments: 12
                        installments_amount: 743
                        card:
                          brand: visa
                          number: 400000****0010
                        paid_at: '2025-02-13 14:10:20'
                      refund:
                        refunded_at: '2025-02-13 14:11:55'
                pix:
                  summary: Pedido pago com PIX
                  value:
                    data:
                      order:
                        id: 12150
                        status: aprovado
                        total_paid: 5000
                        amounts:
                          sub_total: 4000
                          shipping_value: 1000
                          discount: 0
                        created_at: '2026-02-11 09:23:26'
                        updated_at: '2026-09-10 15:27:03'
                      customer:
                        id: 6768
                        name: Vegeta
                        email: vegetaprincipe@email.com
                        document_number: '19100000000'
                      payment:
                        method: pix
                        pix:
                          end_to_end_id: E09089356202210251208APIcdbe38b4
                          pay_reference: 12150f98e957540ba46b297be99afce971c
                          creation_date: '2026-02-11 09:23:29'
                          expiration_date: '2026-02-11 09:53:29'
                        paid_at: '2026-09-10 15:27:03'
                      split_orders: null
        '404':
          description: Pedido não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                orderNotFound:
                  value:
                    error:
                      message: Order not found

  /v1/orders/unified-order:
    post:
      operationId: createUnifiedOrder
      tags: [Orders]
      summary: Criar um pedido unificado
      description: |
        Permite criar pedidos completos em uma única requisição, centralizando
        dados do cliente, produtos, frete, pagamentos e split de pagamentos.

        **Responsabilidade da rota**

        - Receber payloads de pedido em formato unificado
        - Criar o cliente automaticamente quando *customer_id* não for informado
        - Criar a configuração de *split de pagamentos*
        - Validar estrutura e regras de negócio
        - Normalizar os dados para o modelo aceito pela Appmax
        - Encaminhar o pedido para o fluxo de cobrança

        **Métodos de pagamento suportados**

        | Método | Regras principais |
        |--------|-------------------|
        | Cartão de crédito | Exige *token* ou objeto *card* completo |
        | Pix | Exige *document_number* |
        | Boleto | Exige *document_number* |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer, customer_id, items]
              properties:
                customer:
                  type: array
                  description: Dados do cliente. Obrigatório caso o *customer_id* não seja informado.
                  items:
                    type: object
                    required: [name, email, phones]
                    properties:
                      name:
                        type: string
                        description: 'Nome do cliente. Max: 64 caracteres.'
                      email:
                        type: string
                        description: 'E-mail do cliente. Max: 64 caracteres.'
                      phones:
                        type: array
                        default: []
                customer_id:
                  type: integer
                  format: int32
                  description: Código do cliente. Obrigatório, caso não seja informado o objeto *customer*
                ip:
                  type: string
                  description: 'Endereço IP do dispositivo que solicitou a compra no formato: IPV4 e IPV6'
                items:
                  type: array
                  description: Itens do pedido.
                  items:
                    type: object
                    required: [amount, description, quantity, code]
                    properties:
                      amount:
                        type: integer
                        format: int32
                        description: Valor unitário. Obrigatoriamente maior que zero.
                      description:
                        type: string
                        description: Descrição do item.
                      quantity:
                        type: integer
                        format: int32
                        description: Quantidade de itens.
                      code:
                        type: string
                        description: Código do item no sistema da loja.
                shipping:
                  type: array
                  description: Dados para entrega. (OPCIONAL)
                  items:
                    type: object
                    required: [amount]
                    properties:
                      amount:
                        type: integer
                        format: int32
                        description: Valor da entrega.
                      address:
                        type: array
                        description: Endereço de entrega
                        items:
                          type: object
                          required: [line_1, line_2, state, city, zip_code]
                          properties:
                            line_1:
                              type: string
                              description: Dados principais do endereço. Neste campo deve ser informado Número, Rua, Bairro, nesta ordem e separados por vírgula.
                            line_2:
                              type: string
                              description: Dados complementares do endereço. Neste campo pode ser informado complemento, referências.
                            state:
                              type: string
                              description: Estado (Código do estado no formato ISO 3166-2).
                            city:
                              type: string
                              description: Cidade.
                            zip_code:
                              type: integer
                              format: int32
                              description: Código Postal (CEP).
                payments:
                  type: object
                  description: Dados de pagamento. Billing adress obrigatório.
                  properties:
                    split:
                      type: object
                      description: Objeto com configurações para split de pagamento
                      properties: {}
                payment:
                  type: object
                  properties:
                    split:
                      type: object
                      properties:
                        '*':
                          type: object
                          required: [amount, recipient_id]
                          properties:
                            amount:
                              type: integer
                              format: int32
                              description: Valor que deve ser splitado
                            recipient_id:
                              type: string
                              description: HASH do recebedor que deve receber o valor splitado
                            refund_charge_percentage:
                              type: integer
                              format: int32
                              description: Porcentagem que o recebedor deve ser cobrado sobre o valor líquido em caso de estorno do pedido. (0 - 100)
            examples:
              'Pedido com Boleto':
                value:
                  customer:
                    name: Vegeta Príncipe
                    email: vegetaprincipe@email.com
                    phones:
                      mobile_phone:
                        area_code: '11'
                        number: '988887777'
                  ip: 1.2.3.4
                  items:
                    - amount: 2000
                      description: Chaveiro do Caneta
                      quantity: 2
                      code: sku910
                  shipping:
                    address:
                      line_1: Rua do Rei Vegeta, 999, Distrito Real
                      line_2: Palácio de Vegeta, Sala do Trono
                      zip_code: '90265'
                      city: Cidade Vegeta
                      state: BA
                    amount: 1000
                  payments:
                    - boleto:
                        document_number: '19100000000'
                      payment_method: boleto
                      split:
                        - amount: 1200
                          recipient_id: 72ccc884-edb6-5699-9eee-51ab34165e14
                          refund_charge_percentage: 0
              'Pedido com Pix':
                value:
                  customer:
                    name: Vegeta Príncipe
                    email: vegetaprincipe@email.com
                    phones:
                      mobile_phone:
                        area_code: '11'
                        number: '988887777'
                  ip: 1.2.3.4
                  items:
                    - amount: 2000
                      description: Chaveiro do Caneta
                      quantity: 2
                      code: sku910
                  shipping:
                    address:
                      line_1: Rua do Rei Vegeta, 999, Distrito Real
                      line_2: Palácio de Vegeta, Sala do Trono
                      zip_code: '90265'
                      city: Cidade Vegeta
                      state: BA
                    amount: 1000
                  payments:
                    - pix:
                        document_number: '19100000000'
                      payment_method: pix
                      split:
                        - amount: 1200
                          recipient_id: 72ccc884-edb6-5699-9eee-51ab34165e14
                          refund_charge_percentage: 0
              'Pedido com Cartão de Crédito':
                value:
                  customer:
                    name: Vegeta Príncipe
                    email: vegetaprincipe@email.com
                    phones:
                      mobile_phone:
                        area_code: '11'
                        number: '988887777'
                  ip: 1.2.3.4
                  items:
                    - amount: 2000
                      description: Chaveiro do Caneta
                      quantity: 2
                      code: sku910
                  shipping:
                    address:
                      line_1: Rua do Rei Vegeta, 999, Distrito Real
                      line_2: Palácio de Vegeta, Sala do Trono
                      zip_code: '90265'
                      city: Cidade Vegeta
                      state: BA
                    amount: 1000
                  payments:
                    - credit_card:
                        card:
                          number: '4000000000000010'
                          holder_name: Tony Stark
                          holder_document: '19100000000'
                          exp_month: 1
                          exp_year: 30
                          cvv: '123'
                        installments: 1
                      payment_method: credit_card
                      split:
                        - amount: 1200
                          recipient_id: 72ccc884-edb6-5699-9eee-51ab34165e14
                          refund_charge_percentage: 0
              'Pedido com Token de Cartão de Crédito':
                value:
                  customer:
                    name: Vegeta Príncipe
                    email: vegetaprincipe@email.com
                    phones:
                      mobile_phone:
                        area_code: '11'
                        number: '988887777'
                  ip: 1.2.3.4
                  items:
                    - amount: 2000
                      description: Chaveiro do Caneta
                      quantity: 2
                      code: sku910
                  shipping:
                    address:
                      line_1: Rua do Rei Vegeta, 999, Distrito Real
                      line_2: Palácio de Vegeta, Sala do Trono
                      zip_code: '90265'
                      city: Cidade Vegeta
                      state: BA
                    amount: 1000
                  payments:
                    - credit_card:
                        installments: 1
                        token: 123456ABCDE
                      payment_method: credit_card
                      split:
                        - amount: 1200
                          recipient_id: 72ccc884-edb6-5699-9eee-51ab34165e14
                          refund_charge_percentage: 0
              'Pedido com Boleto e Customer ID':
                value:
                  customer_id: '86'
                  ip: 1.2.3.4
                  items:
                    - amount: 2000
                      description: Chaveiro do Caneta
                      quantity: 2
                      code: sku910
                  shipping:
                    address:
                      line_1: 10880, Malibu Point, Malibu Central
                      line_2: Comp op
                      zip_code: '90265'
                      city: Malibu
                      state: CA
                    amount: 1000
                  payments:
                    - boleto:
                        document_number: '47683264474'
                      payment_method: boleto
                      split:
                        - amount: 1200
                          recipient_id: 72ccc884-edb6-5699-9eee-51ab34165e14
                          refund_charge_percentage: 0
      responses:
        '201':
          description: '201'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      order_id:
                        type: integer
                        example: 48523
                        default: 0
                      payment:
                        type: object
                        properties:
                          cashback:
                            type: integer
                            example: 0
                            default: 0
                          pay_reference:
                            type: string
                            example: tran_jkl345mno678
                          boleto_expiration_date:
                            type: string
                            example: '2026-06-27'
                          boleto_digitable_line:
                            type: string
                            example: '23793.38128 60000.000003 00000.000400 1 92570000010000'
                          boleto_payment_code:
                            type: string
                            example: '23793.38128 60000.000003 00000.000400 1 92570000010000'
                          boleto_link_pdf:
                            type: string
                            example: 'https://api.example.com/boleto/tran_jkl345mno678.pdf'
              examples:
                Boleto:
                  value:
                    data:
                      order_id: 48523
                      payment:
                        cashback: 0
                        pay_reference: tran_jkl345mno678
                        boleto_expiration_date: '2026-06-27'
                        boleto_digitable_line: '23793.38128 60000.000003 00000.000400 1 92570000010000'
