              default:
                value:
                  order_id: 2
                  shipping_tracking_code: EEEASDASDAS1239A
      responses:
        '201':
          description: Código de rastreio incluído com sucesso.
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      message: tracking accepted
        '400':
          description: Pedido não encontrado ou falha ao armazenar o código.
        '422':
          description: Erro de validação dos campos do payload.

