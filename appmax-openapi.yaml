                      message: Recipient listing error

  /v1/p/recipients/{recipient_hash}:
    get:
      operationId: getRecipientPagarme
      tags: [PagarMe]
      summary: Consultar recebedor (contrato PagarMe)
      description: |
        Retorna um recebedor no formato da PagarMe v5
        (`GET /core/v5/recipients/{recipient_id}`). O identificador é o `id`
        devolvido no [cadastro](/api-reference/pagarme/criar-recebedor).

        A consulta é montada **só com o que a Appmax grava**, por isso o
        objeto difere do retornado no cadastro:

        - campos que a PagarMe trata como **obrigatórios** e que a Appmax não
          guarda saem `null` — `monthly_income`, `professional_occupation`,
          `trading_name`, `annual_revenue`;
        - campos **opcionais** que a Appmax não guarda são omitidos — `code`,
          `metadata`, `mother_name`, `site_url`, `corporation_type`,
          `founding_date`, o `type` dos telefones e o `metadata` da conta;
        - em PJ, `managing_partners` traz só o representante legal (o primeiro
          sócio enviado no cadastro);
        - na conta bancária, a agência volta com o dígito junto em
          `branch_number`, sem `branch_check_digit`. `default_bank_account` sai
          `null` se o recebedor não tiver conta.

        Um recebedor inexistente ou cadastrado por outro marketplace retorna o
        mesmo `404`.
      parameters:
        - $ref: '#/components/parameters/PagarmeRecipientHash'
      responses:
        '200':
          description: Recebedor encontrado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PagarmeRecipient'
              examples:
                corporation:
                  summary: Pessoa jurídica
                  value:
                    data:
                      id: 5d25c7b6-a52d-54e7-85a8-8a17f6e2549e
                      name: Loja do Carlos
                      email: empresa@lojadocarlos.com.br
                      document: '97761238000171'
                      type: corporation
                      payment_mode: bank_transfer
                      status: registration
                      created_at: '2026-10-07T14:32:10Z'
                      updated_at: '2026-10-07T14:32:10Z'
